<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DAD-950901-B · Easter Egg Gate 2</title>
<meta name="theme-color" content="#040b18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--void:#040b18;--navy:#0B1B3A;--neon:#38BDF8;--amber:#F2B441;
  --paper:#EAF0F7;--line:rgba(234,240,247,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--void);color:var(--paper);
  font-family:"Be Vietnam Pro",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 0%,#10243f 0%,var(--void) 68%)}
.frame{position:relative;width:100%;max-width:460px;height:100%;max-height:940px;
  background:var(--navy);overflow:hidden;display:flex;align-items:center;
  justify-content:center;padding:30px;box-shadow:0 30px 90px rgba(0,0,0,.6)}
@media(min-width:480px){.frame{border-radius:26px;height:92vh;border:1px solid rgba(255,255,255,.06)}}
.corner{position:absolute;width:22px;height:22px;border-color:var(--line);opacity:.85}
.corner.tr{top:14px;right:14px;border-top:2px solid;border-right:2px solid}
.corner.bl{bottom:14px;left:14px;border-bottom:2px solid;border-left:2px solid}
.corner.br{bottom:14px;right:14px;border-bottom:2px solid;border-right:2px solid}
/* BẪY ĐÃ VẤP: `.mid` là flex-item của `.frame`, mà flex-item được phép RỘNG HƠN
   ô chứa nó. `max-width:320px` trên máy 320px thành ra rộng đúng bằng cả màn,
   tràn qua cả padding 30px của khung — chữ chạy sát mép rồi bị cắt, mà mọi phép
   đo bên trong `.mid` vẫn báo "vừa" vì chỗ tràn nằm ở tầng trên.
   `min(320px,100%)` chốt lại: không bao giờ rộng hơn ô chứa. */
.mid{text-align:center;max-width:min(320px,100%)}
.lk{width:34px;height:40px;color:var(--amber);opacity:.9}
.eyebrow{font-family:"Oswald";font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;
  color:var(--neon);margin:20px 0 0}
h1{font-family:"Oswald";font-weight:700;text-transform:uppercase;font-size:30px;
  margin:12px 0 0;line-height:1.08}
/* Mỗi dòng của tiêu đề là MỘT HÀNG, không cho bẻ: "Easter Egg: Gate 2" mà rớt
   thành hai dòng thì đọc ra hai thứ khác nhau. Cỡ chữ do khitTit() hạ dần cho
   vừa khung — xem chú thích ở khối script. */
/* Mỗi dòng là một khối riêng, KHÔNG cho bẻ chữ.
   ĐO BẰNG scrollWidth, không phải getBoundingClientRect: phần tử `block` luôn
   rộng đúng bằng khung, nên bounding-rect lúc nào cũng "vừa" dù chữ đã tràn ra
   ngoài — hàm co chữ sẽ không bao giờ chịu hạ cỡ. scrollWidth mới là bề ngang
   thật của chữ bên trong. */
h1 .d{display:block;white-space:nowrap}
h1 .khoa{display:block;white-space:nowrap;font-size:.5em;letter-spacing:.24em;
  color:rgba(234,240,247,.5);margin-top:6px}
p{font-size:14px;line-height:1.55;color:rgba(219,230,243,.7);margin:14px 0 0}
#backHome{position:absolute;top:13px;left:13px;display:inline-flex;align-items:center;gap:8px;
  padding:8px 14px;border-radius:999px;border:1px solid var(--line);
  background:rgba(6,16,31,.55);backdrop-filter:blur(4px);font-family:"Oswald";font-size:10px;
  font-weight:500;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(234,240,247,.85);text-decoration:none}
#backHome b{color:var(--amber);font-weight:600;font-size:12px;line-height:1}
/* Nhấp nháy đúng dải màu Easter Egg của bản đồ — dùng chung @keyframes egg. */
@keyframes egg{
  0%{color:#F2B441}   20%{color:#7BE0A8}  40%{color:#63D9E8}
  60%{color:#B79BF2}  80%{color:#F49AC1}  100%{color:#F2B441}}
h1.egg{animation:egg 1.8s linear infinite}
/* Chìa khoá hồng dựng dọc — cùng một hình với dòng dẫn bên HAN-961030-A. */
.ico-key{width:13px;height:18px;flex:none;vertical-align:-3px;margin-right:5px}
.ico-key .lap{fill:#F7C6E4;animation:lapLanh 1.7s ease-in-out infinite}
.ico-key .lap.l2{animation-delay:.55s;fill:#FBD9EE}
@keyframes lapLanh{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
.ma-hang{display:flex;gap:9px;margin:15px 0 0}
.ma-hang > *{flex:1}
.ico2{font-size:12px;letter-spacing:0;vertical-align:-1px}
/* Mã mở bộ câu hỏi HAN-961030-A — phần thưởng của việc qua được Gate 2. */
.ma-wrap{margin:26px 0 0;padding:16px 14px 15px;border:1px solid var(--line);
  border-radius:14px;background:rgba(56,189,248,.06)}
.ma-lab{font-family:"Oswald";font-size:8.5px;font-weight:600;letter-spacing:.26em;
  text-transform:uppercase;color:var(--neon);margin:0}
.ma-o{display:flex;justify-content:center;gap:6px;margin:11px 0 0}
.ma-o i{width:27px;height:34px;display:flex;align-items:center;justify-content:center;
  border-radius:7px;font-family:"Oswald";font-size:16px;font-weight:600;font-style:normal;
  color:#0B1B3A;background:linear-gradient(150deg,#F2D08A,var(--amber));
  box-shadow:0 8px 18px rgba(242,180,65,.28)}
.ma-note{font-size:12px;line-height:1.55;color:rgba(219,230,243,.62);margin:11px 0 0}
/* Nút đi tiếp — chặng cuối của Gate 2 là đưa người chơi sang Map 3, không để
   họ tự mò đường về bản đồ rồi tìm lại toạ độ Hà Nội. */
.ma-go{display:block;margin:14px 0 0;padding:12px 8px;border-radius:999px;
  font-family:"Oswald";font-size:10px;font-weight:600;letter-spacing:.12em;
  white-space:nowrap;
  text-transform:uppercase;text-align:center;text-decoration:none;color:#0B1B3A;
  background:linear-gradient(135deg,#F2D08A,var(--amber));
  box-shadow:0 10px 22px rgba(242,180,65,.3)}
.ma-go:active{transform:translateY(1px)}
.ma-go.ghost{background:none;color:rgba(234,240,247,.72);border:1px solid var(--line);
  box-shadow:none;cursor:pointer;font-family:"Oswald"}
.dem{margin:14px 0 0;font-family:"Oswald";font-size:11px;font-weight:500;
  letter-spacing:.22em;text-transform:uppercase;color:rgba(219,230,243,.55)}
.dem b{font-size:19px;font-weight:600;color:var(--neon);letter-spacing:.04em}
/* ── Tem phiên bản (design system): góc phải dưới, chữ nhỏ Oswald, mờ, KHÔNG
      bắt sự kiện chuột nên không bao giờ che mất thứ gì bấm được. ── */
.vstamp{position:fixed;right:14px;bottom:42px;z-index:60;pointer-events:none;
  font-family:"Oswald",system-ui,sans-serif;font-size:8px;font-weight:500;
  letter-spacing:.22em;text-transform:uppercase;text-align:right;line-height:1.5;
  color:rgba(234,240,247,.32)}

</style>
</head>
<body>
<div id="app"><div class="frame">
  <a id="backHome" href="/"><b>&larr;</b> Bản đồ</a>
  <span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
  <div class="mid">
    <svg class="lk" viewBox="0 0 12 14" aria-hidden="true">
      <path d="M3.3 6.2V4.3a2.7 2.7 0 0 1 5.4 0v1.9" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <rect x="1.3" y="6" width="9.4" height="7.2" rx="1.5" fill="currentColor"/>
    </svg>
    <p class="eyebrow" id="vai">Player: Dongchi Bình</p>
    <h1 id="tit"><span class="d">Easter Egg: Gate 2</span><span class="khoa">Locked</span></h1>
    <p id="loi">Hẹn anh <b id="hen">00:00 ngày 01-09</b></p>
    <div class="dem" id="dem"></div>
    <div class="ma-wrap" id="maWrap" hidden>
      <p class="ma-lab"><svg class="ico-key" viewBox="0 0 16 22" aria-hidden="true"><circle cx="8" cy="6" r="3.7" fill="none" stroke="url(#kg)" stroke-width="1.7"/><path d="M8 9.7V19M8 16.4h3.1M8 13.4h2.2" fill="none" stroke="url(#kg)" stroke-width="1.7" stroke-linecap="round"/><path class="lap" d="M14.2 2.1l.5 1.35 1.35.5-1.35.5-.5 1.35-.5-1.35-1.35-.5 1.35-.5z"/><path class="lap l2" d="M1.9 15.2l.38 1 1 .38-1 .38-.38 1-.38-1-1-.38 1-.38z"/><defs><linearGradient id="kg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2A7D0"/><stop offset="1" stop-color="#D97BB6"/></linearGradient></defs></svg>Zoey’s Castle Key</p>
      <div class="ma-o" id="maO"></div>
      <div class="ma-hang">
        <button class="ma-go ghost" id="maReset" type="button">↻ Chơi lại</button>
        <a class="ma-go" id="maGo" href="/han/961030-a?from=map">Zoey’s Castle <span class="ico2">🏰👸🏻</span></a>
      </div>
    </div>
  </div>
  <span class="vstamp">V1.05<br>Last updated 16-Aug-2026</span>
</div></div>
<script>
/* ═══ VÀO ĐƯỢC ĐÂY = ĐÃ QUA GATE 2 ═══
   BẪY ĐÃ VẤP: cờ `eggWin` trước đây CHỈ được ghi ở ba chỗ bên ngoài (link hồ sơ
   trên bản đồ, nút trong khung Collected, nút ở trang pháo hoa). Ai tới thẳng
   trang này — ví dụ bấm nút "Vào Zoey's Castle" ngay dưới đây rồi quay lại —
   thì cờ không có, và Map 3 báo "chưa có chìa khoá vào lâu đài" dù vừa mới
   thắng xong. Nay chính TRANG NÀY ghi cờ: đứng ở đây nghĩa là đã qua cửa, khỏi
   phụ thuộc vào việc đi bằng đường nào. */
(function(){
  try{
    var m = JSON.parse(localStorage.getItem('mtv1') || '{}') || {};
    if(m.eggWin) return;
    m.eggWin = true;
    localStorage.setItem('mtv1', JSON.stringify(m));
  }catch(e){}
})();
/* ═══ MỘT MỐC, HAI TRẠNG THÁI ═══
   Chưa tới 00:00 ngày 01-09 giờ VN  → đếm ngược, KHÔNG phát mã.
   Từ mốc đó trở đi                  → coi như đã thắng Gate 2, phát mã.

   Mã TYRION là phần thưởng của việc THẮNG Gate 2, không phải của việc mò được
   cửa sớm. Ai lách vào đây trước lịch thì chỉ thấy đồng hồ — có vào được cửa
   cũng chưa có gì để mang đi.

   Mốc dựng bằng chuỗi ISO có múi +07:00 nên máy ở múi giờ nào cũng chốt đúng
   nửa đêm Việt Nam; ngày hiển thị cắt thẳng từ chuỗi, không qua getDate(). */
(function(){
  var y   = new Date().getFullYear();
  var ISO = y + '-09-01T00:00:00+07:00';
  var MOC = new Date(ISO).getTime();
  var d   = ISO.slice(0, 10).split('-');
  var hen = document.getElementById('hen'),
      dem = document.getElementById('dem'),
      wrap = document.getElementById('maWrap');
  hen.textContent = '00:00 ngày ' + d[2] + '-' + d[1];

  function phatMa(){
    var MA = 'TYRION', h = '';
    for(var i = 0; i < MA.length; i++) h += '<i>' + MA[i] + '</i>';
    document.getElementById('maO').innerHTML = h;
    wrap.hidden = false;
  }
  /* ═══ NÚT CHƠI LẠI TỪ ĐẦU ═══
     Đi đúng luật reset của bản đồ (hàm hardWipe bên index.html): dọn `mtv1` rồi
     ghi lại MỘT khoá duy nhất là bộ đếm R(n) — dấu vết được phép sống qua reset.
     Dọn thêm `hanv1` vì tiến độ Map 3 nằm sau Easter Egg, giữ lại thì vô lý.
     `nav1` (pí danh + bản lưu) và `msn1` (ba Mission của hồ sơ) KHÔNG đụng, y
     như nút reset trên bản đồ.
     Bấm HAI NHỊP mới ăn — nút này xoá sạch, không được để lỡ tay. */
  function ganReset(){
    var b = document.getElementById('maReset'), armed = false, t = 0;
    if(!b || b.dataset.gan) return;
    b.dataset.gan = '1';
    b.addEventListener('click', function(){
      if(!armed){
        armed = true; b.textContent = 'Chắc chưa?';
        clearTimeout(t);
        t = setTimeout(function(){ armed = false; b.textContent = '↻ Chơi lại'; }, 4000);
        return;
      }
      var R = 0;
      try{ R = (JSON.parse(localStorage.getItem('mtv1') || '{}') || {}).resetCount || 0; }catch(e){}
      try{
        ['mtv1','mtping','hanv1'].forEach(function(k){ localStorage.removeItem(k); });
        localStorage.setItem('mtv1', JSON.stringify({ resetCount: R + 1 }));
        ['mtseen','mtload','mtvisit','mtpf','msnw'].forEach(function(k){ sessionStorage.removeItem(k); });
      }catch(e){}
      b.textContent = 'Đang dọn bàn cờ…';
      setTimeout(function(){ location.href = '/'; }, 260);
    });
  }
  /* ═══ CO TIÊU ĐỀ CHO VỪA MỘT HÀNG ═══
     Các dòng của h1 đặt `nowrap`, nên dòng nào dài hơn khung sẽ TRÀN RA NGOÀI
     chứ không tự xuống hàng — đo mới biết, nhìn thì không. Hàm này hạ cỡ chữ
     dần từ 30px xuống 15px, dừng ở cỡ lớn nhất mà MỌI dòng còn vừa. Gọi lại
     khi xoay máy. */
  function khitTit(){
    var h = document.getElementById('tit');
    for(var px = 30; px >= 15; px -= 1){
      h.style.fontSize = px + 'px';
      var qua = false;
      [].forEach.call(h.querySelectorAll('.d, .khoa'), function(d){
        if(d.scrollWidth > d.clientWidth + 0.5) qua = true;
      });
      if(!qua) return;
    }
  }
  addEventListener('resize', khitTit, {passive:true});
  /* Đo TRƯỚC khi webfont về là đo nhầm: Oswald hẹp hơn font dự phòng khá nhiều,
     nên chữ vừa lúc đo rồi tràn lúc font đổi (hoặc ngược lại). Đo lại một nhịp
     nữa khi font đã sẵn sàng. */
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(khitTit);
  function p2(n){ return (n < 10 ? '0' : '') + n; }
  function tick(){
    var con = MOC - Date.now();
    if(con <= 0){
      dem.textContent = '';
      document.getElementById('loi').innerHTML = 'Phi ngựa tới Zoey’s Castle 🦄';
      /* ĐÃ PHÁ ĐẢO: đổi cả vai lẫn tiêu đề. "Easter Egg: Gate 2" phải nằm gọn
         MỘT HÀNG ở mọi bề ngang (khitTit lo việc co chữ). */
      document.getElementById('vai').textContent = 'Winner: Dongchi Bình';
      var h = document.getElementById('tit');
      h.innerHTML = '<span class="d">Phá Đảo</span><span class="d">Easter Egg: Gate 2</span>';
      h.classList.add('egg');
      khitTit();
      phatMa();
      clearInterval(t);
      return;
    }
    dem.innerHTML = '<b>' + Math.floor(con/864e5) + '</b>N '
      + '<b>' + p2(Math.floor(con%864e5/36e5)) + '</b>G '
      + '<b>' + p2(Math.floor(con%36e5/6e4)) + '</b>P '
      + '<b>' + p2(Math.floor(con%6e4/1e3)) + '</b>S';
  }
  ganReset();
  khitTit();
  tick(); var t = setInterval(tick, 1000);
})();
</script>
</body>
</html>
