<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DAD-950901-B · Easter Egg Gate 2</title>
<meta name="theme-color" content="#040b18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500&family=Press+Start+2P&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   DAD-950901-B · MỘT FILE, MỘT MẠCH, BA MÀN
     ① #scene-gate — đếm ngược tới 00:00 · 01-09
     ② #scene-game — mini-game pixel 2 vòng (RAZER → ZHAO YUN)
     ③ #scene-code — phá đảo, phát mã TYRION, đi Zoey's Castle

   Chữ nghĩa & thông số nằm hết ở config.js, file này chỉ là bộ máy.

   ⚠ CHỐNG VA CHẠM — hai màn vốn là hai trang riêng, gộp vào là đụng nhau ở
   ba chỗ: id `#app`, ba biến `--neon/--amber/--paper` (khác giá trị), và
   selector trần `h1{}` `p{}` bên màn đếm ngược sẽ ăn luôn vào markup game.
   Cách chốt: KHÔNG có biến màu nào đặt ở :root, mỗi màn tự khai trong phạm vi
   của mình; mọi selector đều phải có tiền tố `.gate-look` hoặc `#scene-game`.
   Thêm CSS mới cứ theo đúng luật đó là không bao giờ đụng.
   ═══════════════════════════════════════════════════════════════════════════ */

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:#040b18;overflow:hidden;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased}

.scene{
  display:none;position:fixed;inset:0;
  max-width:520px;margin:0 auto;
  height:100dvh;height:var(--vh,100dvh);
}
.scene.on{display:flex}

/* ═══════════════════════════════════════════════════════════════════════════
   ① + ③ MÀN ĐẾM NGƯỢC & MÀN PHÁT MÃ — dùng chung bộ áo "gate-look"
   ═══════════════════════════════════════════════════════════════════════════ */
/* ═══ BẢN GHI MƯỢN MÀU KHỐI VẬN HÀNH, KHÔNG PHẢI MÀU MÀN CỔNG ═════════════
   Bản trước lấy màu nhấn amber `#F2B441` của màn cổng. Hỏng ở chỗ: bản ghi
   KHÔNG mở từ màn cổng — nó chỉ mở từ trong Khối vận hành, mà Khối vận hành
   dùng nguyên một tông xanh lá `rgba(140,225,180,.9)`. Bấm vào một dòng chữ
   xanh lá thì bật ra một cái bảng vàng cam: hai bảng chồng lên nhau ngay trên
   màn hình, mỗi bảng một màu — đọc ra là hai chỗ khác nhau chứ không phải một
   tầng nữa của cùng một chỗ.
   Nay bộ sáu biến khớp đúng bảng màu Khối vận hành (`.kvh-hop` / `.kvh-lab`
   ngay dưới đây): cùng nền, cùng viền, cùng chữ nhấn.
   ĐỔI MÀU KHỐI VẬN HÀNH thì nhớ đổi cả sáu biến này theo. */
:root{--ls-bg:linear-gradient(180deg,#0d1a2e 0%,#070e1c 100%);--ls-fg:#EAF0F7;
  --ls-mo:rgba(234,240,247,.5);--ls-line:rgba(140,225,180,.2);
  --ls-acc:#8CE1B4;
  --ls-w:min(330px,92vw)}
.gate-look{
  --void:#040b18;--navy:#0B1B3A;--neon:#38BDF8;--amber:#F2B441;
  --paper:#EAF0F7;--line:rgba(234,240,247,.28);
  color:var(--paper);font-family:"Be Vietnam Pro",system-ui,sans-serif;
  align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 0%,#10243f 0%,var(--void) 68%);
  /* KHÔNG CHO BÔI ĐEN CHỮ ở màn đầu (cổng) và màn cuối (phát mã). Hai màn này
     toàn chữ trang trí và nút bấm, không có gì để chép. Mà chạm giữ trên điện
     thoại hay bấm nhanh hai cái trên máy tính là dính ngay một mảng xanh bôi
     đen — nhìn như trang web tài liệu, hỏng hẳn cảm giác màn hình máy.
     Riêng ô mã và mấy nút vốn đã không chọn được nên không mất gì. */
  -webkit-user-select:none;-moz-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
.gate-look .frame{
  position:relative;width:100%;height:100%;
  background:var(--navy);overflow:hidden;display:flex;align-items:center;
  justify-content:center;padding:30px;box-shadow:0 30px 90px rgba(0,0,0,.6);
}
@media(min-width:480px){.gate-look .frame{border-radius:26px;height:92dvh;
  border:1px solid rgba(255,255,255,.06)}}
.gate-look .corner{position:absolute;width:22px;height:22px;border-color:var(--line);opacity:.85}
.gate-look .corner.tr{top:14px;right:14px;border-top:2px solid;border-right:2px solid}
.gate-look .corner.bl{bottom:14px;left:14px;border-bottom:2px solid;border-left:2px solid}
.gate-look .corner.br{bottom:14px;right:14px;border-bottom:2px solid;border-right:2px solid}
/* BẪY ĐÃ VẤP: `.mid` là flex-item của `.frame`, mà flex-item được phép RỘNG HƠN
   ô chứa nó. `max-width:320px` trên máy 320px thành ra rộng đúng bằng cả màn,
   tràn qua cả padding 30px của khung — chữ chạy sát mép rồi bị cắt, mà mọi phép
   đo bên trong `.mid` vẫn báo "vừa" vì chỗ tràn nằm ở tầng trên.
   `min(320px,100%)` chốt lại: không bao giờ rộng hơn ô chứa. */
.gate-look .mid{text-align:center;max-width:min(320px,100%)}
.gate-look .lk{width:34px;height:40px;color:var(--amber);opacity:.9}
.gate-look .eyebrow{font-family:"Oswald";font-size:9.5px;letter-spacing:.28em;
  text-transform:uppercase;color:var(--neon);margin:20px 0 0}
.gate-look h1{font-family:"Oswald";font-weight:700;text-transform:uppercase;
  font-size:30px;margin:12px 0 0;line-height:1.08}
/* Mỗi dòng là một khối riêng, KHÔNG cho bẻ chữ.
   ĐO BẰNG scrollWidth, không phải getBoundingClientRect: phần tử `block` luôn
   rộng đúng bằng khung, nên bounding-rect lúc nào cũng "vừa" dù chữ đã tràn ra
   ngoài — hàm co chữ sẽ không bao giờ chịu hạ cỡ. */
.gate-look h1 .d{display:block;white-space:nowrap}
.gate-look h1 .khoa{display:block;white-space:nowrap;font-size:.5em;
  letter-spacing:.24em;color:rgba(234,240,247,.5);margin-top:6px}
.gate-look p{font-size:14px;line-height:1.55;color:rgba(219,230,243,.7);margin:14px 0 0}
.gate-look .backHome{position:absolute;top:13px;left:13px;display:inline-flex;
  align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
  border:1px solid var(--line);background:rgba(6,16,31,.55);backdrop-filter:blur(4px);
  font-family:"Oswald";font-size:10px;font-weight:500;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(234,240,247,.85);text-decoration:none}
.gate-look .backHome b{color:var(--amber);font-weight:600;font-size:12px;line-height:1}
/* Nhấp nháy đúng dải màu Easter Egg của bản đồ. */
@keyframes egg{
  0%{color:#F2B441}   20%{color:#7BE0A8}  40%{color:#63D9E8}
  60%{color:#B79BF2}  80%{color:#F49AC1}  100%{color:#F2B441}}
.gate-look h1.egg{animation:egg 1.8s linear infinite}
.gate-look .ico-key{width:13px;height:18px;flex:none;vertical-align:-3px;margin-right:5px}
.gate-look .ico-key .lap{fill:#F7C6E4;animation:lapLanh 1.7s ease-in-out infinite}
.gate-look .ico-key .lap.l2{animation-delay:.55s;fill:#FBD9EE}
@keyframes lapLanh{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
.gate-look .ma-hang{display:flex;gap:9px;margin:15px 0 0}
.gate-look .ma-hang > *{flex:1}
.gate-look .ico2{font-size:12px;letter-spacing:0;vertical-align:-1px}
.gate-look .ma-wrap{margin:26px 0 0;padding:16px 14px 15px;border:1px solid var(--line);
  border-radius:14px;background:rgba(56,189,248,.06)}
.gate-look .ma-lab{font-family:"Oswald";font-size:8.5px;font-weight:600;
  letter-spacing:.26em;text-transform:uppercase;color:var(--neon);margin:0}
.gate-look .ma-o{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:11px 0 0}
/* Khoảng trống giữa hai từ của mã — hẹp hơn một ô, đủ để mắt tách từ */
.gate-look .ma-o b{width:9px;flex:none}
/* Mã dài (trên 8 chữ) thì ô nhỏ lại, nếu không hàng tràn ra ngoài khung trên
   mấy máy 320px. Chữ vẫn to hơn cỡ chữ thường nên không khó đọc. */
.gate-look .ma-o.dai i{width:22px;height:29px;font-size:14px;border-radius:6px}
.gate-look .ma-o.dai b{width:7px}
.gate-look .ma-o i{width:27px;height:34px;display:flex;align-items:center;
  justify-content:center;border-radius:7px;font-family:"Oswald";font-size:16px;
  font-weight:600;font-style:normal;color:#0B1B3A;
  background:linear-gradient(150deg,#F2D08A,var(--amber));
  box-shadow:0 8px 18px rgba(242,180,65,.28)}
/* width:100% — <button> mặc định co theo nội dung dù đã display:block, nên nếu
   thiếu dòng này nút sẽ nằm lệch về góc trái thay vì căn giữa như thẻ <a>. */
/* ═══ BẪY ĐÃ VẤP · `hidden` KHÔNG ĂN ═══════════════════════════════════════
   `display:block` ở đây là luật của TRANG, mà `[hidden]{display:none}` chỉ là
   luật MẶC ĐỊNH của trình duyệt — luật của trang luôn thắng. Hậu quả: mọi chỗ
   trong JS viết `el.play.hidden = false` / `el.skip.hidden = false` đều VÔ
   TÁC DỤNG, ba cái nút này lúc nào cũng hiện.
   Nó phá hỏng đúng hai cửa khoá:
     · nút "Bắt đầu giải mã" hiện sẵn ngay cả khi chưa tới ngày 01-09 → bấm là
       vào game, đồng hồ đếm ngược thành ra chỉ để trang trí;
     · nút "Bỏ qua" của cửa hậu hiện sẵn cho MỌI người → khỏi cần gõ 10 nhịp,
       ai vào cũng thấy đường đi thẳng tới màn cuối.
   Một dòng dưới đây trả `hidden` về đúng nghĩa. Đặt NGAY TRÊN `.ma-go` để đọc
   tới đâu hiểu tới đó. */
.gate-look [hidden]{display:none!important}
.gate-look .ma-go{display:block;width:100%;margin:14px 0 0;padding:12px 8px;border-radius:999px;
  font-family:"Oswald";font-size:10px;font-weight:600;letter-spacing:.12em;
  white-space:nowrap;text-transform:uppercase;text-align:center;text-decoration:none;
  color:#0B1B3A;background:linear-gradient(135deg,#F2D08A,var(--amber));
  border:0;cursor:pointer;box-shadow:0 10px 22px rgba(242,180,65,.3)}
.gate-look .ma-go:active{transform:translateY(1px)}
.gate-look .ma-go.ghost{background:none;color:rgba(234,240,247,.72);
  border:1px solid var(--line);box-shadow:none}
/* Hai việc phụ (chơi lại · xem lại) chỉ là hai nút icon tròn nhỏ đặt giữa, để
   nút chính đi Zoey's Castle đứng một mình. Tên việc nằm trong tooltip nổi lên
   khi rê chuột / giữ ngón, nên không tốn chỗ mà vẫn rõ nghĩa. */
.gate-look .ma-pair{display:flex;gap:14px;margin:14px 0 0;justify-content:center}
.gate-look .ma-pair .ico-btn{
  position:relative;width:38px;height:38px;flex:none;margin:0;padding:0;
  display:flex;align-items:center;justify-content:center;border-radius:50%;
  border:1px solid var(--line);background:rgba(6,16,31,.6);
  color:rgba(234,240,247,.66);cursor:pointer;box-shadow:none;
  -webkit-tap-highlight-color:transparent;
  transition:border-color .25s,background .25s,color .25s}
.gate-look .ma-pair .ico-btn svg{width:17px;height:17px;fill:none;
  stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.gate-look .ma-pair .ico-btn:hover,
.gate-look .ma-pair .ico-btn:focus-visible{color:var(--amber);
  border-color:rgba(242,180,65,.55);background:rgba(242,180,65,.08);outline:none}
.gate-look .ma-pair .ico-btn:active{transform:translateY(1px)}
/* Tooltip nổi phía DƯỚI nút, mũi nhọn chỉ lên. Để phía trên là nó đè lên nút
   chính đi Zoey's Castle, còn phía dưới là khoảng trống sẵn có trong hộp. */
.gate-look .ma-pair .ico-btn::after,
.gate-look .ma-pair .ico-btn::before{
  position:absolute;top:calc(100% + 8px);left:50%;transform:translate(-50%,-4px);
  opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease}
.gate-look .ma-pair .ico-btn::after{
  content:attr(data-tip);white-space:nowrap;
  font-family:"Oswald";font-size:8.5px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--paper);
  background:rgba(4,11,24,.96);border:1px solid var(--line);
  border-radius:5px;padding:5px 9px}
.gate-look .ma-pair .ico-btn::before{
  content:"";top:calc(100% + 1px);width:0;height:0;
  border:4px solid transparent;border-bottom-color:var(--line)}
.gate-look .ma-pair .ico-btn:hover::after,.gate-look .ma-pair .ico-btn:focus-visible::after,
.gate-look .ma-pair .ico-btn:active::after,
.gate-look .ma-pair .ico-btn:hover::before,.gate-look .ma-pair .ico-btn:focus-visible::before,
.gate-look .ma-pair .ico-btn:active::before{opacity:1;transform:translate(-50%,0)}
/* Nút vào mini-game — tông xanh để tách khỏi nút vàng đi Map 3. */
.gate-look .ma-go.game{background:linear-gradient(135deg,#7BE0A8,#63D9E8);
  box-shadow:0 10px 22px rgba(99,217,232,.28)}
.gate-look .dem{margin:14px 0 0;font-family:"Oswald";font-size:11px;font-weight:500;
  letter-spacing:.22em;text-transform:uppercase;color:rgba(219,230,243,.55)}
.gate-look .dem b{font-size:19px;font-weight:600;color:var(--neon);letter-spacing:.04em}
/* Tem phiên bản: CĂN GIỮA dưới chân màn hình, không nhét vào góc phải nữa.
   Góc phải thì nó chen với hai dấu ngoặc `.corner` ở hai bên và lệch hẳn khỏi
   trục giữa mà cả trang đang dựa vào (mắt khoá · tiêu đề · đồng hồ · nút đều
   nằm trên trục đó) — nhìn ra ngay là thừa một mẩu chữ ở rìa.
   `left:0;right:0` + `text-align:center` để căn theo CẢ KHUNG, không phụ thuộc
   bề rộng chữ. Hai dấu ngoặc dưới chiếm dải 14..36px tính từ đáy nhưng nằm sát
   HAI MÉP, còn tem ở giữa nên không đụng nhau nữa — đặt bottom:14px cho tem
   ngồi đúng giữa hai dấu ngoặc, thành một chân trang cân đối.
   `padding` hai bên để trên máy hẹp chữ không bao giờ chạm được vào nét góc. */
/* `pointer-events` để AUTO ở CẢ HAI màn có tem, vì tem chính là cửa hậu 10
   nhịp (xem khối "CỬA HẬU" trong JS). `user-select:none` cho gõ nhanh mười
   cái không bị bôi đen chữ.

   ═══ BẪY ĐÃ VẤP · MÀN CUỐI KHÔNG BẤM ĐƯỢC VÀO TEM ═══════════════════════
   Bản trước chỉ mở `pointer-events` cho `#scene-gate`. Màn phát mã
   (`#scene-code`) dùng chung lớp `.gate-look` nên tem ở đó trơ hoàn toàn:
   khung trang trí `.frame` nằm đè lên nuốt sạch cú bấm, gõ bao nhiêu nhịp
   cũng không ra gì — đúng lỗi "màn cuối không bấm được vào khối vận hành /
   xem bản ghi". Nay cả hai màn cùng mở. */
.gate-look .vstamp{position:absolute;left:0;right:0;bottom:14px;padding:0 44px;pointer-events:none;
  font-family:"Oswald",system-ui,sans-serif;font-size:8px;font-weight:500;
  letter-spacing:.22em;text-transform:uppercase;text-align:center;line-height:1.6;
  color:rgba(234,240,247,.32)}
#scene-gate .vstamp,#scene-code .vstamp{pointer-events:auto;cursor:default;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
/* Tem nháy nhẹ vài nhịp khi cửa hậu vừa mở, cho biết là "ăn rồi" */
#scene-gate .vstamp.hit,#scene-code .vstamp.hit{color:rgba(140,225,180,.85);transition:color .18s}

/* ═══ KHỐI VẬN HÀNH ═══════════════════════════════════════════════════════
   Trước đây gõ đủ 10 nhịp thì đẻ ra một HÀNG NÚT ngay giữa màn: nút "Bỏ qua"
   viền đứt nằm cạnh nút sổ tròn, hai thứ khác cỡ khác kiểu chen nhau, nhìn
   như lỗi dựng trang hơn là cửa hậu. Nay gom vào MỘT BẢNG NHỎ đúng như Khối
   vận hành bên Zoey's Castle — cả bộ cùng một luật: mò ra tem thì ra bảng,
   mọi lối vận hành nằm gọn trong bảng. */
.kvh{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
  padding:18px;background:rgba(2,6,14,.66);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.kvh.on{display:flex}
.kvh-hop{position:relative;width:min(320px,92vw);border-radius:14px;padding:18px 16px 16px;
  background:linear-gradient(180deg,#0d1a2e 0%,#070e1c 100%);
  border:1px solid rgba(234,240,247,.12);box-shadow:0 20px 50px rgba(0,0,0,.45);
  animation:kvhLen .3s cubic-bezier(.16,1,.3,1) both}
@keyframes kvhLen{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* Vùng bấm nới ra ~44px bằng `::before`, nét nhìn giữ nguyên — cùng cách đã
   dùng cho `.grip` và `.cx-close` ngoài bản đồ. Không tăng padding vì nút neo
   tuyệt đối vào góc phải trên, tăng padding là dấu ✕ tự dịch vào trong. */
.kvh-x{position:absolute;top:6px;right:8px;width:30px;height:30px;border:0;background:none;
  color:rgba(234,240,247,.5);font-size:15px;line-height:1;cursor:pointer;padding:0}
.kvh-x::before{content:"";position:absolute;inset:-7px}
.kvh-x:hover{color:#EAF0F7}
.kvh-lab{display:flex;align-items:center;justify-content:center;gap:9px;margin:0 0 5px;
  font-family:"Oswald",system-ui,sans-serif;font-size:10.5px;font-weight:600;
  letter-spacing:.22em;text-transform:uppercase;color:rgba(140,225,180,.9)}
.kvh-txt{margin:0;text-align:center;font-size:10.5px;line-height:1.6;color:rgba(234,240,247,.5)}
.kvh-go{display:block;width:100%;margin:14px 0 0;padding:11px 8px;border-radius:999px;
  font-family:"Oswald",system-ui,sans-serif;font-size:9.5px;font-weight:600;
  letter-spacing:.18em;text-transform:uppercase;cursor:pointer;
  background:none;color:rgba(140,225,180,.9);border:1px dashed rgba(140,225,180,.5)}
.kvh-go:active{transform:translateY(1px)}
/* Dòng ký tên, nằm TRÊN dòng phiên bản. Cỡ chữ · giãn chữ · độ mờ lấy ĐÚNG
   theo dòng "© Bản quyền · …" ở chân bản đồ ngoài trang chủ (`.cr`), để hai
   nơi cùng một chữ ký thì trông cũng phải cùng một kiểu.
   `.hit` đổi màu cả khối, nên dòng này cũng sáng theo khi mò trúng cửa hậu. */
.gate-look .vstamp .vby{display:block;margin-bottom:3px;
  font-family:"Oswald",system-ui,sans-serif;font-size:8px;letter-spacing:.15em;
  text-transform:uppercase;color:rgba(234,240,247,.34)}
#scene-gate .vstamp.hit .vby{color:rgba(140,225,180,.5)}

/* ═══════════════════════════════════════════════════════════════════════════
   ② MÀN MINI-GAME PIXEL
   ═══════════════════════════════════════════════════════════════════════════ */
#scene-game{
  --bg:#0d1117;--bezel:#1f293d;
  --neon:#00ff66;--amber:#ffaa00;--cyan:#00f2ff;--red:#ff3355;
  --paper:#d7e2ee;--muted:rgba(215,226,238,.55);
  --f-pixel:'Press Start 2P','Roboto Mono',ui-monospace,monospace;
  /* Press Start 2P KHÔNG có dấu tiếng Việt → mọi câu tiếng Việt dùng --f-term */
  --f-term:'Roboto Mono',ui-monospace,'Courier New',monospace;
  --pan:0px;
  flex-direction:column;color:var(--paper);font-family:var(--f-term);
  background:radial-gradient(120% 80% at 50% 0%,#131c2a 0%,var(--bg) 70%);
  overflow:hidden;
}

/* Khung pixel dùng lại: 4 góc bị "cắn" một ô vuông màu nền. */
#scene-game .pf{position:relative}
#scene-game .pf::before{
  content:'';position:absolute;inset:-3px;pointer-events:none;z-index:3;
  background-image:linear-gradient(var(--bg),var(--bg)),linear-gradient(var(--bg),var(--bg)),
                   linear-gradient(var(--bg),var(--bg)),linear-gradient(var(--bg),var(--bg));
  background-size:5px 5px;background-repeat:no-repeat;
  background-position:0 0,100% 0,0 100%,100% 100%;
}

/* ── Nửa trên · khung máy ─────────────────────────────────────────────────
   height:auto — chiều cao do đúng nội dung quyết định, KHÔNG chốt cứng %, nên
   không còn khoảng trống chết giữa khung máy và hộp thoại. Trần chiều cao của
   khung do fitBezel() giữ (config frame.max_h).                              */
#scene-game #stage{
  flex:0 0 auto;height:auto;
  /* max(): máy không tai thỏ thì env() = 0, vẫn phải chừa mép trên tử tế */
  padding:max(env(safe-area-inset-top,0px),12px) 10px 0;
  display:flex;flex-direction:column;justify-content:flex-start;gap:6px;
}
#scene-game .hud{
  display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  font-family:var(--f-pixel);font-size:8px;letter-spacing:.06em;
  color:var(--muted);flex:0 0 auto;
}
#scene-game .hud .rnd{color:var(--amber)}
#scene-game .hud .st{display:inline-flex;align-items:center;gap:5px}
#scene-game .hud .dot{width:6px;height:6px;background:var(--red);
  box-shadow:0 0 8px currentColor;color:var(--red)}
#scene-game .hud.ok .dot{background:var(--neon);color:var(--neon)}
#scene-game .hud.ok .st{color:var(--neon)}
#scene-game #back{
  font-family:var(--f-pixel);font-size:7px;letter-spacing:.06em;text-decoration:none;
  color:rgba(215,226,238,.6);background:rgba(6,16,31,.7);
  border:2px solid rgba(31,41,61,.9);padding:5px 7px;flex:0 0 auto;cursor:pointer;
}
#scene-game .slot{flex:0 1 auto;min-height:0;width:100%;display:flex;
  align-items:center;justify-content:center}
#scene-game .bezel{
  /* Bề ngang do fitBezel() chốt bằng px; chiều cao suy ra từ tỷ lệ khung.
     (Không dùng max-height: trình duyệt KHÔNG truyền ràng buộc đó ngược qua
     aspect-ratio khi width đã cố định → khung bị bóp méo lúc bàn phím bật.) */
  width:100%;height:auto;aspect-ratio:var(--frame-ratio,4/3);max-width:100%;
  border:3px solid var(--bezel);background:#05080d;
  box-shadow:0 0 0 1px #0a0f18,0 10px 30px rgba(0,0,0,.6),inset 0 0 40px rgba(0,0,0,.9);
  position:relative;overflow:hidden;margin:auto;
}
#scene-game .screen{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}
#scene-game .screen.dragging{cursor:grabbing}

/* Lớp "thế giới": ảnh nền siêu rộng (2.28:1) cao đúng bằng khung máy → phần dư
   ngang chính là biên độ cho camera lia/vuốt. Khung 4:3 hẹp hơn 16:9 nên phần
   dư này còn rộng hơn nữa, vuốt được nhiều hơn. */
#scene-game .world-wrap{position:absolute;inset:0;display:flex;justify-content:center;
  align-items:center}
#scene-game .world{
  position:relative;height:100%;aspect-ratio:var(--world-ratio,3136/1376);flex:0 0 auto;
  transform:translate3d(var(--pan),0,0);will-change:transform;
}
#scene-game .bg-layer{position:absolute;inset:0;background-size:100% 100%;
  background-position:center;transition:opacity .6s ease}

/* Rồng: bản sao ảnh nền được che quanh vùng đầu rồng rồi cho "thở" bằng
   transform rất nhỏ → rồng như đang uốn lượn mà nền vẫn đứng yên. */
#scene-game .dragon-layer{
  position:absolute;inset:0;background-size:100% 100%;opacity:0;
  -webkit-mask-image:radial-gradient(ellipse 15% 34% at 49.5% 34%,#000 0%,#000 52%,transparent 100%);
  mask-image:radial-gradient(ellipse 15% 34% at 49.5% 34%,#000 0%,#000 52%,transparent 100%);
  animation:dragonFloat 7.5s cubic-bezier(.45,0,.55,1) infinite;transition:opacity .8s ease;
}
@keyframes dragonFloat{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-0.26%) scale(1.0035)}
}
#scene-game .dragon-layer.on{opacity:1}
#scene-game .dragon-layer.empowered{animation-duration:4.6s;
  filter:drop-shadow(0 0 10px rgba(0,242,255,.6)) brightness(1.08)}

#scene-game .aura{
  position:absolute;left:49.5%;top:34%;width:42%;height:76%;
  transform:translate(-50%,-50%);
  background:radial-gradient(ellipse at center,var(--aura-c,rgba(190,240,255,.55)) 0%,
             var(--aura-c2,rgba(120,220,255,.22)) 38%,transparent 70%);
  mix-blend-mode:screen;opacity:0;pointer-events:none;
  animation:auraBreath 6.8s cubic-bezier(.45,0,.55,1) infinite;transition:opacity .8s ease;
}
@keyframes auraBreath{
  0%,100%{transform:translate(-50%,-50%) scale(.985);filter:brightness(.95)}
  50%{transform:translate(-50%,-50%) scale(1.022);filter:brightness(1.08)}
}
#scene-game .aura.on{opacity:.85}
#scene-game .aura.empowered{animation-duration:3.8s;opacity:1;width:50%;height:84%}

/* ── Bệ đá khắc chữ ─────────────────────────────────────────────────────── */
/* ── BỆ ĐÁ: KHÔNG vẽ chữ đè lên ────────────────────────────────────────────
   Phủ một lớp TỐI HẲN lên đúng ô chữ khắc, rồi cắt chính ảnh gốc thành từng ký
   tự xếp chồng lên. Gõ trúng ký tự nào thì ô đó sáng lên — người chơi thấy
   đúng nét chữ khắc trong tranh, không phải chữ do font vẽ ra. */
#scene-game .slab{position:absolute;display:none;pointer-events:none;z-index:6}
#scene-game .slab.vis{display:block}
/* ═══ RAZER TẮT DẦN — CHẠY BẰNG CSS ANIMATION, KHÔNG PHẢI TIMER ═══════════
   Đáp án vòng 1 phải tắt xong TRƯỚC lúc chớp nổ trong clip loé lên (đo được
   mốc 12% — xem `slab1_out_at` trong config.js). Nếu không thì lớp chữ đứng
   im trong khi cả khung phía dưới vừa nổ vừa trượt → "chữ bay lên trời".

   ĐÃ THỬ HAI ĐỜI TIMER, CẢ HAI ĐỀU TRỄ:
     · setTimeout đặt trước lúc gọi clip  → trễ, đo được chữ còn tới 46%
     · rAF + setTimeout bám mốc clip thật → đỡ hơn nhưng vẫn trễ 500-900ms,
       vì đúng quãng đó trình duyệt đang giải mã clip 14MB nên main thread
       nghẹn, mọi thứ chạy trên đó đều bị đói.

   NAY GIAO CHO CSS. Trình duyệt chạy animation `opacity` trên compositor,
   không đụng main thread — nghẹn cỡ nào thì nhịp tắt vẫn đúng giờ. Main
   thread chỉ phải làm đúng MỘT việc rẻ tiền: gắn class `.tat` đúng lúc clip
   vào DOM. Độ trễ và thời lượng đọc từ hai biến, JS rót vào từ config. */
@keyframes razerTat{ to{opacity:0} }
#scene-game .slab.tat{
  animation:razerTat var(--razer-fade,380ms) ease var(--razer-cho,1760ms) both;
}
@media (prefers-reduced-motion:reduce){
  #scene-game .slab.tat{animation-duration:1ms}
}
/* Lớp tối: rộng hơn ô chữ một chút, mép nhoè bằng box-shadow cùng màu */
/* Lớp che KHÔNG phải dải đen — nó là chính mẩu ảnh bệ đá, chỉ bị hạ sáng và
   khử màu để nét khắc thành rãnh đá chưa thắp. Mép nhoè hai chiều nên không
   thấy khung chữ nhật nào, nhìn tiệp hẳn vào tấm biển. */
#scene-game .slab .veil{
  position:absolute;background-repeat:no-repeat;
  filter:var(--veil-f,brightness(.44) saturate(.18) contrast(.82));
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 18%,#000 82%,transparent 100%),
                     linear-gradient(to right,transparent 0%,#000 9%,#000 91%,transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0%,#000 18%,#000 82%,transparent 100%),
             linear-gradient(to right,transparent 0%,#000 9%,#000 91%,transparent 100%);
  -webkit-mask-composite:source-in;mask-composite:intersect;
  transition:opacity .5s ease;
}
/* ═══ KHÓI SÓT LẠI SAU VỤ NỔ — CHỈ CÒN LÀ ĐƯỜNG LÙI ══════════════════════
   ĐỌC TRƯỚC: bình thường lớp này KHÔNG BAO GIỜ bật. Chuyển cảnh nay dùng
   `anim_unlock_clean.webp` — bản clip đã xoá sẵn hai bảng tên khắc trên bệ đá
   — nên trong clip chẳng còn chữ nào để giấu, và cả khung chạy TRẦN. Lớp khói
   dưới đây chỉ sống lại đúng một trường hợp: clip sạch không tải được, game
   lùi về `anim_unlock` cũ (xem `urlClipNo()` và `win1()`).

   Giữ lại vì clip CŨ tự nó vẽ sẵn bảng đá vòng 2 với "NUY OAHZ" sáng rõ từ mốc
   40,8% và giữ rõ TỚI HẾT CLIP — phải giấu suốt 4,7 giây, đúng đoạn con rồng
   nở ra. Cắt clip sớm là mất luôn khúc đẹp nhất, không làm được.

   BỐN ĐỜI ĐÃ THỬ, GHI LẠI CHO KHỎI ĐI VÒNG:
     1. Dán mẩu đá tĩnh cắt từ ảnh nền → cảnh trong clip còn đang hạ cánh
        (thấp hơn tới 13px giữa clip) nên miếng dán trượt lên, chữ thò ra dưới.
     2. Cho miếng dán TRÔI THEO đường cong đó → hết thò chữ, nhưng thành "một
        hình chữ nhật có vân đá riêng, tự bò trong khung". Tệ hơn hẳn.
     3. Vệt LÀM MỜ hình bầu dục ngay trên ô chữ → hết vật liệu lạ, nhưng vẫn
        còn một cái HÌNH: quầng xám nằm lì giữa khung gần 5 giây.
     4. Cả dải đáy khung MẤT NÉT (tiền cảnh out nét) → đỡ hơn, nhưng vẫn bị
        báo là "cục mờ bay lơ lửng ở không trung". Đúng: chỗ đó không có gì để
        mà mờ — sương hay khói thì mắt chấp nhận, chứ một vùng NHOÈ giữa trời
        thì không có lời giải thích vật lý nào.

   GỐC RỄ CỦA CẢ BỐN: đều là HIỆU ỨNG QUANG HỌC đặt vào một chỗ chẳng có gì
   sinh ra hiệu ứng đó. Mắt không tìm ra nguyên nhân nên đọc ngay ra "lỗi".

   ĐỜI NÀY DÙNG THỨ CÓ SẴN TRONG CHÍNH CÂU CHUYỆN: KHÓI. Phòng lab vừa nổ tung
   ngay trước đó, khói trắng phủ kín khung ở mốc 26-40% — khói còn vương lại
   la đà sát mặt đất là chuyện đương nhiên, không cần giải thích gì. Nó không
   phải "vùng che", nó là một vật thể trong cảnh.

   BỐN ĐIỂM KHIẾN NÓ TỰ NHIÊN:
     · KHÔNG PHẢI HÌNH KHỐI ĐỀU. Ba bờ khói to nhỏ khác nhau chồng lên nhau,
       mỗi bờ trôi một tốc độ (17s / 23s / 29s) và ngược chiều nhau, nên đường
       viền tổng luôn đổi — không bao giờ đứng thành một cái "cục".
     · Trôi NGANG, la đà theo mặt đất, đúng kiểu khói nặng sau vụ nổ.
     · Đặc nhất đúng dải bảng đá rồi loãng dần lên trên và xuống dưới, mép nào
       cũng tán bằng gradient — không tồn tại một đường viền kín nào.
     · Nở ra từ mốc 26%, tức là LÚC CẢ KHUNG CÒN TRẮNG XOÁ VÌ KHÓI THẬT. Khói
       giả sinh ra ngay trong lòng khói thật rồi ở lại; mắt không bắt được
       khoảnh khắc nó xuất hiện.

   VÌ SAO KHÔNG CÒN CHE "REZAR" NỮA: đã chốt là kệ. Vòng 1 lúc đó giải xong
   rồi, người chơi thấy lại mã cũ cũng chẳng mất gì. Chỉ NUY OAHZ mới cần
   giấu, nên khói chỉ cần sống đúng quãng clip là đủ. */
#scene-game .khoi{
  position:absolute;left:-25%;right:-25%;top:72%;bottom:-6%;
  opacity:0;pointer-events:none;z-index:6;overflow:hidden;
  /* Loãng dần cả trên lẫn dưới. Đặc nhất ở 46-72% chiều cao dải, tức đúng dải
     bảng đá (84-92% chiều cao khung) kể cả khi cảnh trong clip còn tụt xuống. */
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,rgba(0,0,0,.55) 22%,
                     #000 46%,#000 72%,rgba(0,0,0,.5) 88%,transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0%,rgba(0,0,0,.55) 22%,
             #000 46%,#000 72%,rgba(0,0,0,.5) 88%,transparent 100%);
  transition:opacity .75s ease;
}
#scene-game .world.khoi-on .khoi{opacity:1}
/* Ba bờ khói. Mỗi bờ là mấy cụm bầu dục tán mềm ghép lại — cố ý lệch tâm và
   lệch cỡ để không cụm nào giống cụm nào. Màu xám hơi ám xanh cho hợp ánh
   sáng lạnh của rừng tàn tích, KHÔNG dùng trắng tinh: trắng tinh trên nền tối
   thành một mảng chói, nhìn ra ngay là dán vào. */
#scene-game .khoi i{
  position:absolute;left:0;right:0;top:-20%;bottom:-20%;display:block;
  background-repeat:no-repeat;
  will-change:transform;
}
#scene-game .khoi .k1{
  background-image:
    radial-gradient(ellipse 26% 46% at 18% 52%, rgba(206,214,222,.72) 0%, rgba(206,214,222,.46) 46%, transparent 78%),
    radial-gradient(ellipse 34% 52% at 46% 46%, rgba(214,221,228,.76) 0%, rgba(214,221,228,.5) 44%, transparent 76%),
    radial-gradient(ellipse 28% 44% at 76% 56%, rgba(200,209,218,.7)  0%, rgba(200,209,218,.44) 46%, transparent 78%);
  animation:khoiTroi1 23s linear infinite;
}
#scene-game .khoi .k2{
  background-image:
    radial-gradient(ellipse 32% 40% at 30% 60%, rgba(196,206,215,.6) 0%, rgba(196,206,215,.38) 48%, transparent 80%),
    radial-gradient(ellipse 24% 50% at 64% 44%, rgba(210,218,226,.64) 0%, rgba(210,218,226,.42) 46%, transparent 78%);
  animation:khoiTroi2 29s linear infinite;
}
#scene-game .khoi .k3{
  background-image:
    radial-gradient(ellipse 40% 38% at 52% 62%, rgba(188,199,210,.54) 0%, rgba(188,199,210,.33) 50%, transparent 82%);
  animation:khoiTroi3 17s linear infinite;
}
/* Bờ thứ tư: THẤP, DẸT, ĐẶC — nằm đúng dải bảng đá và chỉ dải đó.
   Vì sao cần thêm một bờ riêng thay vì đẩy ba bờ trên đậm lên: đẩy cả ba lên
   là cả mảng khói dày thêm, quay lại đúng cái "tường sương" của bản đầu, mất
   hết mấy khối đá nhô ra hai bên. Bờ này dẹt (cao 26%) nên chỉ dày thêm đúng
   chỗ cần giấu chữ, phần còn lại vẫn thưa như cũ.
   ĐO ĐỂ CHỌN: bản không có bờ này, phóng to 3 lần vẫn đọc mờ mờ ra NUY OAHZ. */
#scene-game .khoi .k4{
  background-image:
    radial-gradient(ellipse 46% 26% at 40% 56%, rgba(212,219,226,.8) 0%, rgba(212,219,226,.52) 52%, transparent 84%),
    radial-gradient(ellipse 38% 22% at 74% 60%, rgba(204,213,222,.76) 0%, rgba(204,213,222,.48) 54%, transparent 86%);
  animation:khoiTroi4 21s linear infinite;
}
/* Trôi ngang trong lòng khung đã nới rộng 25% mỗi bên, nên hai đầu bờ khói
   không bao giờ lọt vào tầm nhìn — chỉ thấy khói đi qua, không thấy nó bắt
   đầu hay kết thúc ở đâu. */
@keyframes khoiTroi1{from{transform:translateX(-6%) scaleY(1)}
  50%{transform:translateX(4%) scaleY(1.08)} to{transform:translateX(-6%) scaleY(1)}}
@keyframes khoiTroi2{from{transform:translateX(5%) scaleY(1.05)}
  50%{transform:translateX(-5%) scaleY(.96)} to{transform:translateX(5%) scaleY(1.05)}}
@keyframes khoiTroi3{from{transform:translateX(-3%)}
  50%{transform:translateX(6%)} to{transform:translateX(-3%)}}
@keyframes khoiTroi4{from{transform:translateX(4%)}
  50%{transform:translateX(-4%)} to{transform:translateX(4%)}}
@media (prefers-reduced-motion:reduce){
  #scene-game .khoi i{animation:none}
}

#scene-game .slab .cells{position:absolute;inset:0;display:flex}
/* overflow:hidden để đất và bụi rơi khuất trong lòng ô, không tràn ra ngoài
   tấm biển. Quầng sáng của ký tự do filter vẽ nên vẫn toả ra bình thường. */
#scene-game .slab .cell{position:relative;height:100%;flex:0 0 auto;opacity:0;overflow:hidden;
  transition:opacity .18s ease,filter .18s ease}
/* Mẩu ảnh của một ký tự. Mặt nạ lấy CHÍNH mẩu ảnh đó theo ĐỘ SÁNG (luminance):
   nét khắc sáng → đục, mặt đá tối xung quanh → trong suốt. Chồng hai lớp mặt nạ
   giống hệt nhau rồi giao nhau = nhân hai lần alpha, nên mặt đá càng chìm hẳn,
   chỉ còn nét chữ nổi lên. TUYỆT ĐỐI không chồng thêm lớp nhoè mép trái/phải:
   ô chữ chỉ rộng ~8px, nhoè 11% là ăn đứt nét dọc của R và O nằm sát mép.
   Trình duyệt cũ không hiểu mask-mode thì mất mặt nạ, ô sáng cả mảng — vẫn chơi
   được, chỉ kém khéo hơn. */
#scene-game .slab .cell .gl{
  position:absolute;inset:0;background-repeat:no-repeat;
  -webkit-mask-image:var(--cut),var(--cut);
  mask-image:var(--cut),var(--cut);
  -webkit-mask-size:var(--cut-s),var(--cut-s);
  mask-size:var(--cut-s),var(--cut-s);
  -webkit-mask-position:var(--cut-p),var(--cut-p);
  mask-position:var(--cut-p),var(--cut-p);
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  mask-mode:luminance,luminance;
  -webkit-mask-composite:source-in;
  mask-composite:intersect;
}
/* Ô ứng với DẤU CÁCH: không bao giờ thắp, nếu không sẽ thành vệt sáng vô nghĩa
   giữa hai chữ. */
#scene-game .slab .cell.blank{opacity:0!important;animation:none!important}
/* Giải xong: từng ô TRƯỢT về đúng chỗ của nó khi đọc xuôi. Chữ khắc là chuỗi
   đảo (REZAR / NUY OAHZ) nên chỉ cần lật gương — ô thứ i đổi chỗ cho ô n-1-i.
   Đáp án đọc được nằm đè hẳn lên bảng cũ và ở lại luôn. */
/* Đường cong bung nhanh rồi hạ cánh êm — ký tự lao đi dứt khoát rồi từ từ
   khớp vào chỗ, đúng cảm giác "đang tự xếp lại". Kết hợp với độ lệch nhịp
   `--fd` từng ô (xem flipSolved) thì cả cụm chạy như một chuỗi domino gọn. */
#scene-game .slab.flip .cell{
  transform:translateX(var(--fx,0px));
  transition:transform var(--flip,700ms) cubic-bezier(.22,.9,.24,1) var(--fd,0ms);
}
/* Mảng đất phủ riêng từng ký tự — chỉ hiện đúng lúc bới ra rồi rơi xuống. */
#scene-game .slab .cell .dirt{
  position:absolute;inset:-8% -4%;opacity:0;pointer-events:none;z-index:2;
  -webkit-mask-image:radial-gradient(ellipse 62% 70% at 50% 50%,#000 0%,#000 62%,transparent 100%);
  mask-image:radial-gradient(ellipse 62% 70% at 50% 50%,#000 0%,#000 62%,transparent 100%);
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  background:repeating-linear-gradient(90deg,rgba(78,60,40,.85) 0 1px,rgba(46,35,24,.85) 1px 2px),
             radial-gradient(ellipse 74% 70% at 50% 46%,rgba(34,26,17,.99) 0%,
                             rgba(34,26,17,.94) 72%,rgba(34,26,17,.55) 100%);
}
#scene-game .slab .cell.digging .dirt{animation:dirtOff var(--dirt,640ms) ease-in 1 both}
@keyframes dirtOff{
  0%{opacity:1;transform:translateY(0);clip-path:inset(0 0 0 0)}
  55%{opacity:.92}
  100%{opacity:0;transform:translateY(88%);clip-path:inset(92% 0 0 0)}
}
/* Ký tự sáng DẦN theo nhịp đất rơi, không bật bụp một phát rồi mới rơi đất */
#scene-game .slab .cell.digging{animation:cellDig var(--dirt,640ms) ease-out 1 both}
@keyframes cellDig{
  0%{opacity:1;filter:brightness(.78) saturate(.45)}
  45%{opacity:1;filter:brightness(1.1) saturate(.9)}
  100%{opacity:1;filter:brightness(2.15) saturate(1.45)
       drop-shadow(0 0 2px var(--slab-c)) drop-shadow(0 0 6px var(--slab-c)) drop-shadow(0 0 11px var(--slab-c))}
}
/* Bụi đất văng ra khi mảng đất rơi */
#scene-game .slab .cell .dust{
  position:absolute;top:52%;width:1px;height:1px;background:#6b533a;z-index:3;
  opacity:.8;pointer-events:none;animation:dustFall .5s ease-in var(--dl,0ms) 1 both;
}
@keyframes dustFall{
  0%{transform:translate(0,0);opacity:.9}
  100%{transform:translate(var(--dx,0),300%);opacity:0}
}
/* Vòng 2: ký tự đã bới ra thì SÁNG LUÔN, không tối lại nữa */
#scene-game .slab .cell.shown{
  opacity:1;filter:brightness(2.05) saturate(1.4)
    drop-shadow(0 0 2px var(--slab-c)) drop-shadow(0 0 6px var(--slab-c)) drop-shadow(0 0 11px var(--slab-c));
}
/* Gõ trúng → ký tự đó bừng sáng 0.3s */
#scene-game .slab .cell.hit{
  opacity:1;filter:brightness(2.15) saturate(1.45)
    drop-shadow(0 0 2px var(--slab-c)) drop-shadow(0 0 6px var(--slab-c)) drop-shadow(0 0 11px var(--slab-c));
}
/* Idle hint: cả cụm hiện mờ một nhịp */
#scene-game .slab.breathe .cell{animation:cellBreath 1.25s ease-in-out 1}
@keyframes cellBreath{0%,100%{opacity:0}50%{opacity:.42;filter:brightness(1.2)}}
/* Giải đúng → cả cụm sáng đều lên MỘT LẦN rồi nằm im. Không nháy lệch nhịp,
   không nảy, không đổi cỡ: đây là ĐÁP ÁN chứ không phải màn ăn mừng. Chỉ đẩy
   độ sáng lên một nấc so với `.shown` cho tách khỏi nền đá. */
/* ── VÌ SAO PHẢI CHỈNH RIÊNG TỪNG VÒNG ──────────────────────────────────
   Cùng một công thức nhưng RAZER bừng lên còn ZHAO YUN thì lờ đờ, vì tranh
   gốc hai bên khác hẳn: bảng vòng 1 là nền nâu ẤM, chữ vàng rực, quầng sáng
   vẽ sẵn ngay trong tranh; bảng vòng 2 là nền đá xám XANH, chữ be nhạt, không
   có quầng nào. Mặt nạ cắt ký tự lại chạy theo ĐỘ SÁNG, nên nền càng tối thì
   phần lọt qua càng mỏng — chữ vòng 2 vừa tối vừa mảnh.
   Nay ba thông số đọc từ `round1.solved_glow` / `round2.solved_glow` trong
   config: vòng 2 đẩy sáng và tương phản cao hơn cho nét dày và rõ ngang vòng 1.
   `contrast` là thứ làm chữ NÉT chứ không chỉ sáng: nó kéo giãn khoảng cách
   giữa nét khắc và mặt đá, mép chữ sắc lại thay vì nhoè ra. */
/* ── ĐÁP ÁN SÁNG LÊN: CẢ CHUỖI BỘ LỌC ĐỌC TỪ CONFIG ──────────────────────
   `--sol-f` do fitSlabs() ghi, lấy từ `solved_glow` của đúng vòng đang chơi.
   Vòng nào khai `f` thì dùng nguyên chuỗi đó; không khai thì tự ghép lại đúng
   bộ ba cũ brightness/saturate/contrast — vòng 1 nhờ vậy không đổi một nét.

   ═══ VÌ SAO VÒNG 2 CẦN NHUỘM LẠI, KHÔNG PHẢI TĂNG SÁNG ═══════════════════
   Đã báo: "ZHAO YUN nhìn tối hơn mấy chữ xung quanh". Đo mới ra đúng bệnh —
   nó KHÔNG tối, nó BẠC MÀU:

       nét ZHAO YUN (bản cũ)   độ sáng 142   bão hoà  67
       biển EIMIMRE bên trái   độ sáng 147   bão hoà  89
       biển MIDNIGHT bên phải  độ sáng 136   bão hoà  80

   Độ sáng đã ngang ngửa rồi, chỉ có màu là nhạt hơn hẳn một phần ba. Mắt đọc
   "nhạt" thành "tối", nên càng vặn brightness lên càng hỏng: nét khắc gốc vốn
   trắng ngà, đẩy sáng nữa là ba kênh cùng chạm trần rồi tiệp thành trắng —
   mất nốt chút màu còn lại. Đo được: kéo brightness từ 3.35 xuống 2.2 hay lên
   4 thì bão hoà vẫn đứng im ở 67.

   NAY NHUỘM: `sepia()` kéo cả mảng về một gốc hổ phách ấm, `saturate()` đẩy
   đậm lên, rồi mới `brightness()` nâng sáng và `contrast()` làm sắc nét lại.
   THỨ TỰ QUAN TRỌNG — nhuộm TRƯỚC lúc pixel còn tối; nhuộm sau khi đã đẩy
   sáng thì chỉ nhuộm được một mảng trắng, ra màu kem nhợt.
   Đo lại bộ mới: độ sáng 137, bão hoà 81 — trùng khít biển MIDNIGHT. */
#scene-game .slab.solved .cell{
  animation:none;
  opacity:1;
  filter:var(--sol-f, brightness(2.6) saturate(1.5) contrast(1))
    drop-shadow(0 0 2px var(--slab-c)) drop-shadow(0 0 7px var(--slab-c)) drop-shadow(0 0 14px var(--slab-c));
  transition:filter .42s ease-out,opacity .42s ease-out;
}
#scene-game .slab.solved .cell.blank{opacity:0!important}

/* ── Mắt rồng: nhập sai thì mắt LOÉ ĐỎ THÀNH TIA ──────────────────────────
   Bốn đời đã thử ở chỗ này, ghi lại cho khỏi đi vòng:
   1. `mix-blend-mode:screen` — screen(cyan sáng, đỏ) ra gần như trắng, mắt
      chẳng đỏ lên tí nào.
   2. Bỏ blend, dán một đĩa đỏ đặc đè lên — đỏ thì có đỏ, nhưng thành một cục
      sơn tròn nằm trên mặt rồng: thô, và to hơn hẳn con ngươi.
   3. `mix-blend-mode:color` cho con ngươi, cộng một QUẦNG NHOÈ `multiply`
      quanh hốc mắt. Con ngươi đổi màu thì đúng — phần đó giữ nguyên tới giờ.
      Nhưng cái quầng thì vẫn chỉ là MỘT VÙNG MỜ nhấp nháy: không có hướng,
      không có đầu nhọn, nên mắt người đọc ra "ảnh bị nhoè" chứ không đọc ra
      "ánh sáng loé". Nhìn thô đúng như vậy.
   4. (nay) Bỏ hẳn quầng nhoè, thay bằng một CHÙM TIA: vệt ngang dài, vệt dọc
      ngắn hơn, hai tia chéo 45° mảnh, và một lõi trắng nóng đúng giữa con
      ngươi. Tia có HƯỚNG và thuôn nhọn về hai đầu nên đọc ngay ra tia sáng.

   VÌ SAO TIA KHÔNG DÙNG BLEND MODE: mặt rồng là mảng trắng-xám rất sáng.
   `screen` trên nền gần trắng cho ra… trắng (đúng cái bẫy số 1), `color` thì
   nền trắng độ sáng đã kịch nên cũng không đổi được gì. Nên tia vẽ chồng
   thẳng bằng alpha thường: sáng thì thành vệt đỏ rõ, tối thì thành ánh đỏ.
   Chỉ CON NGƯƠI mới cần `color` — chỗ đó phải giữ nguyên nét vẽ bên dưới.
   Tất cả bằng gradient, không thêm file ảnh nào. */
#scene-game .eye{position:absolute;display:none;pointer-events:none;z-index:3}
#scene-game .eye.on{display:block}

/* Con ngươi đổi màu. `color` lấy SẮC của lớp này, giữ nguyên ĐỘ SÁNG và nét vẽ
   bên dưới — highlight, viền mí, vảy quanh mắt vẫn nguyên vẹn. Khung đã dò cho
   khít con ngươi, xem round2.eyes trong config. */
/* ═══ ĐỎ Ở LÕI, TAN DẦN RA MÉP ═══════════════════════════════════════════
   BỆNH ĐÃ SỬA: "viền đỏ mắt còn rõ và to quá, nhìn hơi giả".
   Bản trước giữ gần như NGUYÊN độ đục tới 52% bán kính rồi mới bắt đầu hạ —
   tức là hai phần ba con ngươi đỏ đều một mực rồi rơi xuống trong một quãng
   ngắn. Mắt đọc ra một CÁI ĐĨA có viền, không phải một điểm sáng.
   Nay hạ ngay từ lõi: đặc nhất ở tâm, còn nửa ở 46%, còn một phần năm ở 72%,
   tắt hẳn ở mép. Thêm một nhịp nhoè bằng `filter` — bán kính buộc vào CHIỀU
   CAO con ngươi (`--iris-blur`, đặt trong fitSlabs) chứ không để số px cố
   định, nếu không màn to thì mép lại sắc trở lại. Đỉnh cũng hạ từ .9 xuống
   .74 ở nhịp chớp. */
#scene-game .eye .iris{
  position:absolute;inset:0;border-radius:50%;opacity:0;
  background:radial-gradient(ellipse at 50% 50%,
             rgba(255,36,30,.96) 0%,rgba(255,30,24,.72) 26%,
             rgba(244,26,20,.44) 46%,rgba(226,22,16,.19) 72%,
             rgba(210,20,14,.06) 88%,transparent 100%);
  filter:blur(var(--iris-blur,1.2px));
  mix-blend-mode:color;
}

/* CHÙM TIA. Hộp rộng gấp ~11,5 lần con ngươi, tâm ghim đúng tâm mắt. Mỗi tia là
   một elip DẸT KIỆT (2,2% bề dày) — elip dẹt cho ra đúng vệt thuôn hai đầu,
   khỏi phải cắt mặt nạ. `.ray` giữ vệt ngang + vệt dọc, ::before hai tia chéo,
   ::after cái lõi — tách ra ba lớp để lõi luôn nằm trên cùng. */
#scene-game .eye .ray{
  position:absolute;left:50%;top:50%;width:1150%;height:760%;opacity:0;
  transform:translate(-50%,-50%);
  background:
    radial-gradient(ellipse 2.6% 48% at 50% 50%,rgba(255,240,232,.84) 0%,
      rgba(255,74,48,.55) 24%,rgba(255,40,26,.2) 58%,rgba(255,40,26,0) 100%),
    radial-gradient(ellipse 50% 2.2% at 50% 50%,rgba(255,240,232,.9) 0%,
      rgba(255,74,48,.64) 24%,rgba(255,40,26,.25) 58%,rgba(255,40,26,0) 100%);
  background-repeat:no-repeat;
}
#scene-game .eye .ray::before{
  content:'';position:absolute;inset:0;transform:rotate(45deg);
  background:
    radial-gradient(ellipse 32% 1.4% at 50% 50%,rgba(255,222,210,.64) 0%,
      rgba(255,70,44,.38) 28%,rgba(255,70,44,0) 100%),
    radial-gradient(ellipse 1.6% 32% at 50% 50%,rgba(255,222,210,.55) 0%,
      rgba(255,70,44,.31) 28%,rgba(255,70,44,0) 100%);
  background-repeat:no-repeat;
}
/* Lõi để NHỎ và trắng ở tâm. To và đỏ đặc là quay về đúng cục sơn ở đời thứ 2 */
#scene-game .eye .ray::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 3.6% 5.8% at 50% 50%,rgba(255,252,250,.98) 0%,
             rgba(255,120,86,.69) 34%,rgba(255,92,60,0) 100%);
  background-repeat:no-repeat;
}

#scene-game .eye.flash .iris{animation:eyeFlash .8s ease-in-out 2}
#scene-game .eye.flash .ray{animation:eyeRay .8s cubic-bezier(.2,.7,.3,1) 2}
/* Lên/xuống mượt, đỉnh KHÔNG chạm 1 — mắt hơi rực lên rồi dịu, không giật cục */
@keyframes eyeFlash{
  0%,100%{opacity:0}
  30%{opacity:.74}
  50%{opacity:.55}
  72%{opacity:.9}
}
/* Tia thì ngược lại: bật RẤT NHANH rồi tắt dần. Loé phải đến trước khi mắt kịp
   theo, còn tắt thì được phép chậm — đó là nhịp của một tia sáng thật. */
@keyframes eyeRay{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.28)}
  14%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
  46%{opacity:.6;transform:translate(-50%,-50%) scale(.97)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(.9)}
}
/* Máy nào không hiểu mix-blend-mode:color thì lớp con ngươi sẽ phủ đỏ đặc lên
   mắt. Vẫn chơi được, chỉ kém khéo — hạ opacity cho đỡ thô ở trường hợp đó.
   Chùm tia không dính blend nên ở đâu cũng chạy y như nhau. */
@supports not (mix-blend-mode:color){
  #scene-game .eye.flash .iris{animation:eyeFlashFallback .8s ease-in-out 2}
  @keyframes eyeFlashFallback{
    0%,100%{opacity:0}
    30%{opacity:.62}
    50%{opacity:.36}
    72%{opacity:.62}
  }
}
/* Rời tay khỏi hiệu ứng: giữ cái loé đỏ (đó là câu trả lời "sai rồi") nhưng bỏ
   phần phóng to thu nhỏ của chùm tia. */
@media (prefers-reduced-motion:reduce){
  #scene-game .eye.flash .ray{animation:eyeRayFlat .8s ease-in-out 2}
  @keyframes eyeRayFlat{
    0%,100%{opacity:0}
    30%{opacity:.85}
    50%{opacity:.5}
    72%{opacity:.85}
  }
}

/* ── Cuộn thư: không khung, chỉ phóng to thu nhỏ chính vùng ảnh đó ───────── */
#scene-game .hotspot{
  position:absolute;display:none;align-items:center;justify-content:center;
  background:none;border:0;padding:0;z-index:4;cursor:pointer;
}
#scene-game .hotspot.on{display:flex}
/* Quầng sáng nằm SAU cuộn thư — phần "thở" nặng do lớp này lo, nên mẩu ảnh
   chỉ cần nhúc nhích rất nhẹ, không còn cảm giác phóng to thô. */
#scene-game .hotspot .halo{
  position:absolute;inset:-21% -14%;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(ellipse at center,rgba(255,226,150,.52) 0%,
             rgba(255,180,60,.22) 46%,transparent 74%);
  animation:haloBreath 2.6s cubic-bezier(.45,0,.55,1) infinite;
}
@keyframes haloBreath{
  0%,100%{opacity:.45;transform:scale(.96)}
  50%{opacity:1;transform:scale(1.08)}
}
/* KHÔNG phóng to bản sao ảnh nữa — phóng lên là lệch với ảnh gốc nằm dưới, nhìn
   như cuộn thư bị nhân đôi, thô hẳn. Thay vào đó chồng mẩu ảnh ĐÚNG KHÍT lên
   chính nó rồi cho nhoà sáng dần theo nhịp thở: không lệch một pixel nào, chỉ
   thấy cuộn thư tự bừng lên rồi dịu xuống. */
/* Cuộn thư nằm CHÉO nên mặt nạ là một DẢI CHÉO (linear-gradient chạy vuông góc
   với trục dải) giao với một elip cắt bớt hai đầu: sáng đúng thân cuộn.

   ── ĐO LẠI GÓC VÀ BỀ DÀY DẢI ─────────────────────────────────────────────
   Góc CŨ để 15.3 độ, lấy từ hai vệt sáng trên mặt bích (y≈500 bên trái,
   y≈578 bên phải) — mà vệt sáng thì nằm lệch trên tâm bích, nên góc đo ra dốc
   hơn trục thật. Dò lại bằng TÂM hai mặt bích đồng — (1319,514) và (1566,567)
   trên ảnh 3136x1376 — ra 12.2 độ. Dải dốc quá thì đầu trái vống lên đúng chỗ
   sống mũi con rồng: cộng với khung lệch (xem round2.hotspot trong config) là
   thành cái "miệng đến mũi sáng trưng".
   Bề dày cũng thắt lại: 26/40/60/74 cho ra vệt sáng ~96px, rộng hơn cả đường
   kính mặt bích (~80px) nên thừa ra 26px mỗi bên đè lên mõm rồng. Dãy mới
   30/39/61/70 cho vệt ~80px — vừa đúng mặt bích, thân cuộn vẫn sáng đều mà
   mõm rồng giữ nguyên nét vẽ.
   Elip nới từ 58% lên 66% bề ngang: khung dài 327px, nửa dải là 163px, elip cũ
   tắt mất hai cái núm gỗ ở hai đầu — đúng cái "không chuẩn vào chính giữa". */
#scene-game .hotspot .zoom{
  position:absolute;background-repeat:no-repeat;mix-blend-mode:screen;
  -webkit-mask-image:linear-gradient(12.2deg,transparent 30%,#000 39%,#000 61%,transparent 70%),
                     radial-gradient(ellipse 66% 96% at 50% 50%,#000 0%,#000 62%,transparent 100%);
  mask-image:linear-gradient(12.2deg,transparent 30%,#000 39%,#000 61%,transparent 70%),
             radial-gradient(ellipse 66% 96% at 50% 50%,#000 0%,#000 62%,transparent 100%);
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-composite:source-in;mask-composite:intersect;
  animation:zoomPulse 2.6s cubic-bezier(.45,0,.55,1) infinite;
}
/* Lớp thứ hai: cũng mẩu ảnh đó, nhưng tự lấy ĐỘ SÁNG của mình làm mặt nạ (chồng
   hai lớp cho ăn chắc) rồi hắt drop-shadow vàng. Nhờ vậy cái phát sáng là ĐÚNG
   ĐƯỜNG VIỀN cuộn thư — cả hai đầu go — chứ không phải một mảng elip mờ. */
#scene-game .hotspot .rim{
  position:absolute;background-repeat:no-repeat;pointer-events:none;
  mix-blend-mode:screen;
  -webkit-mask-image:var(--cut),var(--cut),linear-gradient(12.2deg,transparent 30%,#000 39%,#000 61%,transparent 70%),
                     radial-gradient(ellipse 66% 96% at 50% 50%,#000 0%,#000 62%,transparent 100%);
  mask-image:var(--cut),var(--cut),linear-gradient(12.2deg,transparent 30%,#000 39%,#000 61%,transparent 70%),
             radial-gradient(ellipse 66% 96% at 50% 50%,#000 0%,#000 62%,transparent 100%);
  -webkit-mask-size:var(--cut-s),var(--cut-s),100% 100%,100% 100%;
  mask-size:var(--cut-s),var(--cut-s),100% 100%,100% 100%;
  -webkit-mask-position:var(--cut-p),var(--cut-p),0 0,0 0;
  mask-position:var(--cut-p),var(--cut-p),0 0,0 0;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  mask-mode:luminance,luminance,alpha,alpha;
  -webkit-mask-composite:source-in,source-in,source-in;
  mask-composite:intersect,intersect,intersect;
  animation:rimPulse 2.6s cubic-bezier(.45,0,.55,1) infinite;
}
@keyframes zoomPulse{
  0%,100%{opacity:.38;filter:brightness(1.2) saturate(1.12)}
  50%{opacity:1;filter:brightness(2) saturate(1.4)}
}
@keyframes rimPulse{
  0%,100%{opacity:.4;filter:saturate(1.35) drop-shadow(0 0 2px rgba(255,196,90,.7))}
  50%{opacity:1;filter:saturate(1.65) brightness(1.3)
      drop-shadow(0 0 2px rgba(255,214,120,.95)) drop-shadow(0 0 6px rgba(255,170,40,.8))
      drop-shadow(0 0 13px rgba(255,150,20,.5))}
}
#scene-game .hotspot .tap{
  position:absolute;top:50%;left:50%;transform:translateX(-50%);
  font-family:var(--f-pixel);font-size:8px;letter-spacing:.04em;white-space:nowrap;
  color:#ffe8a6;
  text-shadow:0 1px 0 #000,0 -1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 0 7px rgba(255,170,20,.95);
  animation:tapBlink 1.15s steps(1) infinite;
}
@keyframes tapBlink{0%,49%{opacity:1}50%,100%{opacity:.42}}

/* Nằm TRONG .world và DƯỚI .slab: clip nhập sai cũng chiếu nguyên chữ khắc
   đang sáng, nếu để nó đè lên lớp che thì mỗi lần sai là lộ hết đáp án. */
/* ── Robot Open World ─────────────────────────────────────────────────────
   Nằm TRÊN cả bệ đá (z-6) vì lúc trò chuyện thì cảnh cũ không còn việc gì.
   Hai clip chồng nhau để đổi nét mặt bằng cách nhoà chứ không giật cụp.
   Thiếu file thì lớp này rỗng, cảnh cũ vẫn còn nguyên — không vỡ gì. */
/* KHUNG PHẢI KHỚP VỚI CÁC ROUND. `.world` rộng 2.28:1 còn màn hình máy chỉ 4:3,
   tức người chơi luôn chỉ nhìn thấy khoảng 58% bề ngang của thế giới. Nếu trải
   clip robot ra cả `.world` thì hai bên bị cắt mất, mà cắt bao nhiêu lại tuỳ tỷ
   lệ file — mỗi clip một kiểu. Nên hộp này chốt đúng bằng BỀ NGANG MÀN HÌNH và
   neo giữa: clip nào cũng lọt đúng khung người chơi đang nhìn, y như các round.
   Bề ngang do fitOw() đo và ghi vào --ow-w. */
#scene-game .ow-layer{
  position:absolute;top:0;bottom:0;left:50%;width:var(--ow-w,100%);
  transform:translateX(-50%);z-index:7;display:none;background:#05080d;
}
#scene-game .ow-layer.on{display:block}
#scene-game .ow-layer img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
  opacity:0;transition:opacity .38s ease;
}
/* Ô nhập lúc trò chuyện: font pixel KHÔNG có dấu tiếng Việt, gõ "Ngươi" vào là
   chữ vỡ lung tung nửa font này nửa font kia. Đổi hẳn sang font hộp thoại. */
#scene-game .ctrl.ow #answer{
  font-family:var(--f-term);font-size:13px;letter-spacing:.01em;
  text-transform:none;color:var(--paper);
}
#scene-game .ctrl.ow #answer::placeholder{letter-spacing:.01em}
#scene-game .ow-layer img.on{opacity:1}
/* Kiểu "nổi": clip là hình robot cắt rời trên nền trong suốt → không phủ kín
   khung nữa mà đứng ở góc phải dưới, cảnh phía sau vẫn ngắm và vuốt được. */
#scene-game .ow-layer.noi{background:none;pointer-events:none}
#scene-game .ow-layer.noi img{
  inset:auto 3% 0 auto;width:auto;height:var(--ow-cao,72%);object-fit:contain;
}

/* ═══ KHUNG CLIP · ĐẶT ĐÚNG PHẦN THẾ GIỚI MÀ CLIP QUAY ════════════════════
   Ba clip trong bộ KHÔNG cùng khuôn hình, và đó là gốc của mọi rắc rối cũ:
     · anim_wrong        1280×561 → 2,282:1 = đúng tỷ lệ thế giới → phủ trọn
     · anim_unlock (cũ)   800×350 → 2,286:1 = đúng tỷ lệ thế giới → phủ trọn
     · anim_unlock_clean 1280×720 → 1,778:1 = CHỈ quay 78% GIỮA thế giới
   Số 78% không phải đoán: khớp khung đầu clip với bg_r1 và khung cuối với
   bg_r2 đều ra cùng một cửa sổ — rộng 78%, cao 100%, nằm giữa (lệch trung
   bình 2,3/255 mỗi kênh).

   VÌ SAO object-fit KHÔNG CỨU ĐƯỢC:
     · cover  → clip 16:9 nhét vào khung 2,28:1 phải phóng to 1,28 lần rồi cắt
                14% trên và 14% dưới. Cảnh trong clip to hơn và tụt xuống so
                với cảnh tĩnh nằm dưới → lớp chữ RAZER đứng nguyên chỗ cũ hoá
                ra "bay lên trời", và hai chú rắn giữa khung bị cắt mất.
     · contain→ hết cắt, nhưng cả cảnh thu nhỏ lại giữa hai dải nền → clip vừa
                chạy là cảnh "thụt" một cái, còn tệ hơn.
   Cách đúng: đặt thẻ ảnh ĐÚNG vào phần thế giới mà clip quay, rồi kéo căng
   (`fill`). Bề ngang do JS tính từ tỷ lệ thật của chính file clip
   (`khungClip()`), nên thả clip khác vào cũng tự khớp, không phải khai báo gì.
   Mặc định để phủ trọn: đo hụt thì vẫn chạy y như đời cũ. */
#scene-game .anim-layer{position:absolute;inset:0;z-index:5;display:none}
#scene-game .anim-layer.on{display:block}
#scene-game .anim-layer img{position:absolute;top:0;left:0;width:100%;height:100%;
  object-fit:fill;display:block}

#scene-game .scan{
  position:absolute;inset:0;z-index:6;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;opacity:.55;
}
#scene-game .glare{
  position:absolute;inset:0;z-index:7;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 8%,rgba(120,200,255,.10),transparent 55%),
             radial-gradient(140% 120% at 50% 50%,transparent 55%,rgba(0,0,0,.62) 100%);
  animation:flick 5.5s steps(2) infinite;
}
@keyframes flick{0%,97%{opacity:1}98%{opacity:.86}100%{opacity:1}}

#scene-game .hint{
  flex:0 0 auto;text-align:center;font-family:var(--f-term);font-size:9px;
  color:rgba(215,226,238,.34);letter-spacing:.04em;margin:0;
}

/* ── Nửa dưới · terminal ────────────────────────────────────────────────── */
#scene-game #term{
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px;
  padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));
}
#scene-game .narr{
  flex:1 1 auto;min-height:60px;overflow-y:auto;overscroll-behavior:contain;
  border:3px solid var(--neon);background:rgba(2,18,9,.62);padding:10px 11px;
  box-shadow:0 0 22px rgba(0,255,102,.16),inset 0 0 26px rgba(0,255,102,.06);
  font-size:12.5px;line-height:1.62;-webkit-overflow-scrolling:touch;
}
#scene-game .narr.shake{animation:shake .42s linear 1}
@keyframes shake{
  0%,100%{transform:translateX(0)}15%{transform:translateX(-6px)}30%{transform:translateX(6px)}
  45%{transform:translateX(-4px)}60%{transform:translateX(4px)}80%{transform:translateX(-2px)}
}
#scene-game .line{margin:0 0 6px;color:var(--neon);
  text-shadow:0 0 8px rgba(0,255,102,.35);word-break:break-word}
#scene-game .line:last-child{margin-bottom:0}
#scene-game .line.err{color:var(--red);text-shadow:0 0 8px rgba(255,51,85,.45)}
#scene-game .line.warn{color:var(--amber);text-shadow:0 0 8px rgba(255,170,0,.4)}
#scene-game .line.cy{color:var(--cyan);text-shadow:0 0 8px rgba(0,242,255,.4)}
#scene-game .line.sys{color:var(--muted);text-shadow:none}
#scene-game .caret{display:inline-block;width:.62em;height:1em;background:currentColor;
  vertical-align:-2px;animation:blink .9s steps(1) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

/* Thanh khoá: thay chỗ ô nhập trong lúc hệ thống đếm ngược */
#scene-game .lockbar{
  flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;
  border:3px solid var(--red);background:rgba(30,4,10,.6);padding:11px 12px;
  box-shadow:0 0 20px rgba(255,51,85,.2),inset 0 0 22px rgba(255,51,85,.08);
}
#scene-game .lockbar[hidden]{display:none}
#scene-game .lockbar b{font-family:var(--f-pixel);font-size:17px;color:var(--red);
  text-shadow:0 0 12px rgba(255,51,85,.7);letter-spacing:.06em}
#scene-game .lockbar span{font-size:11.5px;color:var(--muted);text-align:center}
/* Thanh chế độ xem lại bối cảnh */
#scene-game .gbar{flex:0 0 auto;display:flex;gap:8px}
#scene-game .gbar[hidden]{display:none}
#scene-game .gbar button{
  flex:1;font-family:var(--f-pixel);font-size:9px;letter-spacing:.04em;padding:12px 6px;
  cursor:pointer;color:var(--cyan);background:#08151f;border:2px solid rgba(0,242,255,.4);
}
#scene-game .gbar button.on{color:#04140a;background:linear-gradient(180deg,#7df9ff,#00c2d6);
  border-color:transparent}
#scene-game .gbar button.exit{color:var(--muted);border-color:rgba(31,41,61,.9);background:#06111d}
#scene-game .gbar button.ow{color:#ffcf6a;border-color:rgba(255,190,80,.45)}
#scene-game .gbar button.ow.on{color:#241701;background:linear-gradient(180deg,#ffd77e,#f2a83a);
  border-color:transparent}

/* ── OPEN WORLD · khu trò chuyện ─────────────────────────────────────────── */
#scene-game .owbar{flex:0 0 auto;display:flex;gap:6px;align-items:center;
  overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none}
#scene-game .owbar::-webkit-scrollbar{display:none}
#scene-game .owbar>*{flex:0 0 auto}
#scene-game .owbar[hidden]{display:none}
#scene-game .owbar .quota{
  font-family:var(--f-pixel);font-size:7px;letter-spacing:.04em;
  color:#ffcf6a;border:1px solid rgba(255,190,80,.4);padding:6px 7px;white-space:nowrap}
#scene-game .owbar .chip{
  font-family:var(--f-term);font-size:11px;line-height:1.2;cursor:pointer;
  color:rgba(190,238,255,.8);background:#06131d;border:1px solid rgba(0,242,255,.28);
  padding:6px 9px;border-radius:3px;-webkit-tap-highlight-color:transparent}
#scene-game .owbar .chip:active{background:#0d2130}
#scene-game .owbar .chip[disabled]{opacity:.35;cursor:default}
/* Câu của người chơi trong hộp thoại — thụt vào, tông khác lời dẫn truyện */
#scene-game .narr .line.me{color:#ffd98a;padding-left:14px}
#scene-game .narr .line.npc{color:#bfeeff}
/* ═══ ĐANG SOẠN CÂU TRẢ LỜI — BA CHẤM PHẢI ĐỘNG ══════════════════════════
   Trước đây chỗ này là chữ "..." đứng im. Người chơi hỏi xong, nhìn ba dấu
   chấm bất động vài giây thì đọc ra là TRANG BỊ ĐƠ, chứ không đọc ra là nhân
   vật đang nghĩ — đúng cái đã báo.
   Nay ba chấm nảy lần lượt như ô "đang soạn tin" của mọi app nhắn tin: cùng
   một nhịp 1,25s, mỗi chấm lệch pha 0,16s. Chuyển động rất nhỏ (2px) nên
   không cướp sự chú ý, nhưng đủ để mắt biết máy vẫn đang chạy.
   Máy nào bật chế độ giảm chuyển động thì thôi nảy, chuyển sang mờ-tỏ. */
#scene-game .narr .line.wait{color:rgba(190,238,255,.45);
  display:flex;align-items:center;gap:5px;min-height:1.4em}
/* Ô VUÔNG, không bo tròn: cả màn này là pixel-art, một chấm tròn mượt nằm
   giữa đám chữ răng cưa đọc ra ngay là "thứ của web hiện đại lạc vào". */
#scene-game .narr .line.wait i{width:6px;height:6px;border-radius:0;
  background:currentColor;display:block;animation:owGo 1.25s steps(1,end) infinite}
#scene-game .narr .line.wait i:nth-child(2){animation-delay:.16s}
#scene-game .narr .line.wait i:nth-child(3){animation-delay:.32s}
/* `steps(1,end)` = GIỮ NGUYÊN giá trị của mỗi mốc rồi NHẢY PHỰT sang mốc kế —
   ba vị trí dứt khoát 0 → -3px → 0, không có điểm nào ở giữa. Đúng kiểu con
   trỏ trong game pixel: nó không bao giờ đi nửa ô.
   (Thử `steps(2,end)` trước đó thì mỗi quãng chia đôi, hoá ra vẫn ghé qua
    -1,5px — tức là nửa ô, đúng cái đang muốn tránh.) */
@keyframes owGo{
  0%,60%,100%{transform:translateY(0);opacity:.35}
  30%{transform:translateY(-3px);opacity:1}
}
@media (prefers-reduced-motion:reduce){
  #scene-game .narr .line.wait i{animation:owMo 1.25s ease-in-out infinite}
  @keyframes owMo{0%,100%{opacity:.35}50%{opacity:1}}
}
#scene-game .ctrl{flex:0 0 auto;display:flex;gap:8px;align-items:stretch}
#scene-game .ctrl[hidden]{display:none}
/* Vòng 2 gõ ký tự nào là chấm ký tự đó — không còn gì để "nộp" nữa */
#scene-game .ctrl.nobtn #unlock{display:none}
#scene-game #answer{
  flex:1 1 auto;min-width:0;font-family:var(--f-pixel);font-size:12px;
  letter-spacing:.06em;text-transform:uppercase;background:#06111d;color:var(--amber);
  border:3px solid var(--bezel);padding:13px 10px;outline:none;caret-color:var(--amber);
}
#scene-game #answer::placeholder{color:rgba(215,226,238,.26);letter-spacing:.02em;
  font-family:var(--f-term)}
#scene-game #answer:focus{border-color:var(--neon);box-shadow:0 0 14px rgba(0,255,102,.28)}
#scene-game #answer:disabled{opacity:.45}
/* Vòng 2: gõ trật ký tự kế tiếp là mất lượt — nháy đỏ một nhịp cho biết */
#scene-game #answer.miss{animation:missFlash .5s ease-out 1}
@keyframes missFlash{
  0%,60%{border-color:#ff4d6d;box-shadow:0 0 12px rgba(255,77,109,.5)}
  100%{border-color:var(--bezel);box-shadow:none}
}
#scene-game.r2 #answer{color:var(--cyan);caret-color:var(--cyan)}
#scene-game #unlock{
  flex:0 0 auto;font-family:var(--f-pixel);font-size:10px;letter-spacing:.04em;
  padding:0 15px;border:0;cursor:pointer;color:#04140a;
  background:linear-gradient(180deg,#4dff96,#00c94f);
  box-shadow:0 4px 0 #026b2b,0 0 18px rgba(0,255,102,.28);
}
#scene-game #unlock:active{transform:translateY(3px);box-shadow:0 1px 0 #026b2b}
#scene-game #unlock:disabled{filter:grayscale(.7);opacity:.5;box-shadow:0 4px 0 #1c3326}

/* ── Màn nạp dữ liệu ────────────────────────────────────────────────────── */
#scene-game #boot{
  position:absolute;inset:0;z-index:40;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:24px;text-align:center;transition:opacity .5s ease;
}
#scene-game #boot.gone{opacity:0;pointer-events:none}
#scene-game #boot h1{font-family:var(--f-pixel);font-size:13px;line-height:1.8;
  margin:0;color:var(--amber);text-shadow:0 0 14px rgba(255,170,0,.5)}
#scene-game #boot .sub{font-size:12px;color:var(--muted);max-width:330px;
  line-height:1.6;margin:0;text-wrap:balance}
#scene-game .bar{width:190px;height:12px;border:3px solid var(--bezel);padding:2px;
  background:#06111d}
#scene-game .bar i{display:block;height:100%;width:0%;background:var(--neon);
  box-shadow:0 0 10px var(--neon);transition:width .3s ease}
#scene-game #startBtn{
  font-family:var(--f-pixel);font-size:11px;padding:14px 18px;border:0;cursor:pointer;
  color:#04140a;background:linear-gradient(180deg,#4dff96,#00c94f);
  box-shadow:0 5px 0 #026b2b,0 0 22px rgba(0,255,102,.35);
  animation:pressBlink 1.4s steps(1) infinite;
}
#scene-game #startBtn:active{transform:translateY(4px);box-shadow:0 1px 0 #026b2b}
@keyframes pressBlink{0%,60%{opacity:1}61%,100%{opacity:.72}}
#scene-game .loadtxt{font-family:var(--f-pixel);font-size:8px;color:var(--muted)}

/* ── Modal mật thư ──────────────────────────────────────────────────────── */
#scene-game #modal{
  position:absolute;inset:0;z-index:50;display:none;align-items:center;
  justify-content:center;padding:14px;background:rgba(3,7,12,.86);backdrop-filter:blur(3px);
}
#scene-game #modal.on{display:flex;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#scene-game .scroll{
  width:100%;max-width:420px;max-height:calc(var(--vh,100dvh) - 28px);
  display:flex;flex-direction:column;gap:10px;
  background:linear-gradient(180deg,#0a1622,#071019);border:3px solid var(--cyan);
  box-shadow:0 0 30px rgba(0,242,255,.28),inset 0 0 40px rgba(0,242,255,.06);
  padding:12px;overflow-y:auto;overscroll-behavior:contain;
  animation:popIn .38s cubic-bezier(.2,1.3,.4,1);
}
@keyframes popIn{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
#scene-game .mhead{
  position:relative;
  font-family:var(--f-term);font-weight:700;font-size:11px;text-align:center;
  color:var(--cyan);letter-spacing:.05em;text-shadow:0 0 12px rgba(0,242,255,.6);
  padding:2px 22px 4px;
}
/* Xem lại thư lần hai thì cho đóng nhanh — lượt chơi thật vẫn phải bấm
   [ HOÀN THÀNH HÀNH TRÌNH ] để chạy nốt màn kết. */
#scene-game .mx{
  position:absolute;top:-2px;right:-2px;width:26px;height:26px;display:none;
  align-items:center;justify-content:center;padding:0;cursor:pointer;
  font-family:var(--f-pixel);font-size:9px;line-height:1;
  color:var(--cyan);background:#08151f;border:2px solid rgba(0,242,255,.4);
}
#scene-game .mx.on{display:flex}
#scene-game .mx:active{background:#0e2333}
#scene-game .slidebox{position:relative;width:100%;aspect-ratio:4/3;background:#040a12;
  border:2px solid rgba(0,242,255,.35);overflow:hidden;flex:0 0 auto}
#scene-game .slidebox img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transform:scale(1.04);transition:opacity .55s ease,transform 3.4s linear;
  image-rendering:pixelated;
}
#scene-game .slidebox img.on{opacity:1;transform:scale(1)}
#scene-game .navrow{display:flex;align-items:center;justify-content:space-between;
  gap:8px;flex:0 0 auto}
#scene-game .navbtn{
  font-family:var(--f-pixel);font-size:8px;padding:11px 12px;cursor:pointer;
  color:var(--cyan);background:#08151f;border:2px solid rgba(0,242,255,.4);
}
#scene-game .navbtn:active{background:#0e2333}
#scene-game .dots{display:flex;gap:5px;justify-content:center;flex:1 1 auto}
#scene-game .dots i{width:7px;height:7px;background:rgba(0,242,255,.22);display:block}
#scene-game .dots i.on{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
/* Chừa một khoảng trống dưới đáy (~2 dòng): khung luôn cuộn tới đáy, nên khoảng
   này đẩy dòng đang gõ lên cao hơn mép dưới. Không có nó thì chữ vừa hiện ra đã
   nằm sát đáy khung, mắt phải dán xuống mép — đọc rất mỏi. */
#scene-game .letterbox{
  flex:1 1 auto;min-height:96px;max-height:34dvh;overflow-y:auto;overscroll-behavior:contain;
  border:2px solid rgba(0,242,255,.3);background:rgba(0,20,28,.5);padding:11px 12px 46px;
  font-size:12.5px;line-height:1.72;color:#bfeeff;white-space:pre-wrap;
}
#scene-game .letterbox i{font-style:italic;color:#9ddcef}
#scene-game #finish{
  flex:0 0 auto;font-family:var(--f-term);font-weight:700;font-size:12px;
  letter-spacing:.04em;padding:14px 10px;border:0;cursor:pointer;color:#04140a;
  background:linear-gradient(180deg,#7df9ff,#00c2d6);
  box-shadow:0 5px 0 #026a75,0 0 22px rgba(0,242,255,.35);
}
#scene-game #finish:active{transform:translateY(4px);box-shadow:0 1px 0 #026a75}
#scene-game #finish[disabled]{filter:grayscale(.6);opacity:.55}

#scene-game #fx{position:absolute;inset:0;z-index:60;pointer-events:none;display:none}
#scene-game #fx.on{display:block}

@media (prefers-reduced-motion:reduce){
  #scene-game .aura,#scene-game .dragon-layer,#scene-game .hotspot .zoom,
  #scene-game .glare{animation:none}
}
</style>
</head>

<!-- ĐƯỜNG DẪN ĐẦY ĐỦ TỪ GỐC, KHÔNG ĐƯỢC viết "config.js" trống trơn.
     Viết tương đối thì trình duyệt ghép vào URL đang mở: vào đúng
     .../dad/950901-b/ thì ra .../dad/950901-b/config.js (đúng), nhưng vào
     .../dad/950901-b (thiếu dấu / cuối) thì nó coi "950901-b" là tên file và
     đi tìm .../dad/config.js → 404 → GATE_CONFIG không tồn tại → cả trang chết,
     chỉ còn khung tĩnh, bấm nút nào cũng trơ. Đã dính đúng lỗi này trên bản
     chạy thật. Viết đủ từ gốc thì vào kiểu URL nào cũng nạp đúng file. -->
<script src="/dad/950901-b/config.js"></script>
<script>
/* ═══ CHỐT AN TOÀN CHO config.js ══════════════════════════════════════════
   BẪY ĐÃ VẤP — mất cả buổi mới tìm ra, ghi lại cho khỏi vấp lần hai:
   `letter_content` và mấy đoạn văn dài trong config.js nằm trong dấu BACKTICK
   (`...`). Chỉ cần gõ nhầm MỘT dấu backtick hay một chữ ${ vào giữa đoạn văn
   là cả file config.js thành sai cú pháp → trình duyệt bỏ nguyên file → biến
   GATE_CONFIG không tồn tại → mọi đoạn mã bên dưới chết theo.

   Lúc đó trang KHÔNG báo gì cả. Nó vẫn vẽ ra màn cổng vì chữ mặc định nằm sẵn
   trong HTML, nhưng: không có dòng version, không có đồng hồ đếm ngược, và
   bấm nút nào cũng không nhảy đi đâu — nhìn y như trang bị "kẹt cứng", chẳng
   ai đoán được là do sửa nội dung bức thư.

   Nay hỏng thì NÓI THẲNG RA MÀN HÌNH, kèm câu lỗi của trình duyệt, để biết
   ngay là phải đi sửa config.js chứ không phải lỗi máy hay lỗi mạng. */
(function(){
  var thieu = [];
  if(typeof GATE_CONFIG === 'undefined') thieu.push('GATE_CONFIG');
  if(typeof GAME_CONFIG === 'undefined') thieu.push('GAME_CONFIG');
  if(!thieu.length) return;

  /* Chạy lại file để LẤY ĐÚNG CÂU LỖI và số dòng — chỉ để hiện cho người sửa,
     không cố chạy tiếp. Lấy được thì tốt, không lấy được cũng không sao. */
  function hien(chiTiet){
    var box = document.createElement('div');
    box.setAttribute('style',
      'position:fixed;inset:0;z-index:9999;overflow:auto;padding:24px 18px;'+
      'background:#0d1117;color:#e6edf3;font:13px/1.65 ui-monospace,Menlo,Consolas,monospace');
    box.innerHTML =
      '<p style="margin:0 0 10px;color:#ff6b6b;font-weight:700;font-size:15px">'+
      'config.js bị lỗi cú pháp — trang không chạy được</p>'+
      '<p style="margin:0 0 14px;color:#9fb0c3">Thiếu biến: <b>'+thieu.join(', ')+'</b></p>'+
      '<pre style="margin:0 0 16px;padding:12px;border-radius:8px;background:#161b22;'+
      'color:#ffa657;white-space:pre-wrap;word-break:break-word">'+
      String(chiTiet||'(không lấy được câu lỗi — mở Console của trình duyệt để xem)')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</pre>'+
      '<p style="margin:0 0 8px;color:#9fb0c3">Hay gặp nhất: khi sửa nội dung '+
      '<b>letter_content</b> (bức thư) đã gõ nhầm một dấu <b>`</b> (backtick) '+
      'hoặc một chữ <b>${</b> vào giữa đoạn văn. Hai ký tự đó là ký tự đặc biệt '+
      'của JavaScript, không được xuất hiện trong lời văn.</p>'+
      '<p style="margin:0;color:#9fb0c3">Mở <b>dad/950901-b/config.js</b>, tìm '+
      'đúng dòng bên trên, xoá ký tự đó đi rồi deploy lại.</p>';
    document.body.appendChild(box);
  }

  var xong = false;
  try{
    fetch('config.js?soi=' + Date.now())
      .then(function(r){ return r.text(); })
      .then(function(src){
        if(xong) return; xong = true;
        try{ new Function(src); hien('(file nạp được nhưng biến vẫn thiếu — kiểm tra tên biến trong config.js)'); }
        catch(e){ hien(e && (e.name + ': ' + e.message)); }
      })
      .catch(function(){ if(!xong){ xong = true; hien('Không tải được config.js — kiểm tra file có nằm cùng thư mục không.'); } });
  }catch(e){ hien(null); }
  setTimeout(function(){ if(!xong){ xong = true; hien(null); } }, 4000);
})();
</script>
<script>
/* ════════════════════════════════════════════════════════════════════════════
   BỘ MÁY — chữ nghĩa nằm hết ở config.js
   ════════════════════════════════════════════════════════════════════════════ */
(function(){
'use strict';

const $ = (s,r)=> (r||document).querySelector(s);
const wait = ms => new Promise(r=>setTimeout(r,ms));

/* ═══ BÁO TIẾN ĐỘ VỀ /api/ping ═══════════════════════════════════════════
   Trang này TRƯỚC ĐÂY KHÔNG BÁO GÌ CẢ — cả Easter Egg · Gate 2 lẫn khu Open
   World đều mù hoàn toàn, trong khi bốn trang còn lại của bộ đều có. Nghĩa là
   không cách nào biết được có bao nhiêu người vào tới cổng, bao nhiêu bấm nút
   chơi, kẹt ở vòng nào, có mở nổi bức thư không, có vào Open World không.
   Nay bám đúng khuôn của mấy trang kia: `sendBeacon` trước (gửi được cả khi
   người ta vừa đóng tab), không có thì `fetch keepalive`. Im lặng tuyệt đối —
   hỏng cũng không được làm phiền người chơi.
   `chiMotLan` cho mấy mốc chỉ có ý nghĩa lần đầu (vào cổng, phá đảo…), khỏi
   thổi phồng số liệu khi người ta F5 mấy lượt. */
/* Đang ở màn nào của Gate 2, người chơi tới đâu — chuông báo phải nói đúng
   chỗ, xem ghi chú ở `tieuDe()` trong api/ping.js.

   ⚠ ĐỌC QUA DOM VÀ Ổ NHỚ, ĐỪNG ĐỌC THẲNG `S` / `owOn` / `Store`.
   BẪY ĐÃ VẤP: ba cái đó khai bằng `const`/`let` Ở DƯỚI hàm này. Cú ping đầu
   tiên (vào cổng) chạy trước lúc chúng được khởi tạo, nên đọc tên là rơi vào
   vùng chết — ReferenceError, `catch` nuốt, hai dòng lặng lẽ rỗng. `typeof`
   cũng không cứu được: với `let`/`const` chưa khởi tạo thì `typeof` cũng ném.
   Màn hiện tại thì nhìn lớp `.on` trên `<main class="scene">`, số vòng nhìn
   bảng HUD, còn cờ phá đảo đọc thẳng ổ nhớ. */
function manG2(){
  const m = document.querySelector('main.scene.on');
  return m ? m.id : '';
}
function noiG2(){
  try{
    if(document.querySelector('.ls-nen.on')) return 'Bản ghi';
    const bar = document.getElementById('owbar');
    if(bar && !bar.hidden) return 'Khu Open World';
    const id = manG2();
    const m = id === 'scene-game' ? 'Màn chơi'
            : id === 'scene-code' ? 'Màn phát mã' : 'Màn cổng';
    const v = vongG2();
    return v ? m + ' · vòng ' + v : m;
  }catch(e){ return ''; }
}
/* Số vòng đọc từ bảng HUD — nhưng CHỈ khi đang thật sự ở màn chơi: chữ
   "ROUND 01/02" nằm sẵn trong HTML ngay từ lúc tải, đọc lúc còn ở cổng thì
   báo "vòng 1" cho một người chưa bấm vào game bao giờ. */
function vongG2(){
  try{
    if(manG2() !== 'scene-game') return 0;
    const r = document.getElementById('hudRound');
    const n = r ? (r.textContent.match(/\d+/) || [])[0] : null;
    return n ? +n : 0;
  }catch(e){ return 0; }
}
function ttG2(){
  try{
    let m = {};
    try{ m = JSON.parse(localStorage.getItem('mtv1') || '{}') || {}; }catch(e){}
    const id = manG2();
    if(m.g2Done || id === 'scene-code') return 'Đã phá đảo Gate 2';
    const v = vongG2();
    return v ? 'Đang ở vòng ' + v : 'Chưa vào game';
  }catch(e){ return ''; }
}
function ping(ev, detail, chiMotLan){
  try{
    if(chiMotLan){
      let da = [];
      try{ da = JSON.parse(localStorage.getItem('g2ping') || '[]') || []; }catch(e){}
      const tag = ev + ':' + (detail || '');
      if(da.indexOf(tag) >= 0) return;
      da.push(tag);
      try{ localStorage.setItem('g2ping', JSON.stringify(da)); }catch(e){}
    }
    const body = JSON.stringify({
      ev: ev, detail: detail || '', at: new Date().toISOString(),
      man: 'dad-950901-b', trang: 'dad-b', noi: noiG2(), tt: ttG2(), solved: [],
      ua: navigator.userAgent.slice(0, 120)
    });
    if(navigator.sendBeacon &&
       navigator.sendBeacon('/api/ping', new Blob([body],{type:'application/json'}))) return;
    fetch('/api/ping',{ method:'POST', body: body, keepalive:true,
      headers:{'Content-Type':'application/json'} }).catch(()=>{});
  }catch(e){}
}

/* Chữ trên tem chân màn hình: số phiên bản + dòng ký tên. Một chỗ dựng duy
   nhất cho cả màn đếm ngược lẫn màn phát mã, khỏi sửa hai nơi rồi lệch nhau. */
function temChu(){
  const T = GATE_CONFIG.text;
  /* Dòng ký tên nằm TRÊN, số phiên bản nằm dưới và gói gọn MỘT hàng
     ("Last updated … · V04.03"). Trước đây ngược lại và số phiên bản chiếm hai
     hàng — ba dòng chữ nhỏ chồng nhau ở chân màn hình, đọc rối mà chẳng dòng
     nào nổi lên được. */
  /* Số hiệu và ngày lấy từ SỔ (`LichSu.tem`), `T.version` trong config chỉ còn
     là bản lùi khi lichsu.js không tải nổi. Trước đây khai ở hai chỗ nên bump
     số mà quên ngày — xem DESIGN-SYSTEM.md §4. */
  var ver = T.version;
  try{
    var t = window.LichSu && LichSu.tem && LichSu.tem('DAD-B');
    if(t) ver = 'Last updated ' + t.ngay + ' · ' + t.ver;
  }catch(e){}
  return (T.designed_by ? '<span class="vby">' + T.designed_by + '</span>' : '') + ver;
}

/* ── Kho localStorage dùng chung, một chỗ đọc/ghi duy nhất ────────────────── */
const Store = {
  get(){ try{ return JSON.parse(localStorage.getItem('mtv1') || '{}') || {}; }catch(e){ return {}; } },
  patch(o){ try{ const m = Store.get(); Object.assign(m,o);
    localStorage.setItem('mtv1', JSON.stringify(m)); }catch(e){} }
};

/* ═══ VÀO ĐƯỢC ĐÂY = ĐÃ QUA GATE 2 ═══
   BẪY ĐÃ VẤP: cờ `eggWin` trước đây CHỈ được ghi ở ba chỗ bên ngoài. Ai tới
   thẳng trang này thì cờ không có, và Map 3 báo "chưa có chìa khoá vào lâu đài"
   dù vừa mới thắng xong. Nay chính TRANG NÀY ghi cờ. */
if(!Store.get().eggWin) Store.patch({eggWin:true});

/* ── Chuyển màn ──────────────────────────────────────────────────────────── */
const SCENES = { gate:$('#scene-gate'), game:$('#scene-game'), code:$('#scene-code') };
let sceneNow = 'gate';
/* Khối Game khai báo mãi bên dưới. Không thể canh bằng typeof — `typeof` trên
   một const đang trong vùng chết (TDZ) VẪN ném lỗi. Dùng cờ thường. */
let gameReady = false;
