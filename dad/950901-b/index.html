/* ── Chiều cao thật & bàn phím ảo ────────────────────────────────────────── */
const vv = window.visualViewport;
function syncVH(){
  const h = vv ? vv.height : window.innerHeight;
  document.documentElement.style.setProperty('--vh', h + 'px');
  const kb = vv ? (window.innerHeight - vv.height > 120) : false;
  document.body.classList.toggle('kb-open', kb);
  if(gameReady) Game.layout();
}
if(vv){ vv.addEventListener('resize', syncVH); vv.addEventListener('scroll', syncVH); }
window.addEventListener('resize', syncVH, {passive:true});
window.addEventListener('orientationchange', ()=> setTimeout(syncVH,250));

/* ═══ CO TIÊU ĐỀ CHO VỪA MỘT HÀNG ═══
   Các dòng của h1 đặt `nowrap`, nên dòng nào dài hơn khung sẽ TRÀN RA NGOÀI
   chứ không tự xuống hàng — đo mới biết, nhìn thì không. */
function fitTitle(root){
  const h = root && root.querySelector('h1');
  if(!h) return;
  for(let px = 30; px >= 15; px--){
    h.style.fontSize = px + 'px';
    let qua = false;
    h.querySelectorAll('.d, .khoa').forEach(d=>{
      if(d.scrollWidth > d.clientWidth + 0.5) qua = true;
    });
    if(!qua) return;
  }
}
/* Đo TRƯỚC khi webfont về là đo nhầm: Oswald hẹp hơn font dự phòng khá nhiều. */
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(()=>{ fitTitle(SCENES[sceneNow]); if(gameReady) Game.layout(); });
}

/* ════════════════════════════════════════════════════════════════════════════
   KHỐI VẬN HÀNH — cửa hậu dùng chung cho màn cổng và màn phát mã
   ----------------------------------------------------------------------------
   Một cửa, một luật: gõ 10 nhịp vào tem ở chân màn hình. Bảng mở ra chứa mọi
   lối vận hành của trang — nút xem BẢN GHI, và (chỉ ở màn cổng, khi chưa phá
   đảo) lối đi thẳng màn cuối.

   VÌ SAO GOM VÀO BẢNG: bản trước đẻ ra một hàng nút ngay giữa màn cổng, nút
   "Bỏ qua" viền đứt đứng cạnh nút sổ tròn — hai thứ khác cỡ khác kiểu chen
   nhau, trông như lỗi dựng trang. Bên Zoey's Castle đã có sẵn khuôn Khối vận
   hành gọn gàng, nay Gate 2 dùng đúng khuôn đó cho cả bộ thống nhất.
   ════════════════════════════════════════════════════════════════════════════ */
const Kvh = (function(){
  const nen = $('#kvh'), than = $('#kvhBody');
  function dong(){ nen.classList.remove('on'); nen.setAttribute('aria-hidden','true'); }
  $('#kvhX').addEventListener('click', dong);
  nen.addEventListener('click', e=>{ if(e.target === nen) dong(); });
  /* Esc đóng ĐÚNG MỘT LỚP — lớp trên cùng. Sổ bản ghi (`.ls-nen`, z-index rất
     cao) nằm đè lên bảng này và cũng nghe Esc ở cấp cửa sổ, nên nếu không né
     thì một cú Esc đóng luôn cả hai: người xem đang đọc bản ghi, gõ Esc để
     quay ra bảng vận hành thì rơi thẳng về màn chơi. Đang mở sổ thì để sổ tự
     xử, bảng này đứng yên. */
  addEventListener('keydown', e=>{
    if(e.key !== 'Escape' || !nen.classList.contains('on')) return;
    if(document.querySelector('.ls-nen.on')) return;
    dong();
  });

  function mo(man){
    const xong = !!Store.get().g2Game;
    /* Cửa vào bản ghi (`data-ls`) dựng ĐÚNG LÚC MỞ, không dựng sẵn trong DOM:
       đây là cửa hậu, bày sẵn thì ai soi mã trang cũng thấy. */
    /* ═══ KHÔNG CHỈ ĐƯỜNG ═══════════════════════════════════════════════════
       Dòng "Bấm 3 nhịp vào chữ Khối vận hành để xem bản ghi" đã BỎ. Nó biến
       một cửa hậu thành một cái nút có hướng dẫn dán bên cạnh — mò ra Khối vận
       hành xong thì tầng thứ hai coi như cho không.

       Nhưng cũng không để hộp trống trơ một dòng tiêu đề: thay bằng một dòng
       TRẠNG THÁI, đúng khuôn Khối vận hành bên Zoey's Castle ("Tiến độ: 3/6")
       và Secret Chamber ("Trạng thái: đã mở khoá"). Nó nói về màn chơi, không
       nói gì về cửa hậu — ai mò ra thì mò, không thì kệ. */
    const r = Store.get();
    const tt = xong ? 'đã phá đảo'
             : (r.g2Xong ? 'đã giải xong hai vòng'
             : (r.g2Vao  ? 'đang giải mã' : 'chưa vào màn chơi'));
    let h = '<p class="kvh-lab"><span '
          + (window.LichSu ? LichSu.chu('DAD-B') : '') + '>Khối vận hành</span></p>'
          + '<p class="kvh-txt">Trạng thái: <b>' + tt + '</b></p>';
    if(man === 'gate' && !xong)
      h += '<button class="kvh-go" id="kvhSkip" type="button">⏭ Bỏ qua · vào thẳng màn cuối</button>';
    than.innerHTML = h;
    nen.classList.add('on');
    nen.setAttribute('aria-hidden','false');
    const s = $('#kvhSkip');
    if(s) s.addEventListener('click', ()=>{
      /* Ghi ĐỦ BỘ CỜ, y như đi hết game thật: `g2Game` cho trang này nhớ là đã
         phá đảo (lần sau vào là thẳng màn phát mã), `g2Done` cho BẢN ĐỒ bật hộp
         chào Gate 2, `g2Xong` cho cảnh vòng 2 dựng lại ở trạng thái đã giải khi
         bấm xem lại. Thiếu bộ cờ này thì bỏ qua xong quay ra bản đồ vẫn im ru. */
      ping('g2_bo_qua', 'khối vận hành · cửa hậu 10 nhịp');
      Store.patch({ g2Skip:true, g2Game:true, g2Done:true, g2Xong:true, eggWin:true });
      dong();
      Code.open();
    });
  }

  /* Gắn bộ đếm nhịp vào một cái tem. Ngưng gõ 0,9 giây là đếm lại từ đầu — y
     như cửa hậu bên bản đồ. Cố ý KHÔNG đếm hộ còn mấy nhịp: biết trước thì hết
     thú mò ra, chỉ nháy màu tem cho biết đang gõ đúng chỗ. */
  function gan(tem, man){
    if(!tem) return;
    let n = 0, hen = null;
    tem.addEventListener('click', ()=>{
      clearTimeout(hen);
      n++;
      hen = setTimeout(()=>{ n = 0; }, 900);
      if(n >= 4){
        tem.classList.add('hit');
        setTimeout(()=> tem.classList.remove('hit'), 260);
      }
      if(n >= 10){ n = 0; mo(man); }
    });
  }
  return { gan, mo, dong };
})();

/* ════════════════════════════════════════════════════════════════════════════
   ① MÀN ĐẾM NGƯỢC
   ════════════════════════════════════════════════════════════════════════════ */
const Gate = (function(){
  const G = GATE_CONFIG, T = G.text;
  const el = { vai:$('#gVai'), tit:$('#gTit'), loi:$('#gLoi'), dem:$('#gDem'),
               play:$('#gPlay'), stamp:$('#gStamp'), back:$('#gBack') };

  const ISO = G.moc_iso.replace('{YEAR}', new Date().getFullYear());
  const MOC = new Date(ISO).getTime();
  const d   = ISO.slice(0,10).split('-');

  el.vai.textContent   = T.vai_truoc;
  el.play.textContent  = T.nut_vao_game;
  el.stamp.innerHTML   = temChu();
  el.back.textContent  = T.ve_ban_do;
  el.tit.innerHTML = '<span class="d">'+T.tieu_de+'</span><span class="khoa">'+T.nhan_khoa+'</span>';
  el.loi.innerHTML = T.hen.replace('{DATE}', d[2]+'-'+d[1]);

  /* Cửa hậu từ Box Tổng tư lệnh: cờ `g2Hack` = coi như đã tới mốc. */
  const BYPASS = !!Store.get().g2Hack;

  /* ═══ BẮT ĐẦU NẠP TÀI NGUYÊN NGAY TỪ ĐÂY ══════════════════════════════
     Chỉ nạp khi người chơi SẮP VÀO ĐƯỢC — đã qua mốc, hoặc đi cửa hậu. Chưa
     tới ngày mà kéo 71 MB về thì phí toi, người ta còn chưa chơi được.
     Đặt ở đây (lúc dựng màn đếm ngược) chứ không đặt trong moCong(): moCong
     chỉ chạy khi đồng hồ về 0, mà quãng 10 giây chờ trước đó chính là lúc
     rảnh nhất để tải. Hoãn một nhịp cho khối Game khai báo xong đã. */
  let daNap = false;
  function napNgam(){
    /* `gameReady` chứ không phải `window.Game`: khối Game khai bằng `const` nên
       nó KHÔNG nằm trên `window`, và gọi trước dòng khai báo là vấp TDZ chết cả
       trang (bẫy này đã ghi ở khối setTimeout bên dưới). `gameReady` bật lên ở
       dòng cuối file, nên thấy nó true là chắc chắn gọi Game được. */
    if(daNap || !gameReady) return;
    daNap = true;
    Game.prefetch();
  }
  let vaoRoi   = !!Store.get().g2Vao;
  const CHO    = G.cho_lan_dau_ms, moTu = Date.now();
  let timer = 0, moKhoaRoi = false;

  function p2(n){ return (n<10?'0':'') + n; }

  /* ═══ DÒNG CHỜ MẤY GIÂY CUỐI ══════════════════════════════════════════════
     `cua_dang_mo` khai bằng MẢNG: chia đều quãng chờ cho từng câu rồi đọc lần
     lượt, KHÔNG bốc ngẫu nhiên. Ngẫu nhiên thì câu nhảy lung tung, có khi lùi
     lại câu vừa đọc — nhìn ra ngay là chữ trang trí. Đi tuần tự thì nó thành
     một tiến trình: tải assets → dựng bối cảnh → khởi động → kiểm tra, đúng
     thứ tự máy đang làm thật (Game.prefetch chạy ngay sau đó).
     Khai bằng chuỗi đơn thì vẫn chạy như cũ, đứng yên một câu. */
  function cauCho(daQua){
    const v = T.cua_dang_mo;
    if(!Array.isArray(v)) return v || '';
    if(!v.length) return '';
    const i = Math.floor(daQua / (CHO / v.length));
    return v[Math.max(0, Math.min(v.length - 1, i))];
  }

  function moCong(){
    if(moKhoaRoi) return;
    moKhoaRoi = true;
    clearInterval(timer);
    el.dem.textContent = '';
    /* Đã phá đảo mini-game rồi thì khỏi bắt chơi lại — vào thẳng màn phát mã. */
    if(Store.get().g2Game){ Code.open(); return; }
    el.loi.textContent = T.moi_vao_game;
    el.play.hidden = false;
    ping('g2_cong_mo', '', true);
    napNgam();                       /* thường đã chạy từ trước, gọi cho chắc */
    fitTitle(SCENES.gate);
  }

  function tick(){
    const con = BYPASS ? 0 : MOC - Date.now();
    if(con <= 0 && !vaoRoi){
      /* ═══ GHÉ SAU MỐC: đếm thêm vài giây rồi mới mở ═══
         Tới nơi mà cửa bày sẵn ra thì mất hẳn cảm giác "vừa mở cho mình". */
      napNgam();                     /* qua mốc rồi → tải ngay, đừng đợi cửa mở */
      const lai = CHO - (Date.now() - moTu);
      if(lai > 0){
        el.loi.textContent = cauCho(CHO - lai);
        el.dem.innerHTML = '<b>' + Math.ceil(lai/1000) + '</b>S';
        return;
      }
      vaoRoi = true; Store.patch({g2Vao:true});
    }
    if(con <= 0){ moCong(); return; }
    el.dem.innerHTML = '<b>' + Math.floor(con/864e5) + '</b>N '
      + '<b>' + p2(Math.floor(con%864e5/36e5)) + '</b>G '
      + '<b>' + p2(Math.floor(con%36e5/6e4)) + '</b>P '
      + '<b>' + p2(Math.floor(con%6e4/1e3)) + '</b>S';
  }

  el.play.addEventListener('click', ()=>{
    ping('g2_bam_choi');
    show('game'); Game.start();
  });

  /* ═══ CỬA HẬU · GÕ 10 NHỊP VÀO TEM "LAST UPDATED" ════════════════════════
     Giống hệt cửa hậu trên bản đồ (10 nhịp vào dòng Last updated ở chân
     trang), để hai nơi cùng một luật chơi — mò ra được ở đây thì ở kia cũng
     biết đường. Gõ đủ 10 cái thì ra KHỐI VẬN HÀNH — trong bảng đó, dòng chữ
     "Khối vận hành" chính là cửa vào bản ghi, cạnh nó là lối đi thẳng màn
     cuối; xem khối `Kvh` phía trên.
     Ngưng gõ 0,9 giây là đếm lại từ đầu — y như bên bản đồ.
     Cố ý KHÔNG đếm hộ còn mấy nhịp: biết trước thì hết thú mò ra. Chỉ nháy màu
     tem cho biết đang gõ đúng chỗ. */
  Kvh.gan(el.stamp, 'gate');
  /* CỐ Ý KHÔNG NHỚ: mỗi lần vào là phải gõ lại đủ 10 nhịp. Bản trước có nhớ
     (`if(Store.get().g2Skip) moSkip()`), thành ra lần sau mở trang là lối đi
     tắt bày sẵn ngay dưới nút chính — mất hết cảm giác cửa giấu, mà người chơi
     bình thường cũng nhìn thấy luôn. Cửa hậu thì phải mò ra lại từ đầu. */

  fitTitle(SCENES.gate);
  /* Hoãn nhịp ĐẦU sang vòng sau: khi đã qua mốc (hoặc bật cờ g2Hack), tick()
     gọi thẳng Code.open() / Game.prefetch() — hai khối đó khai báo bên dưới,
     gọi ngay tại đây là vấp TDZ và cả trang chết. */
  setTimeout(()=>{
    /* ĐÃ PHÁ ĐẢO (chơi thật hoặc đi cửa hậu) thì vào thẳng màn phát mã, KHÔNG
       bắt xem lại đồng hồ đếm ngược. Trước đây chỉ `moCong()` mới kiểm tra cờ
       này, mà moCong() lại chỉ chạy khi đồng hồ về 0 — nên ai bỏ qua bằng cửa
       hậu trước ngày 01-09 thì lần sau vào vẫn thấy đồng hồ, như chưa từng
       thắng. Kiểm ở đây là mọi đường vào đều nhất quán. */
    if(Store.get().g2Game){ Code.open(); return; }
    ping('g2_vao_cong', BYPASS ? 'cửa hậu' : 'bình thường', true);
    if(BYPASS) napNgam();            /* cửa hậu: vào tới nơi là chơi ngay */
    tick(); timer = setInterval(tick, 1000);
  }, 0);
  return {};
})();

/* ════════════════════════════════════════════════════════════════════════════
   ③ MÀN PHÁT MÃ TYRION
   ════════════════════════════════════════════════════════════════════════════ */
const Code = (function(){
  const G = GATE_CONFIG, T = G.text;
  const el = { vai:$('#cVai'), tit:$('#cTit'), loi:$('#cLoi'), maO:$('#cMaO'),
               maLab:$('#cMaLab'), replay:$('#cReplay'), review:$('#cReview'),
               go:$('#cGo'), stamp:$('#cStamp'), back:$('#cBack') };
  let dungSan = false;

  function build(){
    if(dungSan) return;
    dungSan = true;
    el.vai.textContent   = T.vai_sau;
    el.loi.textContent   = T.da_pha_dao;
    el.maLab.textContent = T.ma_nhan;
    [[el.replay, T.nut_choi_lai_game], [el.review, T.nut_xem_lai]].forEach(([n,t])=>{

    Kvh.gan(el.stamp, 'code');

/* ═══ BỐ CỤC ══════════════════════════════════════════════════════════════
   Khung máy phải vừa CẢ bề ngang lẫn trần chiều cao. Trần đo từ chiều cao cả
   màn (không phải từ #stage) nên không vòng lặp: #stage cao bao nhiêu là do
   khung máy quyết định, chứ không ngược lại. Nhờ vậy không còn khoảng trống
   chết giữa khung máy và hộp thoại terminal.                                */
function fitBezel(){
  if(!el.root.classList.contains('on')) return;
  const appH = el.root.clientHeight;
  if(!appH) return;
  const kb   = document.body.classList.contains('kb-open');
  const maxH = Math.max(60, appH * (kb ? C.frame.max_h_kb : C.frame.max_h));
  /* ═══ KHUNG MÁY LUÔN RỘNG BẰNG HỘP THOẠI BÊN DƯỚI ════════════════════════
     Bản trước bó BỀ NGANG theo trần chiều cao: w = maxH × 4/3. Trên màn cao
     (máy tính bảng, cửa sổ desktop hẹp mà dài) thì trần đó cắt bề ngang xuống
     nhỏ hơn hẳn hộp thoại terminal — nhìn ra ngay là ảnh bị thụt vào hai bên,
     lệch hẳn với cả cột nội dung.
     Nay làm ngược lại: BỀ NGANG luôn ăn trọn bề ngang khung (đúng bằng hộp
     thoại), còn cao quá trần thì XÉN BỚT CHIỀU CAO. Ảnh nền vốn rất rộng
     (2.28:1) nên xén chiều cao chỉ là thấy ít cảnh theo chiều dọc hơn, không
     méo, không mất chi tiết ngang. Đặt cả width lẫn height nên `aspect-ratio`
     trong CSS tự nhường — không cần bỏ dòng đó. */
  const w = el.slot.clientWidth;
  const h = Math.min(w / C.frame.ratio, maxH);
  el.bezel.style.width  = w.toFixed(1) + 'px';
  el.bezel.style.height = h.toFixed(1) + 'px';
}
/* ═══ CẮT ẢNH THEO Ô ══════════════════════════════════════════════════════
   Mỗi ô là một "cửa sổ" nhìn vào đúng một mẩu ảnh nền: đặt background-size
   bằng cả khổ ảnh rồi dời background-position tới đúng toạ độ mẩu đó. Nhờ vậy
   ký tự sáng lên là NÉT CHỮ KHẮC THẬT trong tranh, không phải chữ do font vẽ. */
const pc = v => parseFloat(v) / 100;
/* Lớp che nới ra bao nhiêu so với ô chữ (khớp với dải nhoè trong CSS).
   Bản `_SACH` dùng khi dán đá thật — nới rộng gấp đôi cho phủ trọn nét khắc,
   xem ghi chú ở fitSlabs(). */
const VEIL_PAD_X = 0.14, VEIL_PAD_Y = 0.34;
const VEIL_PAD_X_SACH = 0.30, VEIL_PAD_Y_SACH = 0.85;
/* Bán kính nhoè = bấy nhiêu lần CHIỀU CAO bảng đá (xem ghi chú ở fitSlabs) */
const VEIL_BLUR_K = 0.27;
/* Nhoè con ngươi = 22% chiều cao con ngươi. Đủ để mép tan hẳn vào tròng mắt
   mà lõi vẫn còn ra hình. Xem ghi chú ở `.eye .iris`. */
const IRIS_BLUR_K = 0.22;
function cutOut(node, W, H, L, T2, w, h){
  node.style.width  = w.toFixed(2) + 'px';
  node.style.height = h.toFixed(2) + 'px';
  const size = W.toFixed(2) + 'px ' + H.toFixed(2) + 'px';
  const pos  = (-L).toFixed(2) + 'px ' + (-T2).toFixed(2) + 'px';
  node.style.backgroundSize     = size;
  node.style.backgroundPosition = pos;
  /* Mặt nạ theo độ sáng dùng lại y hệt mẩu ảnh này (xem .cell .gl trong CSS) */
  node.style.setProperty('--cut',   node.style.backgroundImage || 'none');
  node.style.setProperty('--cut-s', size);
  node.style.setProperty('--cut-p', pos);
}
function fitSlabs(){
  const W = el.world.offsetWidth, H = el.world.offsetHeight;
  if(!W || !H) return;
  [[el.slab1, el.row1, C.round1], [el.slab2, el.row2, C.round2]].forEach(([slab,row,cfg])=>{
    const n = row.children.length;
    if(!n) return;
    const p = cfg.slab;
    const L = W*pc(p.left), T2 = H*pc(p.top), SW = W*pc(p.w), SH = H*pc(p.h);
    slab.style.left = L.toFixed(2)+'px';  slab.style.top = T2.toFixed(2)+'px';
    slab.style.width = SW.toFixed(2)+'px'; slab.style.height = SH.toFixed(2)+'px';
    /* Lớp che lấy mẩu ảnh RỘNG HƠN ô chữ, để mép nhoè rơi trên nền đá trống */
    const veil = slab.querySelector('.veil');
    if(veil){
      /* Dán đá thật (`.sach`) thì nới rộng hẳn vùng che: vẫn là mặt đá y hệt
         nên rộng bao nhiêu cũng không lộ, mà lại phủ trọn cả phần nét khắc
         tràn ra ngoài khung đo (chính là chỗ ZHAO YUN còn hở). Đang nhoè thì
         giữ vùng hẹp — nới ra là vệt mờ to thêm, nhìn tệ hơn. */
      const sach = slab.classList.contains('sach');
      const padX = sach ? VEIL_PAD_X_SACH : VEIL_PAD_X;
      const padY = sach ? VEIL_PAD_Y_SACH : VEIL_PAD_Y;
      const ex = SW * padX, ey = SH * padY;
      veil.style.left = (-ex).toFixed(2)+'px';
      veil.style.top  = (-ey).toFixed(2)+'px';
      cutOut(veil, W, H, L - ex, T2 - ey, SW + 2*ex, SH + 2*ey);
      /* Bán kính nhoè phải theo CỠ Ô CHỮ, không được để số px cố định. Bảng đá
         cao ~11px trên điện thoại nhưng ~20px trên màn hình rộng, mà blur(3.4px)
         thì ở đâu cũng 3.4px — nên máy càng to chữ càng đọc được, đúng kiểu
         "nhìn mắt thường vẫn thấy". Buộc nó vào chiều cao bảng đá thì che kín
         như nhau ở mọi cỡ màn hình. */
      slab.style.setProperty('--veil-blur', (SH * VEIL_BLUR_K).toFixed(2) + 'px');
    }
    /* Độ sáng / độ tươi / độ tương phản của ĐÁP ÁN khi giải xong — mỗi vòng một
       bộ, xem ghi chú ở `.slab.solved .cell` trong CSS. */
    const sg = cfg.solved_glow || {};
    slab.style.setProperty('--sol-f', sg.f || (
      'brightness(' + (sg.b != null ? sg.b : 2.6) + ') ' +
      'saturate('   + (sg.s != null ? sg.s : 1.5) + ') ' +
      'contrast('   + (sg.c != null ? sg.c : 1)   + ')'));
    /* Ranh giới từng ô: ưu tiên dãy `cell_edges` đo bằng dò pixel. Chia đều
       chỉ đúng khi các ký tự cách nhau bằng nhau — chuỗi có DẤU CÁCH thì không,
       chia đều là cắt mất nét của ký tự ngay sau khoảng trắng. */
    const eds = (cfg.cell_edges && cfg.cell_edges.length === n + 1)
      ? cfg.cell_edges : [...Array(n+1)].map((_,k)=> k/n);
    [...row.children].forEach((c,i)=>{
      const x0 = SW*eds[i], cw = SW*(eds[i+1] - eds[i]);
      c.style.width = cw.toFixed(2) + 'px';
      cutOut(c.querySelector('.gl'), W, H, L + x0, T2, cw, SH);
    });
    if(slab.classList.contains('flip')) datFx(row);   /* đo lại quãng trượt */
  });
  (C.round2.eyes || []).forEach((e,i)=>{
    const n = el.eyes[i]; if(!n) return;
    n.style.left   = (W*pc(e.left)).toFixed(2)+'px';
    n.style.top    = (H*pc(e.top)).toFixed(2)+'px';
    const eh = H*pc(e.h);
    n.style.width  = (W*pc(e.w)).toFixed(2)+'px';
    n.style.height = eh.toFixed(2)+'px';
    /* Nhoè theo CHIỀU CAO con ngươi — xem ghi chú ở `.eye .iris` */
    n.style.setProperty('--iris-blur', (eh * IRIS_BLUR_K).toFixed(2)+'px');
  });
}
/* Cuộn thư: vùng chạm nới rộng cho vừa ngón tay, mẩu ảnh giữ đúng cỡ thật */
function fitHotspot(){
  const W = el.world.offsetWidth, H = el.world.offsetHeight;
  if(!W || !H) return;
  const g = C.round2.hotspot;
  const L = W*pc(g.left), T2 = H*pc(g.top), zw = W*pc(g.w), zh = H*pc(g.h);
  const bw = Math.max(zw, g.min_px), bh = Math.max(zh, g.min_px);
  el.hotspot.style.left   = (L + zw/2 - bw/2).toFixed(2)+'px';
  el.hotspot.style.top    = (T2 + zh/2 - bh/2).toFixed(2)+'px';
  el.hotspot.style.width  = bw.toFixed(2)+'px';
  el.hotspot.style.height = bh.toFixed(2)+'px';
  cutOut(el.hotZoom, W, H, L, T2, zw, zh);
  cutOut(el.hotRim,  W, H, L, T2, zw, zh);
  el.tapLabel.style.marginTop = (zh/2 + 4).toFixed(1)+'px';   /* sát ngay dưới cuộn thư */
}
function sizeFx(){
  const r = Math.min(window.devicePixelRatio || 1, 2);
  el.fx.width  = el.root.clientWidth  * r;
  el.fx.height = el.root.clientHeight * r;
  fxCtx.setTransform(r,0,0,r,0,0);
}
/* Chốt hộp robot đúng bằng bề ngang màn hình máy — xem ghi chú ở .ow-layer */
function fitOw(){
  const w = el.screen.offsetWidth;
  if(w) el.owLayer.style.setProperty('--ow-w', w.toFixed(2) + 'px');
}
function layout(){ fitBezel(); fitSlabs(); fitHotspot(); fitOw(); sizeFx(); }

/* ═══ CAMERA ══════════════════════════════════════════════════════════════
   Khung 4:3 hẹp hơn ảnh nền 2.28:1 rất nhiều → dư ngang lớn, vuốt thoải mái.
   Kéo tay thì tắt transition (bám ngón), thả ra thì bật lại một đường ease-out
   dài để camera "trôi" về giữa.                                             */
const CAM = { x:0, max:0, drag:false, sx:0, base:0, moved:false, enabled:true };
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
function camMax(){ return Math.max(0,(el.world.offsetWidth - el.screen.clientWidth)/2); }
function camApply(){ el.world.style.setProperty('--pan', CAM.x.toFixed(2)+'px'); }
function camTo(x, ms, easing){
  el.world.style.transition = ms ? ('transform '+ms+'ms '+(easing||'cubic-bezier(.16,1,.3,1)')) : 'none';
  CAM.x = x; camApply();
}
/* Vào round: đứng ở mép TRÁI, lia hết sang PHẢI rồi mới thu về giữa — cho
   người chơi cảm giác đang tự đảo mắt nhìn quanh phòng một vòng. */
function camIntro(){
  CAM.max = camMax();
  camTo(-CAM.max, 0);
  requestAnimationFrame(()=> requestAnimationFrame(()=>{
    camTo(CAM.max, T.intro_pan, 'cubic-bezier(.37,0,.28,1)');
    setTimeout(()=> camTo(0, T.intro_back, 'cubic-bezier(.33,0,.2,1)'), T.intro_pan + 80);
  }));
}
el.screen.addEventListener('pointerdown', e=>{
  if(!CAM.enabled) return;
  /* Chạm vào lá thư thì KHÔNG bắt đầu kéo camera: setPointerCapture() bên dưới
     kéo pointerup về #screen, làm sự kiện click nhảy lên #screen thay vì lên
     nút hotspot — bấm lá thư sẽ không ăn. */
  if(e.target.closest && e.target.closest('.hotspot')) return;
  CAM.max = camMax();
  if(CAM.max <= 1) return;
  CAM.drag = true; CAM.moved = false;
  CAM.sx = e.clientX; CAM.base = CAM.x;
  el.screen.classList.add('dragging');
  el.world.style.transition = 'none';
  try{ el.screen.setPointerCapture(e.pointerId); }catch(_){}
});
el.screen.addEventListener('pointermove', e=>{
  if(!CAM.drag) return;
  const dx = e.clientX - CAM.sx;
  if(Math.abs(dx) > 6) CAM.moved = true;
  CAM.x = clamp(CAM.base + dx, -CAM.max, CAM.max);
  camApply();
});
function endDrag(){
  if(!CAM.drag) return;
  CAM.drag = false;
  el.screen.classList.remove('dragging');
  camTo(0, T.recenter);
  setTimeout(()=>{ CAM.moved = false; }, 60);
}
['pointerup','pointercancel','pointerleave'].forEach(ev=>
  el.screen.addEventListener(ev, endDrag));

/* ═══ HỘP THOẠI TYPEWRITER ════════════════════════════════════════════════ */
const Q = []; let typing = false, skip = false;
/* "Đời" của hộp thoại. Dọn hộp thoại là tăng số này lên, mọi câu đã hẹn từ đời
   trước tự huỷ. Không có nó thì `sayAll` — vốn nối bằng .then() — vẫn thả nốt
   những câu còn lại vào hộp thoại đã dọn, kiểu như mở Open World mà vẫn thấy
   lời dẫn của vòng 1 chen vào. */
let narrEra = 0;
function clearNarr(){
  narrEra++; Q.length = 0; typing = false; skip = false;
  el.narr.innerHTML = '';
}
/* Trần số nhịp gõ cho MỘT dòng — xem ghi chú trong pump() */
const NHIP_TOI_DA = 340;
function say(text, cls){
  const era = narrEra;
  return new Promise(res=>{ Q.push({text,cls,res,era}); pump(); });
}
function sayAll(v, cls){
  if(Array.isArray(v)){
    const era = narrEra;
    return v.reduce((p,t)=> p.then(()=> narrEra === era ? say(t,cls) : null), Promise.resolve());
  }
  return say(v, cls);
}
function pump(){
  if(typing || !Q.length) return;
  let job = Q.shift();
  while(job && job.era !== narrEra){ job.res(); job = Q.shift(); }
  if(!job) return;
  typing = true; skip = false;
  const p = document.createElement('p');
  p.className = 'line ' + (job.cls || '');
  const span = document.createElement('span');
  const caret = document.createElement('i');
  caret.className = 'caret';
  p.appendChild(span); p.appendChild(caret);
  el.narr.appendChild(p);
  while(el.narr.children.length > 40) el.narr.removeChild(el.narr.firstChild);

  /* ═══ GÕ NHANH DẦN THEO ĐỘ DÀI ═══════════════════════════════════════════
     Mỗi nhịp một ký tự thì lời dẫn ngắn gõ rất có duyên, nhưng câu trả lời dài
     của Open World (nay được phép dài tới 900 ký tự, xem api/chat.js) sẽ ngồi
     gõ hơn 20 giây — người chơi đọc xong từ lâu vẫn phải chờ máy đánh nốt.
     Nay chốt TỔNG SỐ NHỊP tối đa rồi chia đều: câu ngắn vẫn đúng một ký tự
     một nhịp như cũ, câu dài thì mỗi nhịp nhả vài ký tự, và mọi câu đều gõ
     xong trong khoảng NHIP_TOI_DA × type_speed ≈ 8 giây. */
  let i = 0; const txt = job.text;
  const buoc = Math.max(1, Math.ceil(txt.length / NHIP_TOI_DA));
  const step = ()=>{
    if(job.era !== narrEra){ typing = false; job.res(); return; }   /* đã dọn hộp thoại */
    if(skip){ span.textContent = txt; return fin(); }
    i = Math.min(txt.length, i + buoc);
    span.textContent = txt.slice(0, i);
    el.narr.scrollTop = el.narr.scrollHeight;
    if(i >= txt.length) fin(); else setTimeout(step, T.type_speed);
  };
  function fin(){
    caret.remove();
    el.narr.scrollTop = el.narr.scrollHeight;
    typing = false; job.res();
    setTimeout(pump, 90);
  }
  setTimeout(step, 60);
}
el.narr.addEventListener('click', ()=>{ if(typing) skip = true; });

/* ═══ BỆ ĐÁ ═══════════════════════════════════════════════════════════════ */
/* Dựng N ô cắt ảnh + bảng ánh xạ ĐỌC NGƯỢC.
   Câu đố là đọc ngược (REZAR → RAZER), nên ký tự ĐẦU TIÊN người chơi gõ ứng
   với ô ngoài cùng BÊN PHẢI. revMap[k] = chỉ số ô cho ký tự thứ k, duyệt từ
   phải sang trái và bỏ qua ô trống (nên gõ "ZHAOYUN" liền hay "ZHAO YUN" có
   dấu cách đều khớp). */
function buildSlab(rowEl, word){
  rowEl.innerHTML = '';
  [...word].forEach(ch=>{
    const c = document.createElement('i');
    c.className = 'cell' + (ch === ' ' ? ' blank' : '');
    c.appendChild(document.createElement('em')).className = 'gl';   /* mẩu ảnh ký tự */
    c.appendChild(document.createElement('b')).className  = 'dirt'; /* mảng đất phủ */
    rowEl.appendChild(c);
  });
  const map = [];
  for(let i = word.length - 1; i >= 0; i--) if(word[i] !== ' ') map.push(i);
  return map;
}
function placeSlabs(){
  el.slab1.style.setProperty('--slab-c', C.round1.color);
  el.slab2.style.setProperty('--slab-c', C.round2.color);
}

/* ═══ BỚI ĐẤT ═════════════════════════════════════════════════════════════
   Ký tự không bật sáng khan nữa: mảng đất phủ trên ô trượt xuống rồi vỡ ra
   thành bụi, nét khắc lộ dần theo. `keep=true` thì bới xong giữ sáng luôn
   (vòng 2 — lộ tới đâu nhớ tới đó), `keep=false` thì sáng một nhịp rồi chìm
   lại (vòng 1 — chỉ báo gõ trúng).                                          */
function dustBurst(cell){
  for(let k = 0; k < 5; k++){
    const d = document.createElement('u');
    d.className = 'dust';
    d.style.left = (6 + Math.random()*80).toFixed(1) + '%';
    d.style.setProperty('--dx', (Math.random()*8 - 4).toFixed(1) + 'px');
    d.style.setProperty('--dl', (k*45) + 'ms');
    cell.appendChild(d);
    setTimeout(()=> d.remove(), 1000 + k*45);
  }
}
function digReveal(cell, keep){
  if(!cell) return;
  clearTimeout(cell._t);
  cell.classList.remove('digging','hit');
  void cell.offsetWidth;                       /* ép trình duyệt chạy lại animation */
  cell.style.setProperty('--dirt', T.dirt_fall + 'ms');
  cell.classList.add('digging','hit');
  dustBurst(cell);
  cell._t = setTimeout(()=>{
    cell.classList.remove('digging','hit');
    if(keep) cell.classList.add('shown');
  }, T.dirt_fall + 240);
}
/* Vòng 2: bới ra ký tự KẾ TIẾP (phải → trái). Trả về 'one' / 'all' / null. */
function uncoverNext(){
  if(S.mode !== 'progressive' || !S.revMap || !S.slabRow) return null;
  if(S.dug >= S.revMap.length) return null;
  digReveal(S.slabRow.children[S.revMap[S.dug]], true);
  S.dug++; S.burn = false;             /* ô kế tiếp được nạp lại một lượt thử */
  return S.dug >= S.revMap.length ? 'all' : 'one';
}
/* Gõ trúng ký tự → bới đúng ô đó ra (vòng 1: sáng một nhịp rồi tắt). */
function flashLetter(ch, pos){
  if(!S.slabRow || !ch || !S.revMap || pos >= S.revMap.length) return;
  const idx = S.revMap[pos];
  const cell = S.slabRow.children[idx];
  if(cell && S.slabWord[idx] === ch.toUpperCase()) digReveal(cell, false);
}
/* Chuỗi ký tự ĐÃ LỘ, viết theo chiều gõ (phải→trái trên bảng đá) */
function chuoiDaLo(){
  if(!S.revMap) return '';
  return S.revMap.slice(0, S.dug).map(i=> S.slabWord[i]).join('');
}
function missBlink(){
  el.input.classList.remove('miss'); void el.input.offsetWidth;
  el.input.classList.add('miss');
  setTimeout(()=> el.input.classList.remove('miss'), 520);
}
/* Giải đúng: cả cụm sáng lên MỘT LẦN rồi đứng yên.
   Bản trước chạy `cellPop` lệch nhịp từng ký tự (phải→trái) rồi mới trượt chỗ
   — nhìn ra hiệu ứng ăn mừng, không ra ĐÁP ÁN. Đáp án thì phải nằm im mà đọc.
   Nay bỏ hẳn màn nháy: bật `shown` cho nét khắc sáng đều, đợi đúng một nhịp
   ngắn cho mắt kịp bắt, rồi sang phần xếp lại chữ.

   ═══ BẪY ĐÃ VẤP · "TỰ DƯNG THẤY LẠI REZAR" ═══════════════════════════════
   Bản trước hạ lớp che xuống .45 ngay lúc giải đúng, ý là để khoe nét khắc.
   Nhưng lớp che chính là thứ đang giấu CHỮ GỐC (REZAR / NUY OAHZ) khắc sẵn
   trong ảnh nền. Hạ nó xuống là chữ gốc hiện lên mờ mờ ngay bên dưới đáp án
   — đúng cái "tự dưng có một đoạn nhìn thấy REZAR như cũ" đã báo, và nó kéo
   dài suốt từ lúc giải xong tới khi flipSolved() kéo lớp che về đục lại.
   Nay KHÔNG đụng vào lớp che nữa: giữ đục suốt. Ô chữ nằm sau `.veil` trong
   DOM nên vẫn sáng đè lên trên bình thường — chỉ có chữ gốc là không bao giờ
   ló ra. */
function revealSolved(slab, row){
  const cells = [...row.children];
  cells.forEach(c=>{
    clearTimeout(c._t);                       /* huỷ luôn nhịp bới đất đang dở */
    c.classList.remove('hit','digging');
    c.style.animationDelay = '';
    if(!c.classList.contains('blank')) c.classList.add('shown');
  });
  slab.classList.add('solved');
  return T.solved_hold || 420;
}
/* Xếp lại chữ về ĐÚNG CHIỀU ĐỌC, đè hẳn lên bảng cũ.
   Chữ khắc là chuỗi đảo (REZAR / NUY OAHZ) nên đáp án chính là ảnh gương của
   nó: ô thứ i trượt sang chỗ ô n-1-i. Trượt bằng transform nên vẫn là NÉT KHẮC
   THẬT chứ không phải chữ vẽ lại, và giữ nguyên như thế về sau.
   `tuc_thi` = dựng lại cảnh đã giải (chế độ xem lại) thì khỏi chạy hoạt hình. */
/* Quãng trượt của từng ô = KHOẢNG CÁCH THẬT tới chỗ ô đối xứng, đo bằng
   getBoundingClientRect. Nhân theo bề rộng ô chỉ đúng khi mọi ô rộng bằng nhau;
   các ô rộng khác nhau (xem cell_edges) mà nhân đều là chữ chen chúc lên nhau. */
function datFx(row){
  const cells = [...row.children], n = cells.length;
  const xs = cells.map(c=>{
    const t = c.style.transform; c.style.transform = 'none';
    const x = c.getBoundingClientRect().left;
    c.style.transform = t; return x;
  });
  cells.forEach((c,i)=> c.style.setProperty('--fx', (xs[n-1-i] - xs[i]).toFixed(2) + 'px'));
}
function flipSolved(slab, row, tuc_thi){
  const cells = [...row.children], n = cells.length;
  if(!n || slab.classList.contains('flip')) return 0;
  /* Chốt lớp che đục hẳn cho chắc. revealSolved() không còn hạ nó xuống nữa
     nên đây thường là lệnh thừa — giữ lại để ai gọi flipSolved() từ chỗ khác
     (chế độ xem lại) cũng chắc chắn không lộ chữ gốc. Đặt tức thì, không fade:
     fade là hở một quãng cho chữ gốc ló ra. */
  const veil = slab.querySelector('.veil');
  if(veil){ veil.style.transition = 'none'; veil.style.opacity = '1'; }
  /* ═══ NHỊP LỆCH TỪNG Ô — CÓ CHUYỂN ĐỘNG MỚI ĐẸP ═══════════════════════════
     Đã thử cho cả cụm đi cùng lúc: gọn nhưng ĐƠN ĐIỆU, nhìn như ảnh bị nhảy
     một cái chứ không ra "chữ đang tự xếp lại". Trả lại độ lệch giữa các ô
     như bản đầu — mắt bắt được từng ký tự trượt về chỗ của nó, đọc ra là đang
     GIẢI MÃ. Lệch `flip_step` ms một ô, tổng thời lượng cộng thêm phần lệch. */
  const buoc = tuc_thi ? 0 : (T.flip_step != null ? T.flip_step : 45);
  slab.style.setProperty('--flip', (tuc_thi ? 0 : T.flip_ms) + 'ms');
  cells.forEach((c,i)=> c.style.setProperty('--fd', (i * buoc) + 'ms'));
  datFx(row);
  slab.classList.add('flip');
  return tuc_thi ? 0 : T.flip_ms + (n - 1) * buoc;
}

/* ═══ GỢI Ý THEO BẬC + KHOÁ ĐẾM NGƯỢC ═════════════════════════════════════
   Cứ SAI `hint_every_wrongs` lần thì mở thêm một gợi ý, nhưng hai gợi ý phải
   cách nhau `hint_cooldown_ms`. Chưa đủ giờ thì Ô NHẬP BỊ KHOÁ và chạy đồng hồ
   đếm ngược — trong lúc đó người chơi đi vuốt quanh phòng tìm manh mối.
   Số lần sai, mốc giờ và cả hạn khoá đều nhớ trong localStorage nên tải lại
   trang cũng không lách được. */
const HINTS = { 1:{n:0,at:0,w:0,lock:0}, 2:{n:0,at:0,w:0,lock:0} };
(function(){
  const h = Store.get().g2Hint || {};
  if(h.r1) Object.assign(HINTS[1], h.r1);
  if(h.r2) Object.assign(HINTS[2], h.r2);
})();
function saveHints(){ Store.patch({ g2Hint:{ r1:HINTS[1], r2:HINTS[2] } }); }

async function grantHint(round){
  ping('g2_goi_y', 'vòng ' + round);
  const list = (round === 1 ? C.round1 : C.round2).hints || [];
  const st = HINTS[round];
  if(st.n >= list.length) return;
  st.n++; st.at = Date.now(); saveHints();
  await say(C.dialogues.hint_show
    .replace('{N}', st.n)
    .replace('{TEXT}', list[st.n - 1]), 'warn');
  /* Vòng 2 chỉ lộ chữ qua đường GỢI Ý. Đoán trật thì mất lượt chứ không được
     lộ không, nếu không cứ gõ bừa là có đáp án. */
  if(round === 2 && uncoverNext()) resetOnhap(!S.inputLocked);
}

let lockTimer = 0;
function startLock(until, round){
  HINTS[round].lock = until; saveHints();
  clearInterval(lockTimer);
  showCtrl(false); setInput(false);
  el.lockbar.hidden = false;
  const tick = ()=>{
    const left = until - Date.now();
    if(left <= 0){ clearInterval(lockTimer); endLock(round); return; }
    const m = Math.floor(left / 60000), sec = Math.floor(left % 60000 / 1000);
    el.lockTime.textContent = m + ':' + (sec < 10 ? '0' : '') + sec;
  };
  tick();
  lockTimer = setInterval(tick, 1000);
}
async function endLock(round){
  el.lockbar.hidden = true;
  HINTS[round].lock = 0; saveHints();
  await grantHint(round);
  showCtrl(true);
  setInput(true, (round === 1 ? C.round1 : C.round2).placeholder);
  resetOnhap(true);
  S.busy = false;
  await say(C.dialogues.hint_unlock, 'sys');
}
/* Vào round mà hạn khoá còn hiệu lực (vừa tải lại trang) → khoá tiếp */
function resumeLock(round){
  const st = HINTS[round];
  if(st.lock && st.lock > Date.now()){ S.busy = true; startLock(st.lock, round); return true; }
  st.lock = 0;
  return false;
}

/* Trả về true nếu đã chuyển sang trạng thái KHOÁ (fail() khỏi mở lại ô nhập) */
async function serveHint(round){
  const list = (round === 1 ? C.round1 : C.round2).hints || [];
  const st = HINTS[round];
  st.w++; saveHints();
  /* Gợi ý 1 bật ngay lần sai ĐẦU TIÊN; từ gợi ý 2 trở đi cứ thêm 3 lần sai. */
  const need = T.hint_first_wrong + st.n * T.hint_every_wrongs;
  if(st.w < need) return false;
  if(st.n >= list.length){ await say(C.dialogues.hint_done, 'sys'); return false; }
  /* Khoá ĐỦ trọn `hint_cooldown_ms` kể từ lúc khoá, không trừ đi quãng đã trôi
     từ gợi ý trước — trừ đi thì bảng báo "13 phút" trong khi luật ghi 15. */
  if(st.at && Date.now() - st.at < T.hint_cooldown_ms){
    const den = Date.now() + T.hint_cooldown_ms;
    await say(C.dialogues.hint_lock.replace('{M}', Math.round(T.hint_cooldown_ms / 60000)), 'err');
    startLock(den, round);
    return true;
  }
  await grantHint(round);
  return false;
}

function breatheSlab(){
  const s = S.slabEl;
  if(!s || s.classList.contains('solved')) return;
  if(S.mode === 'progressive') return;   /* vòng 2 chôn kín — thở là lộ hết bài */
  s.classList.remove('breathe');
  void s.offsetWidth;
  s.classList.add('breathe');
  setTimeout(()=> s.classList.remove('breathe'), 1350);
}
function armIdle(){
  clearTimeout(S.idleTimer);
  if(S.done || S.inputLocked) return;
  S.idleTimer = setTimeout(breatheSlab, T.idle_hint);
}
/* Nhập sai ở vòng 2: con ngươi chuyển đỏ và bắn ra một chùm tia, hai nhịp rồi
   trả về bình thường. Bỏ class ra rồi ép trình duyệt đọc lại kích thước
   (`offsetWidth`) mới gắn vào — không thì sai liên tiếp hai lần, animation
   đang chạy dở sẽ không khởi động lại từ đầu. */
/* ═══ CHE BỆ ĐÁ TRONG LÚC CHẠY CLIP "GÕ SAI" ══════════════════════════════
   BỆNH ĐÃ SỬA: "khi hiệu ứng làm sai thì bệ đá không che được chữ REZAR —
   rắn rung phát là nhìn rõ chữ luôn".

   Thủ phạm không phải bệ đá mà là CHÍNH CLIP. `anim_wrong.webp` là bản quay
   trên cảnh CŨ, trong đó chữ khắc REZAR còn nguyên và sáng rực — soi cả 121
   khung thì khung nào cũng có chừng 630 điểm ảnh nét vàng ở đúng ô bảng đá.
   Nền vòng 1 nay dùng ảnh đá SẠCH, lớp che đã tắt hẳn (xem `apDungAnh`), nên
   clip vừa bật lên là chữ hiện ra — hệt như kéo tấm màn xuống.

   Cách chữa: bật lại đúng mẩu đá sạch nằm sẵn ở `.veil`.
     · Nó vốn là ảnh `bg_r1_clean` cắt đúng ô bảng đá, không nhoè, không hạ
       sáng — dán lên là khít từng pixel.
     · `.slab` nằm ở z-index 6, trên lớp clip (z-index 5), nên che được.
     · Cảnh trong clip ĐỨNG YÊN tuyệt đối (dò cả 121 khung: lệch 0px), nên
       một mẩu dán tĩnh khớp suốt clip, không trôi.
     · Ký tự người chơi đã bới ra vẫn nổi lên trên, vì `.cells` nằm SAU
       `.veil` trong DOM.
   Chưa có ảnh đá sạch (`.sach` chưa bật) thì KHÔNG đụng: lúc đó nền cũng là
   ảnh cũ có chữ, lớp che nhoè vẫn đang bật và vẫn đang làm việc của nó. */
function chePhachClip(slab, on){
  const veil = slab && slab.querySelector('.veil');
  if(!veil || !slab.classList.contains('sach')) return;
  veil.style.display = on ? '' : 'none';
}
function flashEyes(){
  el.eyes.forEach(e=>{
    e.classList.remove('flash'); void e.offsetWidth; e.classList.add('flash');
  });
  setTimeout(()=> el.eyes.forEach(e=> e.classList.remove('flash')), T.eye_flash);
}
/* ═══ NẠP TÀI NGUYÊN ══════════════════════════════════════════════════════ */
const cache = {};
function load(src){
  if(cache[src]) return cache[src];
  cache[src] = new Promise(res=>{
    const im = new Image();
    im.onload = ()=> res(true);
    im.onerror= ()=> res(false);
    im.src = src;
  });
  return cache[src];
}
/* ═══ TẤM "ĐÁ SẠCH" CHO LỚP CHE ═══════════════════════════════════════════
   Xem ghi chú dài ở `assets.bg_r1_clean` trong config.js. Tóm tắt: nếu có bản
   ảnh đã xoá sẵn chữ khắc thì lớp che lấy thẳng mẩu đá THẬT ở đó dán lên —
   khít từng pixel, khỏi nhoè, khỏi lệch tông, clip nổ chạy cũng không lộ.
   Không có file thì trả về null và mọi thứ chạy y như cũ (nhoè + hạ sáng).

   Dò MỘT LẦN rồi nhớ kết quả: `null` = chưa dò, `false` = dò rồi, không có. */
const daSach = { r1:null, r2:null };
async function urlDaSach(vong){
  const key = vong === 2 ? 'r2' : 'r1';
  if(daSach[key] !== null) return daSach[key] || null;
  const ten = C.assets[vong === 2 ? 'bg_r2_clean' : 'bg_r1_clean'];
  if(!ten){ daSach[key] = false; return null; }
  const src = C.assets_base + ten;
  daSach[key] = (await load(src)) ? src : false;
  if(!daSach[key]) console.log('[GATE2] chưa có ảnh đá sạch ' + ten + ' — dùng cách nhoè cũ');
  return daSach[key] || null;
}

/* ═══ CLIP NỔ — BẢN SẠCH TRƯỚC, BẢN CŨ SAU ════════════════════════════════
   `anim_unlock_clean.webp` là đúng clip nổ sập lab đó nhưng đã xoá sẵn hai
   bảng tên khắc trên bệ đá. Có nó thì chuyển cảnh chạy TRẦN: không lớp che,
   không khói, không hạ sáng — vì trong clip chẳng còn chữ nào để mà giấu.
   Không tải được thì lùi về clip cũ và bật lại lớp khói y như đời trước.
   Dò MỘT LẦN rồi nhớ: `sach` = true/false sau khi dò xong.                 */
const clipNo = { src:null, sach:false };
async function urlClipNo(){
  if(clipNo.src) return clipNo.src;
  const ten = C.assets.anim_unlock_clean;
  if(ten){
    const src = C.assets_base + ten;
    if(await load(src)){ clipNo.src = src; clipNo.sach = true; return src; }
    console.log('[GATE2] chưa có clip sạch ' + ten + ' — lùi về clip cũ, bật lại khói');
  }
  clipNo.src = A('anim_unlock'); clipNo.sach = false;
  await load(clipNo.src);
  return clipNo.src;
}
/* ═══ DÙNG ĐÁ SẠCH LÀM NỀN LUÔN, KHÔNG PHẢI DÁN MIẾNG VÁ ══════════════════
   Bản đầu chỉ thay mỗi LỚP CHE bằng mẩu đá sạch, tức vẫn là dán một miếng vá
   lên trên ảnh CÓ chữ. Miếng vá thì kiểu gì cũng có mép, và mép đó lại tán
   mờ nên rìa vẫn hé ra ảnh có chữ nằm dưới — đúng cái "đè manual nhìn xấu".

   Nay làm thẳng: có ảnh sạch thì lấy CHÍNH ẢNH SẠCH LÀM NỀN. Dưới lớp nền
   không còn chữ nào để mà giấu, nên chẳng cần vá, chẳng cần nhoè, mép có tán
   mờ cũng vô hại — vì trên dưới là cùng một mặt đá.
   Chữ vẫn hiện được bình thường: từng ô `.gl` cắt từ ảnh CÓ chữ, giải đúng thì
   ô đó sáng lên đè lên nền sạch. Lớp che vẫn giữ (cũng cắt từ ảnh sạch) vì
   clip nổ có vẽ sẵn NUY OAHZ trong đó — cần một mảng đá sạch phủ lên clip.

   `nen`  = danh sách lớp ảnh nền cần đổi (nền chính, lớp rồng, cuộn thư...).
   Thiếu file sạch thì mọi thứ chạy y như cũ. */
async function apDungAnh(slab, vong, urlCoChu, nen){
  const veil = slab && slab.querySelector('.veil');
  /* Đặt bản CÓ CHỮ + bộ lọc nhoè NGAY, để trong lúc còn đang dò file sạch
     không có khung hình nào hở chữ ra. */
  if(veil){
    veil.style.display = '';
    veil.style.backgroundImage = urlCoChu;
    slab.style.setProperty('--veil-f', (vong === 2 ? C.round2 : C.round1).veil_filter);
  }
  const sach = await urlDaSach(vong);
  if(!sach) return;                       /* không có → giữ nguyên cách nhoè */

  const urlSach = 'url("' + sach + '")';
  (nen || []).forEach(n=>{ if(n) n.style.backgroundImage = urlSach; });
  if(veil){
    /* ═══ CÓ ĐÁ SẠCH THÌ TẮT HẲN LỚP CHE ══════════════════════════════════
       Nền vừa đổi sang chính tấm đá sạch ở dòng trên — dưới lớp nền không còn
       nét khắc nào để mà giấu. Giữ lớp che lại thì nó thành một mảng đá dán
       lên một mảng đá y hệt: không giấu thêm được gì, mà mặt nạ tán mềm của
       nó vẫn để lại một vệt chuyển tông mờ mờ quanh bệ đá — đúng cái "bệ đá
       nhìn không tự nhiên".
       Lý do duy nhất còn giữ nó tới đời trước là clip nổ có VẼ SẴN NUY OAHZ
       nên cần một mảng đá phủ lên clip. Nay clip cũng đã có bản sạch
       (`anim_unlock_clean`), nên lý do đó cũng hết. Tắt hẳn.
       Còn `veil_filter`, `--veil-blur` và cả nhánh nhoè cũ thì GIỮ NGUYÊN cho
       đường lùi: thiếu file đá sạch là hàm này đã `return` từ trên rồi. */
    veil.style.display = 'none';
    veil.style.backgroundImage = urlSach;
    slab.style.setProperty('--veil-f', 'none');
    /* `.sach` để fitSlabs() nới rộng vùng che. Dán đá thật thì rộng bao nhiêu
       cũng vô hại, nên nới hẳn cho phủ trọn cả nét khắc tràn ngoài khung đo —
       xử luôn chuyện "ZHAO YUN che chưa hết chiều cao". */
    slab.classList.add('sach');
  }
  layout();                               /* đo lại vùng che theo cỡ mới */
}
/* Clip webp lặp vô hạn → mỗi lần phát tạo <img> MỚI (cùng URL nên lấy từ cache
   trình duyệt, không tải lại) để animation chạy lại từ đầu, xong thì gỡ ra. */
/* `khiChay` được gọi ĐÚNG lúc thẻ ảnh vừa vào DOM, tức lúc clip thật sự bắt
   đầu chạy. Cần cái mốc đó vì mọi nhịp che đều tính theo % độ dài clip: đo từ
   trước khi `load()` xong là lệch mất một quãng, mà quãng đó dài ngắn tuỳ máy. */
/* Đặt thẻ clip đúng vào phần thế giới mà nó quay — xem ghi chú ở .anim-layer.
   Bề ngang = tỷ lệ clip ÷ tỷ lệ thế giới, căn giữa ngang, cao trọn khung.
   Chưa đo được (ảnh chưa giải mã xong) thì để nguyên mặc định phủ trọn. */
function khungClip(im){
  const r  = im.naturalWidth / im.naturalHeight;
  const wr = C.frame.world_ratio;
  if(!r || !isFinite(r) || !wr) return;
  const w = Math.min(1, r / wr);
  im.style.width = (w * 100).toFixed(3) + '%';
  im.style.left  = ((1 - w) / 2 * 100).toFixed(3) + '%';
}
async function playClip(src, ms, khiChay){
  /* Hỏng file / mất mạng giữa chừng thì ĐỪNG bật lớp clip lên: lớp đó nền đen
     kịt, bật lên mà không có ảnh là người chơi ngồi nhìn một khung đen suốt
     mấy giây rồi cảnh tự nhảy — tưởng trang chết. Thà bỏ qua clip, cắt thẳng
     sang cảnh sau, vẫn chơi tiếp được. */
  if(!(await load(src))){
    if(khiChay) khiChay();
    await wait(Math.min(ms, 600));
    return;
  }
  el.animLayer.innerHTML = '';
  const im = new Image();
  im.onload = ()=> khungClip(im);
  im.src = src;
  el.animLayer.appendChild(im);
  khungClip(im);                 /* file đã nằm sẵn trong cache thì đo được ngay */
  el.animLayer.classList.add('on');
  if(khiChay) khiChay();
  await wait(ms);
  el.animLayer.classList.remove('on');
  el.animLayer.innerHTML = '';
}

/* ═══ Ô NHẬP ══════════════════════════════════════════════════════════════ */
function setInput(on, placeholder){
  S.inputLocked = !on;
  el.input.disabled = !on;
  el.unlock.disabled = !on;
  if(placeholder) el.input.placeholder = placeholder;
  if(on) armIdle(); else clearTimeout(S.idleTimer);
}
function showCtrl(on){ el.ctrl.hidden = !on; }

el.input.addEventListener('input', ()=>{
  if(owOn) return;                               /* Open World: chữ thường, có dấu */
  const up = el.input.value.toUpperCase();
  if(up !== el.input.value){
    const p = el.input.selectionStart;
    el.input.value = up;
    try{ el.input.setSelectionRange(p,p); }catch(_){}
  }

  /* ═══ VÒNG 2 · ĐOÁN TỪNG KÝ TỰ MỘT ═══════════════════════════════════════
     Phần đã lộ bị KHOÁ CỨNG ở đầu ô nhập, người chơi chỉ được thêm đúng MỘT
     ký tự nữa. Gõ xong ký tự đó là nộp luôn, không sửa lại được:
       trúng → rớt đất, ký tự sáng vĩnh viễn, ô nhập nới thêm một chỗ
       trật → tính là một lần đoán sai
     Nhờ vậy không còn đường gõ A→Z cho từng ô để dò ra đáp án. */
  if(S.mode === 'progressive'){
    const pre = chuoiDaLo();
    let v = el.input.value.replace(/\s+/g,'');
    if(!v.startsWith(pre)) v = pre;              /* đụng vào phần đã lộ → trả lại */
    if(v.length > pre.length + 1) v = v.slice(0, pre.length + 1);
    if(v !== el.input.value) el.input.value = v;
    S.lastNoSp = v.length; S.lastLen = v.length;
    armIdle();
    if(v.length === pre.length + 1) doanKyTu(v[v.length - 1]);
    return;
  }

  const t = el.input.value.replace(/\s+/g,'');
  if(t.length > S.lastNoSp) flashLetter(t[t.length-1], t.length-1);  /* CHỈ khi thêm ký tự */
  S.lastNoSp = t.length;
  S.lastLen = el.input.value.length;
  armIdle();
});

/* Chấm một ký tự vừa gõ (cả hai vòng — vòng 1 nay cũng chơi kiểu mò từng ký tự) */
async function doanKyTu(ch){
  if(S.busy || S.inputLocked) return;
  const idx = S.revMap[S.dug];
  if(S.slabWord[idx] === ch){
    digReveal(S.slabRow.children[idx], true);
    S.dug++;
    el.input.value = chuoiDaLo();
    S.lastNoSp = S.lastLen = el.input.value.length;
    /* Lộ đủ chữ = giải xong. Trước đây gọi thẳng win2() vì chỉ vòng 2 mới chơi
       kiểu này; nay vòng 1 cũng vậy nên phải rẽ theo đúng vòng đang chơi. */
    if(S.dug >= S.revMap.length){ if(S.round === 1) win1(); else win2(); }
    return;
  }
  missBlink();
  el.input.value = chuoiDaLo();                  /* trả về đúng phần đã lộ */
  S.lastNoSp = S.lastLen = el.input.value.length;
  await fail(true);
}
el.input.addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); submit(); }});
el.unlock.addEventListener('click', submit);
el.input.addEventListener('focus', ()=>{
  setTimeout(()=>{ try{ el.input.scrollIntoView({block:'center',behavior:'smooth'}); }catch(_){} }, 320);
});

const norm = s => (s||'').toUpperCase().replace(/\s+/g,'').trim();
function submit(){
  if(owOn) return owGui();          /* xét TRƯỚC: xem lại luôn để S.busy = true */
  if(S.busy || S.inputLocked) return;
  if(S.mode === 'progressive') return;   /* vòng 2 chấm ngay theo từng phím */
  const v = el.input.value.trim();
  if(!v) return;
  const cfg = S.round === 1 ? C.round1 : C.round2;
  if(cfg.accept.some(a=> norm(a) === norm(v))) (S.round === 1 ? win1() : win2());
  else fail();
}

/* Trả ô nhập về đúng phần chữ đã lộ (vòng 2), hoặc dọn sạch (vòng 1).
   `trao_phim` = trao luôn con trỏ cho người chơi: đặt ở CUỐI chuỗi (không nhảy
   về đầu, dễ gõ chèn nhầm vào giữa) và focus sẵn để gõ được ngay, khỏi phải
   chạm vào ô một cái nữa.

   ⚠ LUẬT: MỌI chỗ gọi `setInput(true)` đều phải gọi kèm `resetOnhap(true)`.
   Đã vấp: bốn chỗ mở lại ô nhập mà quên trao con trỏ — vào vòng 1, vào vòng 2
   (ngay sau khi giải xong vòng 1), vào khu Open World, và trả lời xong một câu
   Open World. Ô sáng lên nhìn như đã sẵn sàng nhưng con trỏ vẫn nằm ở body,
   gõ không ăn, phải bấm tay thêm một cái nữa. Đúng cái đã báo: "khi sai xong /
   khi bấm đúng thì trỏ chuột và khung trả lời không tự về lại".
   `fail()` và `endLock()` vốn đã làm đúng — bốn chỗ kia nay theo cho đủ. */
function resetOnhap(trao_phim){
  /* ⚠ KHU OPEN WORLD THÌ DỌN SẠCH, ĐỪNG TRẢ VỀ CHUỖI ĐÃ LỘ.
     BỆNH ĐÃ SỬA: "box open world cứ bị reset về chữ ZHAOYUN bất kể hỏi bao
     nhiêu câu". `S.mode` vẫn còn là 'progressive' của vòng 2 sau khi phá đảo,
     nên mỗi lần hàm này chạy là nó nhét lại đáp án vòng 2 vào ô hỏi. Mà đợt 15
     vừa gắn `resetOnhap(true)` vào đúng hai chỗ của Open World — vào khu, và
     trả lời xong một câu — nên hỏi câu nào cũng dính. */
  el.input.value = (!owOn && S.mode === 'progressive') ? chuoiDaLo() : '';
  S.lastLen = S.lastNoSp = el.input.value.length;
  if(!trao_phim) return;
  const n = el.input.value.length;
  try{ el.input.focus({ preventScroll:true }); }catch(_){ el.input.focus(); }
  try{ el.input.setSelectionRange(n, n); }catch(_){}
}
/* ═══ TRẬT MỘT KÝ TỰ — VÀ LUẬT NỚI TAY ════════════════════════════════════
   `le` = vừa đoán trật MỘT ký tự (kiểu chấm theo phím), nhẹ hơn nhập sai cả cụm.

   VÌ SAO CẦN NỚI TAY: từ nay CẢ HAI vòng đều chấm ngay từng phím, gõ xong là
   nộp, không rút lại được. Nghiêm hơn hẳn kiểu cũ của vòng 1 (gõ thoải mái,
   bấm UNLOCK mới chấm — mà không bấm thì không bao giờ bị tính sai). Nghiêm
   quá thì bảng chữ 26 chữ cái, mới mò một tí đã hết lượt.
   Nên có `sai_moi_lan`: trật bấy nhiêu lần mới cộng MỘT vào bộ đếm sai thật
   (bộ đếm điều khiển gợi ý và hạn khoá). Vòng 1 để 3, vòng 2 để 1.

   Mấy lần trật CHƯA tới ngưỡng chỉ bị nhắc nhẹ: nháy ô nhập, một dòng chữ,
   mở lại ô ngay. Không chạy clip, không tiêu gợi ý, không khoá — nếu không
   thì "nới tay" chỉ là nới trên giấy, chơi vẫn nặng y như cũ. */
async function fail(le){
  S.busy = true;
  setInput(false);
  resetOnhap();

  const cfg = S.round === 1 ? C.round1 : C.round2;
  const cho = Math.max(1, cfg.sai_moi_lan || 1);
  S.trat[S.round] = (S.trat[S.round] || 0) + 1;
  const con = cho - (S.trat[S.round] % cho);      /* còn mấy lần nữa thì bị tính */
  const chinh_thuc = (S.trat[S.round] % cho) === 0;

  /* ── Chưa tới ngưỡng: nhắc một câu rồi trả ô nhập lại ngay ────────────── */
  if(!chinh_thuc){
    el.narr.classList.remove('shake'); void el.narr.offsetWidth;
    el.narr.classList.add('shake');
    if(S.round === 2) flashEyes();
    const mau = (S.round === 1 ? C.dialogues.round1_le_wrong : C.dialogues.round2_le_wrong) || '';
    await say(mau.replace('{N}', con), 'err');
    setInput(true);
    resetOnhap(true);
    S.busy = false;
    return;
  }

  /* ── Tính là một lần sai chính thức ───────────────────────────────────── */
  S.wrongs[S.round]++;
  ping('g2_sai', 'vòng ' + S.round + ' · lần ' + S.wrongs[S.round]);
  if(cho > 1 && C.dialogues.le_het_luot) await say(C.dialogues.le_het_luot, 'warn');

  if(S.round === 1){
    /* Che bệ đá TRƯỚC khi clip vào DOM, gỡ SAU khi clip tắt — xem ghi chú dài
       ở `chePhachClip`. Clip chạy song song với dòng thoại nên bám vào lời hứa
       của chính nó, đừng hẹn giờ riêng kẻo lệch. */
    chePhachClip(el.slab1, true);
    playClip(A('anim_wrong'), T.anim_wrong)
      .then(()=> chePhachClip(el.slab1, false));
    await say(le ? C.dialogues.round1_wrong : C.dialogues.round1_wrong, 'err');
  }else{
    el.narr.classList.remove('shake'); void el.narr.offsetWidth;
    el.narr.classList.add('shake');
    flashEyes();
    await say(le ? C.dialogues.round2_le_wrong : C.dialogues.round2_wrong, 'err');
  }
  const locked = await serveHint(S.round);
  if(S.wrongs[S.round] >= T.idle_wrongs) breatheSlab();
  if(locked) return;                    /* đang đếm ngược — không mở lại ô nhập */

  await wait(T.lock_after_bad);
  setInput(true);
  resetOnhap(true);            /* focus phải đặt SAU khi bỏ disabled */
  S.busy = false;
  await say(C.dialogues.unlocked_input, 'sys');
}

/* ═══ VÒNG 1 ══════════════════════════════════════════════════════════════ */
async function startRound1(){
  ping('g2_vong_1', '', true);
  S.round = 1; S.busy = true;
  S.lastLen = 0; S.lastNoSp = 0; el.input.value = '';
  S.slabWord = C.round1.scrambled; S.slabRow = el.row1; S.slabEl = el.slab1;
  el.root.classList.remove('r2');
  el.hudRound.textContent = 'ROUND 01/02';
  el.hud.classList.remove('ok');
  el.hudText.textContent = C.ui.hud_locked;

  const url1 = 'url("'+A('bg_r1')+'")';
  el.bg.style.backgroundImage = url1;
  el.slab1.style.setProperty('--veil-f', C.round1.veil_filter);
  S.mode = C.round1.reveal_mode; S.dug = 0; S.burn = false;
  /* Chấm theo từng phím thì nút UNLOCK không còn việc gì — giấu đi, y như
     vòng 2. Để lại thì người chơi cứ bấm rồi tưởng máy không nhận. */
  el.ctrl.classList.toggle('nobtn', S.mode === 'progressive');
  S.revMap = buildSlab(el.row1, C.round1.scrambled);
  /* Ô CHỮ luôn lấy ảnh CÓ chữ (đó là thứ sẽ sáng lên khi giải đúng); còn NỀN
     và lớp che thì ưu tiên tấm đá sạch — xem apDungAnh(). */
  el.slab1.querySelectorAll('.gl').forEach(c=> c.style.backgroundImage = url1);
  apDungAnh(el.slab1, 1, url1, [el.bg]);
  el.slab1.classList.add('vis');
  layout();
  camIntro();

  await sayAll(C.dialogues.boot, 'sys');
  await sayAll(C.dialogues.round1_intro);
  urlClipNo(); load(A('bg_r2'));
  if(resumeLock(1)) return;             /* hạn khoá cũ còn hiệu lực */
  showCtrl(true); setInput(true, C.round1.placeholder);
  resetOnhap(true);        /* trao luôn con trỏ — xem ghi chú ở resetOnhap */
  S.busy = false;
}

async function win1(){
  ping('g2_giai_xong_1', 'sai ' + S.wrongs[1] + ' lần');
  S.busy = true;
  clearTimeout(S.idleTimer);
  setInput(false); showCtrl(false);
  CAM.enabled = false; camTo(0, 500);
  el.hud.classList.add('ok');
  el.hudText.textContent = C.ui.hud_unlocked;

  await say(C.dialogues.round1_correct);

  el.slab1.classList.remove('breathe');
  await wait(revealSolved(el.slab1, el.row1));
  await wait(flipSolved(el.slab1, el.row1));     /* xếp REZAR → RAZER tại chỗ */
  await wait(T.glow_hold);
  await urlClipNo();          /* chốt xong dùng clip sạch hay clip cũ */
  say(C.dialogues.round1_boom, 'warn');

  /* ═══ RAZER TẮT TRƯỚC KHI CHỚP NỔ TRONG CLIP LOÉ LÊN ═════════════════════
     Đáp án vẫn nằm nguyên trên bệ đá một quãng đầu clip cho người chơi ngắm —
     và từ đời này khung đầu clip khớp bg_r1 từng pixel (xem `khungClip()`)
     nên chữ nằm đúng trên bệ, không lệch một ly. Nhưng phải TẮT HẲN trước mốc
     chớp nổ, vì từ đó cả khung vừa nổ vừa trượt trong khi lớp đè đứng im, đọc
     ra thành "chữ bay lên trời". Số đo nằm ở `slab1_out_at` trong config.js;
     ĐỔI CLIP thì phải đo lại chỗ đó.

     ═══ BẪY ĐÃ VẤP · HẸN GIỜ TỪ ĐÂY THÌ LUÔN TRỄ ═══════════════════════════
     Bản đầu đặt `setTimeout` ngay tại chỗ này. Hỏng: từ đây tới lúc clip THẬT
     SỰ chạy còn `prepRound2()`, còn dò clip sạch, còn giải mã khung webp 14MB
     — main thread bận thì timer bắn trễ, mà clip lại chạy theo đồng hồ riêng
     của nó. Đo trên máy thật: tính ra phải tắt ở 38,8% nhưng thực tế chữ còn
     thấy tới 46% — tức là đã lấn sang quãng cảnh trượt, vẫn bay như cũ.

     Nay bám ĐỒNG HỒ THẬT bằng rAF, mốc 0 lấy ĐÚNG lúc thẻ ảnh clip vào DOM
     (`khiChay` của playClip). Vòng rAF đo lại mỗi khung nên trễ bao nhiêu cũng
     tự bắt kịp — y hệt cách lớp khói vẫn làm ở đường lùi bên dưới. */
  const fadeMs = T.slab1_fade_ms || 380;
  const choMs  = T.anim_unlock * (T.slab1_out_at || 0.22);
  el.slab1.style.setProperty('--razer-fade', fadeMs + 'ms');
  el.slab1.style.setProperty('--razer-cho',  choMs.toFixed(0) + 'ms');
  let daTat = false;
  /* Gắn class là xong — nhịp chờ và nhịp mờ do CSS lo (xem `.slab.tat`).
     Dọn `.vis` sau khi mờ hẳn; hẹn giờ này trễ vài trăm ms cũng vô hại vì
     lúc đó chữ đã trong suốt rồi. */
  const tatRazer = ()=>{
    if(daTat) return;
    daTat = true;
    el.slab1.classList.add('tat');
    setTimeout(()=>{
      el.slab1.classList.remove('vis','tat');
      el.slab1.style.removeProperty('--razer-fade');
      el.slab1.style.removeProperty('--razer-cho');
    }, choMs + fadeMs + 120);
  };

  /* ═══ CHUYỂN CẢNH CHẠY TRẦN ═══════════════════════════════════════════════
     Cảnh vòng 2 dựng sẵn NGAY sau lưng clip (khung cuối clip trùng khít bg_r2,
     lệch 0px cả hai chiều) nên lúc clip tắt là cắt thẳng sang cảnh tĩnh, không
     chớp một nhịp nào. Nền cũng đã đổi sẵn từ trước.

     KHÔNG CÒN LỚP ĐẮP NÀO NỮA. Năm đời trước đều phải đắp một thứ gì đó lên
     khung chuyển cảnh — miếng đá dán, vệt mờ bầu dục, dải đáy mất nét, ba bờ
     khói — chỉ để giấu mấy chữ VẼ SẴN TRONG chính clip. Nay clip đã là bản
     sạch: không còn chữ thì không còn việc gì phải giấu, nên chuyển cảnh chạy
     trần đúng như clip gốc, mắt không phải giải thích cho một vùng mờ hay một
     mảng khói vô cớ nào.
     Chỉ khi clip sạch không tải được mới lùi về clip cũ — lúc đó (và chỉ lúc
     đó) lớp khói `.khoi` mới bật lên, theo đúng nhịp đo cũ trong config. */
  prepRound2();
  const clip   = await urlClipNo();
  const chuaSach = !clipNo.sach;
  const veil2  = el.slab2.querySelector('.veil');

  /* Lớp che đá chỉ còn nghĩa lý ở ĐƯỜNG LÙI: clip cũ có vẽ sẵn NUY OAHZ nên
     ra khỏi clip phải có một mảng đá sạch dán lên. Dùng clip sạch thì nền đã
     là ảnh đá sạch rồi, `apDungAnh()` đã tắt hẳn lớp này. */
  if(veil2 && chuaSach){ veil2.style.transition = 'none'; veil2.style.opacity = '0'; }

  let batMo = null;
  if(chuaSach){
    /* ── ĐƯỜNG LÙI · vẫn thả khói theo nhịp đo trên 241 khung clip cũ ──────
       Bật từ mốc 26% — quãng đó cả khung còn trắng xoá vì khói THẬT, nên khói
       giả nở ra ngay trong lòng khói thật rồi ở lại, không ai bắt được khoảnh
       khắc nó xuất hiện. `chu_lo_at` (đo được 40,8%) là chốt chặn: máy lag quá
       mà tới mốc đó vẫn chưa bật thì bật tức thì, không nhoà dần nữa.
       Bám ĐỒNG HỒ THẬT bằng rAF thay vì một setTimeout duy nhất: main thread
       bận thì timer bắn trễ, còn clip webp vẫn chạy theo giờ của nó. */
    const VAO_AT  = T.che_vao_at != null ? T.che_vao_at : 0.26;
    const bat_dau = T.anim_unlock * VAO_AT;
    const kin_luc = T.anim_unlock * (T.chu_lo_at || 0.40);
    let t0 = 0, daMo = false;
    const mo = tuc_thi =>{
      if(daMo) return;
      daMo = true;
      if(el.khoi) el.khoi.style.transition = tuc_thi ? 'none' : '';
      el.world.classList.add('khoi-on');
    };
    const canhMo = ()=>{
      if(daMo) return;
      const qua = performance.now() - t0;
      if(qua >= kin_luc){ mo(true);  return; }   /* trễ mất rồi → mờ ngay */
      if(qua >= bat_dau){ mo(false); return; }
      requestAnimationFrame(canhMo);
    };
    /* Chạy ĐÚNG lúc clip bắt đầu, không phải lúc gọi hàm: mọi mốc đều là %
       độ dài clip nên lệch mốc gốc bao nhiêu là lệch hết bấy nhiêu. */
    batMo = ()=>{ t0 = performance.now(); canhMo(); };
  }

  await playClip(clip, T.anim_unlock, ()=>{
    /* Mốc 0 của MỌI nhịp tính theo % clip — lấy đúng lúc clip vào DOM. */
    tatRazer();          /* bấm nút chạy CSS ngay lúc clip vào DOM */
    if(batMo) batMo();
  });
  tatRazer();          /* clip tắt rồi mà còn sót thì dọn nốt, không để treo */

  if(chuaSach){
    /* Clip tắt = cắt thẳng sang cảnh tĩnh. Đổi vai đúng khoảnh khắc này: lớp
       che đá đục 100% (khớp từng pixel với nền), khói tắt hẳn. */
    if(veil2){ veil2.style.transition = 'none'; veil2.style.opacity = '1'; }
    if(el.khoi) el.khoi.style.transition = '';
    el.world.classList.remove('khoi-on');
  }
  await startRound2();
}

/* Dựng toàn bộ phần NHÌN THẤY của vòng 2 (nền, rồng, bảng đá, cuộn thư) mà
   chưa đụng gì tới trạng thái chơi. Gọi được từ trong lúc clip đang chạy. */
function prepRound2(){
  const url2 = 'url("'+A('bg_r2')+'")';
  el.bg.style.opacity = '1';
  el.bg.style.backgroundImage = url2;
  el.dragon.style.backgroundImage = url2;
  el.hotZoom.style.backgroundImage = url2; el.hotRim.style.backgroundImage = url2;
  el.slab2.style.setProperty('--veil-f', C.round2.veil_filter);
  S.revMap2 = buildSlab(el.row2, C.round2.scrambled);
  el.slab2.querySelectorAll('.gl').forEach(c=> c.style.backgroundImage = url2);
  apDungAnh(el.slab2, 2, url2, [el.bg, el.dragon, el.hotZoom, el.hotRim]);
  el.slab2.classList.add('vis');
  el.eyes.forEach(e=> e.classList.add('on'));
  el.dragon.classList.add('on');
  el.aura.classList.add('on');
  el.root.classList.add('r2');
  layout();
}

/* ═══ VÒNG 2 ══════════════════════════════════════════════════════════════ */
async function startRound2(){
  ping('g2_vong_2', '', true);
  S.round = 2; S.busy = true;
  S.slabWord = C.round2.scrambled; S.slabRow = el.row2; S.slabEl = el.slab2;
  /* Phải xoá cả `lastNoSp`: vòng 1 vừa gõ 5 ký tự, không reset thì mấy phím đầu
     của vòng 2 bị coi là "đang xoá bớt" nên không tính lượt nào cả. */
  S.lastLen = 0; S.lastNoSp = 0; el.input.value = '';
  el.root.classList.add('r2');
  el.hudRound.textContent = 'ROUND 02/02';
  el.hud.classList.remove('ok');
  el.hudText.textContent = C.ui.hud_locked;

  /* Cảnh đã được prepRound2() dựng sẵn sau lưng clip (xem win1). Vào thẳng từ
     chỗ khác — chơi lại, hoặc còn hạn khoá — thì dựng ở đây. */
  await load(A('bg_r2'));
  if(!el.slab2.classList.contains('vis')) prepRound2();
  S.mode = C.round2.reveal_mode; S.dug = 0; S.burn = false;
  S.revMap = S.revMap2 || buildSlab(el.row2, C.round2.scrambled);
  el.ctrl.classList.toggle('nobtn', S.mode === 'progressive');

  CAM.enabled = true;
  camIntro();

  await sayAll(C.dialogues.round2_intro, 'cy');
  await sayAll(C.dialogues.round2_hint);
  if(resumeLock(2)) return;
  showCtrl(true); setInput(true, C.round2.placeholder);
  resetOnhap(true);        /* trao luôn con trỏ — xem ghi chú ở resetOnhap */

async function win2(){
  ping('g2_giai_xong_2', 'sai ' + S.wrongs[2] + ' lần');
  S.busy = true;
  clearTimeout(S.idleTimer);
  setInput(false); showCtrl(false);

el.hotspot.addEventListener('click', e=>{
