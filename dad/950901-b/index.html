<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DAD-950901-B · Easter Egg Gate 2</title>
<meta name="theme-color" content="#040b18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--void:#040b18;--navy:#0B1B3A;--neon:#38BDF8;--amber:#F2B441;
  --paper:#EAF0F7;--line:rgba(234,240,247,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--void);color:var(--paper);
  font-family:"Be Vietnam Pro",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 0%,#10243f 0%,var(--void) 68%)}
.frame{position:relative;width:100%;max-width:460px;height:100%;max-height:940px;
  background:var(--navy);overflow:hidden;display:flex;align-items:center;
  justify-content:center;padding:30px;box-shadow:0 30px 90px rgba(0,0,0,.6)}
@media(min-width:480px){.frame{border-radius:26px;height:92vh;border:1px solid rgba(255,255,255,.06)}}
.corner{position:absolute;width:22px;height:22px;border-color:var(--line);opacity:.85}
.corner.tr{top:14px;right:14px;border-top:2px solid;border-right:2px solid}
.corner.bl{bottom:14px;left:14px;border-bottom:2px solid;border-left:2px solid}
.corner.br{bottom:14px;right:14px;border-bottom:2px solid;border-right:2px solid}
.mid{text-align:center;max-width:320px}
.lk{width:34px;height:40px;color:var(--amber);opacity:.9}
.eyebrow{font-family:"Oswald";font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;
  color:var(--neon);margin:20px 0 0}
h1{font-family:"Oswald";font-weight:700;text-transform:uppercase;font-size:30px;
  margin:12px 0 0;line-height:1.05}
p{font-size:14px;line-height:1.55;color:rgba(219,230,243,.7);margin:14px 0 0}
#backHome{position:absolute;top:13px;left:13px;display:inline-flex;align-items:center;gap:8px;
  padding:8px 14px;border-radius:999px;border:1px solid var(--line);
  background:rgba(6,16,31,.55);backdrop-filter:blur(4px);font-family:"Oswald";font-size:10px;
  font-weight:500;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(234,240,247,.85);text-decoration:none}
#backHome b{color:var(--amber);font-weight:600;font-size:12px;line-height:1}
/* Mã mở bộ câu hỏi HAN-961030-A — phần thưởng của việc qua được Gate 2. */
.ma-wrap{margin:26px 0 0;padding:16px 14px 15px;border:1px solid var(--line);
  border-radius:14px;background:rgba(56,189,248,.06)}
.ma-lab{font-family:"Oswald";font-size:8.5px;font-weight:600;letter-spacing:.26em;
  text-transform:uppercase;color:var(--neon);margin:0}
.ma-o{display:flex;justify-content:center;gap:6px;margin:11px 0 0}
.ma-o i{width:27px;height:34px;display:flex;align-items:center;justify-content:center;
  border-radius:7px;font-family:"Oswald";font-size:16px;font-weight:600;font-style:normal;
  color:#0B1B3A;background:linear-gradient(150deg,#F2D08A,var(--amber));
  box-shadow:0 8px 18px rgba(242,180,65,.28)}
.ma-note{font-size:12px;line-height:1.55;color:rgba(219,230,243,.62);margin:11px 0 0}
/* ── Tem phiên bản (design system): góc phải dưới, chữ nhỏ Oswald, mờ, KHÔNG
      bắt sự kiện chuột nên không bao giờ che mất thứ gì bấm được. ── */
.vstamp{position:fixed;right:10px;bottom:8px;z-index:60;pointer-events:none;
  font-family:"Oswald",system-ui,sans-serif;font-size:8px;font-weight:500;
  letter-spacing:.22em;text-transform:uppercase;text-align:right;line-height:1.5;
  color:rgba(234,240,247,.32)}

</style>
</head>
<body>
<div id="app"><div class="frame">
  <a id="backHome" href="/"><b>&larr;</b> Bản đồ</a>
  <span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
  <div class="mid">
    <svg class="lk" viewBox="0 0 12 14" aria-hidden="true">
      <path d="M3.3 6.2V4.3a2.7 2.7 0 0 1 5.4 0v1.9" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <rect x="1.3" y="6" width="9.4" height="7.2" rx="1.5" fill="currentColor"/>
    </svg>
    <p class="eyebrow">DAD-950901-B · Easter Egg</p>
    <h1>Easter Egg<br>Gate 2</h1>
    <p id="loi">Niêm phong đã mở nhưng nội dung chưa được nạp lên khoang. Quay lại bản đồ và thử lại sau nhé.</p>
    <div class="ma-wrap">
      <p class="ma-lab">Mã vào Zoey’s Castle</p>
      <div class="ma-o" id="maO"></div>
      <p class="ma-note">Gõ mã này ở cửa <b>HAN-961030-A · Who’s my kindred spirit?</b>
        trên toạ độ Hà Nội.</p>
    </div>
  </div>
  <span class="vstamp">V1.01<br>Last updated 16-Aug-2026</span>
</div></div>
<script>
/* Mã mở bộ câu hỏi bên HAN — dựng từ một chỗ duy nhất, sửa ở đây thì nhớ sửa
   luôn hằng PIN_A bên han/961030-a. */
(function(){
  var MA = 'TYRION', h = '';
  for(var i = 0; i < MA.length; i++) h += '<i>' + MA[i] + '</i>';
  document.getElementById('maO').innerHTML = h;
})();
/* Mò ra Easter Egg TRƯỚC 01-09 thì cửa này mở sớm thật, nhưng bên trong chưa
   có gì — nói thẳng ngày lên sóng để người chơi khỏi tưởng mình làm sai bước.
   Mốc dựng bằng chuỗi ISO có múi +07:00 nên máy ở múi giờ nào cũng chốt đúng
   nửa đêm Việt Nam; ngày hiển thị cắt thẳng từ chuỗi, không qua getDate(). */
(function(){
  var y = new Date().getFullYear();
  var ISO = y + '-09-01T00:00:00+07:00';
  if(Date.now() >= new Date(ISO).getTime()) return;
  var d = ISO.slice(0,10).split('-');
  document.getElementById('loi').innerHTML =
    'Anh mở được cửa này <b>sớm hơn lịch</b> — Gate 2 đã thông, nhưng bên trong '+
    'thì chưa có gì để xem đâu.<br>Nội dung lên sóng <b>00:00 ngày ' +
    d[2] + '-' + d[1] + '</b>. Hẹn anh đúng hôm đó nhé.';
})();
</script>
</body>
</html>
