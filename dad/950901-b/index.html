/* ═══ MODAL · SLIDESHOW + THƯ ═════════════════════════════════════════════ */
let slideIdx = 0, slideTimer = 0, letterToken = 0;

/* Chưa có file ảnh thì tự vẽ ảnh pixel thay thế bằng canvas */
function pixelPlaceholder(i){
  const W = 160, H = 120;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  const sky = g.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#141d33'); sky.addColorStop(1,'#2a1a3c');
  g.fillStyle = sky; g.fillRect(0,0,W,H);
  g.fillStyle = '#8fb7ff';
  for(let k=0;k<26;k++) g.fillRect((k*37+i*13)%W|0, (k*23+i*7)%(H*0.6)|0, 2, 2);
  g.fillStyle = '#1d2b45';
  for(let x=0;x<W;x+=4){
    const h = 26 + Math.round(14*Math.sin((x+i*20)/22) + 8*Math.sin(x/7));
    g.fillRect(x, H-34-h, 4, h+34);
  }
  ['0110110','1111111','1111111','0111110','0011100','0001000'].forEach((row,r)=>
    [...row].forEach((c,q)=>{
      if(c === '1'){ g.fillStyle = '#ff5b8a'; g.fillRect(W/2-21+q*6, 34+r*6, 6, 6); }
    }));
  g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, H-20, W, 20);
  g.fillStyle = '#00ff66'; g.font = '9px monospace'; g.textAlign = 'center';
  g.fillText((C.photo_captions[i] || ('MEMORY 0'+(i+1))) + ' · N/A', W/2, H-7);
  return cv.toDataURL('image/png');
}
function buildSlides(){
  el.show.innerHTML = ''; el.dots.innerHTML = '';
  C.photos.forEach((p,i)=>{
    const im = document.createElement('img');
    im.alt = C.photo_captions[i] || ('Ảnh kỷ niệm ' + (i+1));
    im.onerror = function(){ this.onerror = null; this.src = pixelPlaceholder(i); };
    im.src = C.photos_base + p;
    if(i === 0) im.classList.add('on');
    el.show.appendChild(im);
    const d = document.createElement('i');
    if(i === 0) d.classList.add('on');
    el.dots.appendChild(d);
  });
}
function goSlide(n){
  const imgs = el.show.children, dots = el.dots.children;
  if(!imgs.length) return;
  slideIdx = (n + imgs.length) % imgs.length;
  [...imgs].forEach((im,i)=> im.classList.toggle('on', i === slideIdx));
  [...dots].forEach((d,i)=> d.classList.toggle('on', i === slideIdx));
}
function autoSlide(){
  clearInterval(slideTimer);
  slideTimer = setInterval(()=> goSlide(slideIdx+1), T.slide_auto);
}
el.prev.addEventListener('click', ()=>{ goSlide(slideIdx-1); autoSlide(); });
el.next.addEventListener('click', ()=>{ goSlide(slideIdx+1); autoSlide(); });

/* Tách thư làm hai phần: thân thư và đoạn `p.s.` — đoạn p.s. in nghiêng. */
function xeThu(){
  const txt = C.letter_content;
  const k = txt.search(/\n[ \t]*p\.?\s?s[.:]/i);
  return k < 0 ? [txt, ''] : [txt.slice(0, k), txt.slice(k)];
}
/* ═══ THƯ CHỈ GÕ TỪNG CHỮ ĐÚNG LẦN ĐẦU ═══════════════════════════════════
   Lần đầu mở thư, gõ từng chữ là đúng: nó kéo dài cái khoảnh khắc, và người
   đọc chưa biết bên trong viết gì nên chờ cũng là một phần của việc đọc.
   Từ lần thứ hai trở đi thì ngược hẳn: đã biết nội dung rồi, ngồi nhìn máy gõ
   lại từ đầu chỉ là chờ suông — muốn đọc lại một đoạn ở giữa còn phải đợi máy
   gõ tới chỗ đó. Nên lần sau bày sẵn cả bức, cuộn tới đâu đọc tới đó.
   Nhớ bằng cờ `g2Thu` trong localStorage nên tải lại trang vẫn nhớ; vào từ chế
   độ xem lại (`galleryOn`) thì khỏi hỏi, chắc chắn là đọc lại rồi. */
function thuDaDoc(){ return !!Store.get().g2Thu; }
function ghiThuDaDoc(){ if(!thuDaDoc()) Store.patch({ g2Thu:true }); }

/* Bày trọn bức thư, không gõ. Dùng cho lần đọc lại và cho cú chạm bỏ qua. */
function thuDayDu(){
  letterToken++;
  const [than, ps] = xeThu();
  el.letterBox.innerHTML = '';
  const a = document.createElement('span'), b = document.createElement('i');
  a.textContent = than; b.textContent = ps;
  el.letterBox.append(a, b);
  el.letterBox.scrollTop = 0;      /* đọc lại thì bắt đầu từ ĐẦU thư */
  el.finish.disabled = false;
}
function typeLetter(){
  if(galleryOn || thuDaDoc()){ thuDayDu(); return; }
  const my = ++letterToken;
  const [than, ps] = xeThu();
  el.letterBox.innerHTML = '';
  const a = document.createElement('span'), b = document.createElement('i');
  el.letterBox.append(a, b);
  el.finish.disabled = true;
  let i = 0, j = 0;
  (function step(){
    if(my !== letterToken) return;
    if(i < than.length)      a.textContent = than.slice(0, ++i);
    else if(j < ps.length)   b.textContent = ps.slice(0, ++j);
    else { el.finish.disabled = false; ghiThuDaDoc(); return; }
    el.letterBox.scrollTop = el.letterBox.scrollHeight;
    setTimeout(step, T.letter_speed);
  })();
}
el.letterBox.addEventListener('click', ()=>{
  /* Chạm giữa chừng = "khỏi gõ nữa". Cũng tính là đã đọc: người ta chủ động
     bỏ qua thì lần sau càng không muốn ngồi xem gõ lại. */
  if(el.finish.disabled){ thuDayDu(); ghiThuDaDoc(); }
});
function openModal(){
  ping('g2_mo_thu', galleryOn ? 'xem lại' : 'lần chơi thật');
  el.hotspot.classList.remove('on');
  el.mClose.classList.toggle('on', galleryOn);   /* chỉ chế độ xem lại mới cho đóng nhanh */
  el.modal.classList.add('on');
  buildSlides(); goSlide(0); autoSlide(); typeLetter();
}
function closeModal(){
  el.modal.classList.remove('on');
  clearInterval(slideTimer);
  letterToken++;
  if(galleryOn) el.hotspot.classList.add('on');
}
el.mClose.addEventListener('click', closeModal);
el.finish.addEventListener('click', async ()=>{
  if(el.finish.disabled) return;
  closeModal();
  if(galleryOn) return;                     /* xem lại → về thẳng cảnh */
  ping('g2_pha_dao', '', true);
  S.done = true;
  /* Ghi CẢ HAI tên: `g2Game` là tên riêng của trang này, `g2Done` là tên mà
     BẢN ĐỒ đọc để biết đã xong Gate 2 (hộp chào Honghandangiu bật lên từ đây).
     Thiếu `g2Done` thì phá đảo xong quay ra bản đồ vẫn im ru như chưa có gì. */
  Store.patch({g2Game:true, g2Done:true});
  confetti();
  await sayAll(C.dialogues.finale, 'cy');
  /* Nán lại cho xem hết màn pháo hoa rồi mới đổi cảnh — khung `#fx` nằm trong
     màn chơi, đổi cảnh là nó biến mất giữa chừng. Xem `phao_nan` ở config. */
  await wait(T.phao_nan || 1400);
  Code.open();                         /* → sang màn phát mã TYRION */
});

/* ═══ PHÁO HOA PIXEL ══════════════════════════════════════════════════════ */
function confetti(){
  const COLORS = ['#00ff66','#ffaa00','#00f2ff','#ff5b8a','#ffffff','#b79bf2'];
  const W = el.root.clientWidth, H = el.root.clientHeight, parts = [];
  const push = (x,y,n,speed)=>{
    for(let k=0;k<n;k++){
      const a = Math.random()*Math.PI*2, v = speed*(0.35+Math.random()*0.85);
      parts.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v-1.4,
        s:3+Math.round(Math.random()*3), c:COLORS[(Math.random()*COLORS.length)|0],
        life:1, decay:0.0045+Math.random()*0.006});
    }
  };
  for(let k=0;k<130;k++) parts.push({
    x:Math.random()*W, y:-Math.random()*H*0.6,
    vx:(Math.random()-0.5)*1.1, vy:1.4+Math.random()*2.4,
    s:3+Math.round(Math.random()*3), c:COLORS[(Math.random()*COLORS.length)|0],
    life:1, decay:0.0024});

  el.fx.classList.add('on');
  const soDot = T.phao_dot || 6, nhip = T.phao_nhip || 620;
  let bursts = 0;
  const bt = setInterval(()=>{
    push(W*(0.18+Math.random()*0.64), H*(0.18+Math.random()*0.38), 46, 4.2);
    if(++bursts >= soDot) clearInterval(bt);
  }, nhip);
  push(W*0.5, H*0.34, 60, 4.6);

  const t0 = performance.now();
  (function frame(now){
    fxCtx.clearRect(0,0,W,H);
    let live = 0;
    for(const p of parts){
      p.vy += 0.055; p.x += p.vx; p.y += p.vy; p.vx *= 0.995; p.life -= p.decay;
      if(p.life <= 0 || p.y > H+20) continue;
      live++;
      fxCtx.globalAlpha = Math.max(0, Math.min(1, p.life));
      fxCtx.fillStyle = p.c;
      fxCtx.fillRect(p.x|0, p.y|0, p.s, p.s);      /* ô vuông = pixel */
    }
    fxCtx.globalAlpha = 1;
    if(live > 0 && now - t0 < (T.phao_tran || 12000)) requestAnimationFrame(frame);
    else { clearInterval(bt); fxCtx.clearRect(0,0,W,H); el.fx.classList.remove('on'); }
  })(performance.now());
}

/* ═══ CHẾ ĐỘ XEM LẠI ══════════════════════════════════════════════════════
   Phá đảo xong vẫn muốn ngắm lại hai bối cảnh mà không phải giải lại từ đầu.
   Dựng đúng cảnh của vòng được chọn ở trạng thái ĐÃ GIẢI: chữ sáng hết, rồng
   đã được tiếp sức, cuộn thư chạm được để đọc lại. Ô nhập tắt hẳn.           */
let galleryOn = false;

function galleryPaint(r){
  const cfg  = r === 1 ? C.round1 : C.round2;
  const url  = 'url("' + A(r === 1 ? 'bg_r1' : 'bg_r2') + '")';
  const slab = r === 1 ? el.slab1 : el.slab2;
  const row  = r === 1 ? el.row1  : el.row2;

  el.bg.style.backgroundImage = url;
  el.root.classList.toggle('r2', r === 2);
  el.hudRound.textContent = r === 1 ? 'ROUND 01/02' : 'ROUND 02/02';

  el.slab1.className = 'slab'; el.slab2.className = 'slab';
  el.row1.innerHTML = ''; el.row2.innerHTML = '';
  slab.style.setProperty('--veil-f', cfg.veil_filter);
  S.slabWord = cfg.scrambled; S.slabRow = row; S.slabEl = slab;
  S.revMap = buildSlab(row, cfg.scrambled);
  S.mode = cfg.reveal_mode; S.dug = S.revMap.length; S.burn = false;
  slab.querySelectorAll('.gl').forEach(c=> c.style.backgroundImage = url);
  slab.classList.add('vis');

  if(r === 2){
    el.dragon.style.backgroundImage = url;
    el.hotZoom.style.backgroundImage = url; el.hotRim.style.backgroundImage = url;
  }
  /* Đổi nền sang đá sạch SAU khi đã đặt xong các lớp trên, nếu không mấy dòng
     `= url` ngay bên trên sẽ ghi đè lại thành ảnh có chữ. */
  apDungAnh(slab, r, url,
    r === 2 ? [el.bg, el.dragon, el.hotZoom, el.hotRim] : [el.bg]);
  el.dragon.className = 'dragon-layer' + (r === 2 ? ' on empowered' : '');
  el.aura.className   = 'aura'         + (r === 2 ? ' on empowered' : '');
  el.eyes.forEach(e=> e.classList.toggle('on', r === 2));
  el.hotspot.classList.toggle('on', r === 2);

  layout();
  revealSolved(slab, row);           /* cảnh đã giải → nét khắc sáng hết */
  flipSolved(slab, row, true);       /* và giữ nguyên đáp án đã xếp lại */
  el.gR1.classList.toggle('on', r === 1);
  el.gR2.classList.toggle('on', r === 2);
  CAM.enabled = true;
  camIntro();

  /* Kể lại đúng đoạn dẫn truyện của vòng đó cho hộp thoại khỏi trống trơn */
  clearNarr();
  say(C.ui.gallery_note, 'cy');
  if(r === 1) sayAll(C.dialogues.round1_intro);
  else{ say(C.dialogues.round2_intro, 'cy'); sayAll(C.dialogues.round2_hint); }
}
function enterGallery(r){
  reset();
  galleryOn = true; owOn = false;
  S.done = true; S.busy = true;                 /* khoá hẳn đường gõ mật mã */
  el.boot.classList.add('gone');
  el.boot.style.display = 'none';
  el.hud.classList.add('ok');
  el.hudText.textContent = C.ui.hud_unlocked;
  el.gbar.hidden = false;
  showCtrl(false); setInput(false);
  galleryPaint(r);                              /* tự dựng lại thoại của vòng đó */
}
function leaveGallery(){
  galleryOn = false; owOn = false;
  owMatTat(); CAM.enabled = true; el.hint.style.visibility = '';
  el.gbar.hidden = true; el.owbar.hidden = true;
  el.unlock.textContent = C.ui.unlock_btn;
  el.ctrl.classList.remove('ow');
  el.input.maxLength = 16; el.input.style.textTransform = '';
  showCtrl(false); setInput(false);
}
el.gR1.addEventListener('click', ()=>{ owTat(); galleryPaint(1); });
el.gR2.addEventListener('click', ()=>{ owTat(); galleryPaint(2); });
el.gOw.addEventListener('click', ()=> owBat());
el.gExit.addEventListener('click', ()=>{ leaveGallery(); Code.open(); });

/* ═══ OPEN WORLD · KHU TRÒ CHUYỆN ══════════════════════════════════════════
   Trang KHÔNG giữ khoá API. Nó POST câu hỏi về `/api/chat` — hàm serverless
   của chính website — nơi giữ khoá Gemini trong biến môi trường. Chưa khai
   khoá thì khu này vẫn mở, chỉ trả câu dự phòng. Xem OPEN-WORLD.md.
   Hạn mức mỗi ngày nhớ trong localStorage theo NGÀY GIỜ VIỆT NAM.            */
const OW = C.openworld || {};
let owOn = false, owBan = false, owSu = [];

/* ═══ NÉT MẶT ROBOT ════════════════════════════════════════════════════════
   Bốn clip, mỗi clip một việc rõ ràng — bám theo đúng nhịp của cuộc trò
   chuyện chứ không phát bừa:

     chào  → mở khu này (phát một lần rồi về nghỉ)
     nhìn  → NGHỈ: robot cúi xuống theo dõi người chơi gõ. Đây là nét mặc định
     đăm   → đã gửi câu hỏi, đang chờ trả lời
     gật   → câu trả lời vừa tới (phát một lần rồi về nghỉ)

   Đổi nét bằng cách chồng clip mới lên rồi nhoà dần, clip cũ tan đi sau — đổi
   thẳng `src` là hình giật cụp một cái rất xấu. */
let owMatHienTai = '', owMatHen = 0;

function owMatTat(){
  clearTimeout(owMatHen);
  owMatHienTai = '';
  el.owLayer.classList.remove('on');
  el.owLayer.innerHTML = '';
  el.owLayer.style.backgroundImage = '';    /* gỡ luôn ảnh mồi */
}
/* Đổi nét mặt. `giu_ms` > 0 = phát một lần rồi tự về nét nghỉ. */
async function owMat(ten, giu_ms){
  const ten_file = (OW.mat || {})[ten];
  if(!ten_file || ten === owMatHienTai) return;
  const src = C.assets_base + ten_file;
  /* ẢNH MỒI TRƯỚC, CLIP SAU — xem ghi chú ở `mat_moi` trong config.
     Dán ngay ở đây, TRƯỚC `await load(src)`: cái await đó là chỗ đứng chờ cả
     5 MB, và trước bản này thì suốt quãng chờ khung chỉ là một mảng đen. */
  owMoi();
  if(!(await load(src))) return;            /* thiếu file thì thôi, đừng vẽ gì */
  if(!owOn) return;                          /* đã rời khu này trong lúc nạp   */

  owMatHienTai = ten;
  clearTimeout(owMatHen);
  const cu = [...el.owLayer.children];
  /* Tạo thẻ ảnh MỚI mỗi lần: cùng URL nên lấy từ cache trình duyệt, nhưng
     animation chạy lại từ đầu — đúng ý cho mấy nét phát một lần. */
  const im = new Image(); im.src = src;
  el.owLayer.appendChild(im);
  el.owLayer.classList.add('on');
  requestAnimationFrame(()=> im.classList.add('on'));
  setTimeout(()=> cu.forEach(n=> n.remove()), 420);

  if(giu_ms) owMatHen = setTimeout(()=> owMat('nhin'), giu_ms);
}
function owNapMat(){
  if(OW.mat_moi) load(OW.mat_moi);          /* mồi nhẹ hều, nạp trước tiên */
  Object.values(OW.mat || {}).forEach(f=> f && load(C.assets_base + f));
}
/* Dán ảnh mồi làm nền khung Open World. Gọi bao nhiêu lần cũng được — đặt
   cùng một URL thì trình duyệt không tải lại, và ảnh nằm DƯỚI mấy thẻ clip
   nên clip về tới đâu là che tới đó, không thấy chỗ nối. */
function owMoi(){
  if(!OW.mat_moi) return;
  const u = 'url("' + OW.mat_moi + '")';
  if(el.owLayer.style.backgroundImage !== u){
    el.owLayer.style.backgroundImage = u;
    el.owLayer.style.backgroundSize = 'cover';
    el.owLayer.style.backgroundPosition = 'center';
  }
  el.owLayer.classList.add('on');
}

function homNay(){
  return new Date(Date.now() + 7*36e5).toISOString().slice(0,10);   /* +07:00 */
}
function owLuot(){
  const st = Store.get().g2Ow || {};
  return st.ngay === homNay() ? (st.dem || 0) : 0;
}
function owTru(){
  Store.patch({ g2Ow:{ ngay:homNay(), dem: owLuot() + 1 } });
  owHienLuot();
}
function owConLai(){ return Math.max(0, (OW.moi_ngay || 10) - owLuot()); }
/* Khoá nào khai bằng MẢNG thì mỗi lần bốc ngẫu nhiên một câu */
function owCau(v){
  return Array.isArray(v) ? (v[(Math.random() * v.length) | 0] || '') : (v || '');
}
/* {N} = số câu còn lại · {T} = tổng số câu mỗi ngày */
function owDem(mau){
  return owCau(mau).replace('{N}', owConLai()).replace('{T}', OW.moi_ngay || 10);
}
function owHienLuot(){
  const n = owConLai();
  el.owQuota.textContent = n + '/' + (OW.moi_ngay || 10);
  [...el.owbar.querySelectorAll('.chip')].forEach(c=> c.disabled = n <= 0 || owBan);
  if(n <= 0) setInput(false);
}
/* ═══ KHO CÂU GỢI Ý ════════════════════════════════════════════════════════
   Mỗi lúc chỉ bày ĐÚNG MỘT gợi ý — ba câu một lúc thì mắt phải đọc hết rồi mới
   chọn, mà chọn xong vẫn thấy hai câu thừa nằm đó.
     • `ref`     — câu mẫu ưu tiên, dùng trước và đúng thứ tự.
     • `ref_kho` — hết câu ưu tiên thì bốc ngẫu nhiên, KHÔNG lặp lại cho tới khi
                   vét hết kho (nhớ trong `owDaDung`).
   Đổi câu khi: vừa bấm dùng câu đó, hoặc đã hỏi thêm `ref_doi_sau` câu. */
let owRefI = 0, owDaDung = [], owHoiTuKhiDoi = 0;

function owBocRef(){
  const uu = OW.ref || [], kho = OW.ref_kho || [];
  if(owRefI < uu.length) return uu[owRefI++];
  let con = kho.filter(t=> !owDaDung.includes(t));
  if(!con.length){ owDaDung = []; con = kho.slice(); }
  if(!con.length) return uu[uu.length - 1] || '';
  const t = con[(Math.random() * con.length) | 0];
  owDaDung.push(t);
  return t;
}
function owChips(doi){
  let b = el.owbar.querySelector('.chip');
  if(!b){
    b = document.createElement('button');
    b.className = 'chip'; b.type = 'button';
    b.addEventListener('click', ()=>{
      if(b.disabled) return;
      el.input.value = b.textContent;
      owChips(true);                    /* dùng rồi thì thay câu khác ngay */
      owGui();
    });
    el.owbar.appendChild(b);
    doi = true;
  }
  if(doi){
    owHoiTuKhiDoi = 0;
    b.style.opacity = '0';
    setTimeout(()=>{ b.textContent = owBocRef(); b.style.opacity = ''; }, 160);
  }
}
async function owBat(){
  ping('g2_open_world', '', true);
  if(owOn) return;
  owOn = true;
  /* Bản đồ đọc `g2Open` để biết người chơi đã vào tới khu trò chuyện — vào rồi
     thì hộp chào thôi nhắc câu "xem lại được đó". */
  if(!Store.get().g2Open) Store.patch({g2Open:true});
  owNapMat();
  el.gR1.classList.remove('on'); el.gR2.classList.remove('on');
  el.gOw.classList.add('on');
  el.hudRound.textContent = 'OPEN WORLD';
  /* Clip phủ kín khung thì không còn gì để vuốt — tắt camera, neo về giữa,
     giấu luôn dòng "vuốt để ngắm bối cảnh". Kiểu "nổi" thì cảnh vẫn còn nên
     giữ nguyên camera. */
  const kin = (OW.mat_kieu || 'kin') !== 'noi';
  el.owLayer.classList.toggle('noi', !kin);
  if(OW.mat_cao) el.owLayer.style.setProperty('--ow-cao', OW.mat_cao);
  if(kin){
    CAM.enabled = false; camTo(0, 420);
    el.hint.style.visibility = 'hidden';
  }
  owMat('chao', OW.mat_chao_ms || 3000);
  clearNarr();
  el.owbar.hidden = false;
  owChips(); owHienLuot();  /* owChips tự bốc câu đầu */
  showCtrl(true);
  setInput(owConLai() > 0, OW.placeholder || '...');
  el.unlock.textContent = OW.nut_gui || 'GUI';
  el.ctrl.classList.remove('nobtn');
  el.input.maxLength = OW.max_ky_tu || 300;
  el.input.style.textTransform = 'none';
  el.ctrl.classList.add('ow');
  el.input.setAttribute('autocapitalize','sentences');
  if(owConLai() > 0) resetOnhap(true);   /* trao luôn con trỏ */
  fitOw();
  const doi = narrEra;
  await sayAll((OW.chao || []).map(t=> t.replace('{N}', OW.moi_ngay || 10)), 'cy');
  if(narrEra !== doi) return;            /* đã bấm sang mục khác giữa chừng */
  if(owConLai() <= 0) say(owCau(OW.het_luot), 'warn');
  else say(owDem(OW.con_lai), 'sys');
}
function owTat(){
  if(!owOn) return;
  owOn = false;
  owRefI = 0; owHoiTuKhiDoi = 0;      /* lần sau lại bắt đầu từ câu mẫu */
  owMatTat();
  CAM.enabled = true;
  el.hint.style.visibility = '';
  el.gOw.classList.remove('on');
  el.owbar.hidden = true;
  el.unlock.textContent = C.ui.unlock_btn;
  el.input.maxLength = 16;
  el.input.style.textTransform = '';
  el.ctrl.classList.remove('ow');
  el.input.setAttribute('autocapitalize','characters');
  el.input.value = '';
  showCtrl(false); setInput(false);
}
async function owGui(){
  if(!owOn || owBan) return;
  const q = el.input.value.trim();
  if(!q) return;
  if(owConLai() <= 0){ say(owCau(OW.het_luot), 'warn'); return; }
  owBan = true;
  const doi = narrEra;
  el.input.value = '';
  setInput(false);
  owHienLuot();
  await say('> ' + q, 'me');
  if(narrEra !== doi){ owBan = false; return; }

  owMat('nghi');                          /* gửi xong là robot đăm chiêu */
  const nghiTu = Date.now();
  const cho = document.createElement('p');
  cho.className = 'line wait';
  /* Ba chấm dựng bằng thẻ để CSS cho nảy được — xem `.line.wait` trong CSS.
     `dang_nghi` trong config nếu khai chữ khác "..." thì in chữ đó ra trước,
     rồi vẫn kèm ba chấm động phía sau. */
  const chuCho = (OW.dang_nghi || '...').trim();
  if(chuCho && chuCho !== '...'){
    const t = document.createElement('span');
    t.textContent = chuCho; cho.appendChild(t);
  }
  for(let i = 0; i < 3; i++) cho.appendChild(document.createElement('i'));
  el.narr.appendChild(cho); el.narr.scrollTop = el.narr.scrollHeight;

  let dap = null, loi = null;
  try{
    const r = await fetch(OW.endpoint || '/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      /* Không gửi tính cách lên nữa — giọng nhân vật nằm ở api/_lib/tinhcach.md */
      body: JSON.stringify({ hoi:q, su:owSu.slice(-6) })
    });
    const j = await r.json().catch(()=> ({}));
    if(r.ok && j.dap) dap = String(j.dap).trim();
    else loi = j.loi === 'chua_co_khoa' ? owCau(OW.chua_noi) : owCau(OW.loi_mang);
  }catch(e){ loi = owCau(OW.loi_mang); }
  /* Máy trả lời nhanh quá thì nét "đăm chiêu" chỉ loé một cái rồi mất, nhìn
     như robot không kịp nghĩ. Giữ lại đủ một nhịp cho ra dáng. */
  await wait(Math.max(0, (OW.mat_nghi_min_ms || 800) - (Date.now() - nghiTu)));
  cho.remove();
  if(narrEra !== doi){ owBan = false; return; }   /* đã rời khu trò chuyện */

  if(dap){
    ping('g2_ow_hoi', 'còn ' + (owConLai() - 1) + ' lượt');
    owSu.push({ vai:'user', text:q }, { vai:'npc', text:dap });
    owTru();
    owMat('gat', OW.mat_gat_ms || 1800);   /* gật một cái rồi cúi xuống nghỉ */
    await say('> ' + dap, 'npc');
    /* Hỏi đủ `ref_doi_sau` câu mà vẫn còn ngồi đây thì thay gợi ý mới */
    if(++owHoiTuKhiDoi >= (OW.ref_doi_sau || 2)) owChips(true);
    if(owConLai() > 0) say(owDem(OW.con_lai), 'sys');
    else say(owCau(OW.het_luot), 'warn');
  }else{
    ping('g2_ow_loi', 'không nhận được câu trả lời');
    owMat('nhin');                    /* hỏng thì thôi, về nét nghỉ */
    await say(loi, 'err');            /* hỏng đường truyền thì KHÔNG trừ lượt */
  }
  owBan = false;
  owHienLuot();
  if(owConLai() > 0){ setInput(true, OW.placeholder || '...'); resetOnhap(true); }
}

/* ═══ THOÁT / KHỞI ĐỘNG ═══════════════════════════════════════════════════ */
el.back.addEventListener('click', ()=>{
  leaveGallery();
  show(Store.get().g2Game ? 'code' : 'gate');
});

async function bootUp(){
  if(S.booted) return;
  S.booted = true;
  let fake = 0;
  const fakeTimer = setInterval(()=>{
    fake = Math.min(fake+3, 92);
    el.bar.style.width = fake + '%';
    el.loadTxt.textContent = 'LOADING ' + fake + '%';
  }, 180);

  await load(A('bg_r1'));
  clearInterval(fakeTimer);
  el.bar.style.width = '100%';
  el.loadTxt.textContent = 'LOADING 100%';
  el.bootSub.textContent = C.ui.boot_ready;
  el.startBtn.hidden = false;

  const idle = window.requestIdleCallback || (f=> setTimeout(f,600));
  idle(()=>{ load(A('anim_wrong')); load(A('bg_r2')); });
}
el.startBtn.addEventListener('click', ()=>{
  ping('g2_press_start');
  el.boot.classList.add('gone');
  setTimeout(()=>{ el.boot.style.display = 'none'; }, 520);
  startRound1();
});

/* Dọn sạch để chơi lại từ đầu */
function reset(){
  S.round = 0; S.busy = true; S.wrongs = {1:0,2:0}; S.trat = {1:0,2:0}; S.done = false;
  S.lastLen = 0; S.lastNoSp = 0; S.revMap = null;
  S.mode = 'flash'; S.dug = 0; S.burn = false;
  galleryOn = false; owOn = false; owBan = false; owSu = [];
  owMatTat();
  el.ctrl.classList.remove('ow');
  el.owbar.hidden = true;
  el.hint.style.visibility = '';
  el.unlock.textContent = C.ui.unlock_btn;
  el.input.maxLength = 16; el.input.style.textTransform = '';
  clearTimeout(S.idleTimer); clearInterval(lockTimer);
  el.lockbar.hidden = true; el.gbar.hidden = true;
  clearNarr();
  el.input.value = '';
  showCtrl(false); setInput(false);
  [el.slab1, el.slab2].forEach(sl=>{
    sl.className = 'slab';
    sl.style.removeProperty('--razer-fade');
    sl.style.removeProperty('--razer-cho');
    const v = sl.querySelector('.veil');
    if(v){ v.style.opacity = ''; v.style.transition = ''; v.style.display = ''; }
  });
  S.revMap2 = null;
  el.ctrl.classList.remove('nobtn');
  el.row1.innerHTML = ''; el.row2.innerHTML = '';
  el.eyes.forEach(e=> e.classList.remove('on','flash'));
  el.dragon.className = 'dragon-layer'; el.aura.className = 'aura';
  el.hotspot.classList.remove('on');
  el.root.classList.remove('r2');
  el.hud.classList.remove('ok');
  el.animLayer.classList.remove('on'); el.animLayer.innerHTML = '';
  /* Lớp khói nằm trên `.world`, KHÔNG nằm trong `.slab` như lớp che đời
     trước — nên vòng lặp dọn slab ở trên không đụng tới nó. Phải gỡ riêng ở
     đây, không thì bấm Chơi lại giữa lúc clip đang chạy là khói đọng lại suốt
     ván sau. */
  el.world.classList.remove('khoi-on');
  if(el.khoi) el.khoi.style.transition = '';
  CAM.enabled = true; camTo(0,0);
  el.boot.style.display = ''; el.boot.classList.remove('gone');
  el.startBtn.hidden = true;
  el.bar.style.width = '0%'; el.loadTxt.textContent = 'LOADING 0%';
  el.bootSub.textContent = C.ui.boot_sub;
  S.booted = false;
}

placeSlabs();

return {
  layout,
  /* Nạp ngầm luôn cả hai tấm đá sạch: dò xong sớm thì lúc dựng cảnh đã biết
     dùng ảnh nào, khỏi có nhịp đổi ảnh giữa chừng. */
  /* ═══ NẠP NGẦM · GỌI TỪ MÀN ĐẾM NGƯỢC ═══════════════════════════════════
     Cả bộ tài nguyên nặng 71 MB, trong đó hai clip 23 MB một. Trước đây chỉ
     nạp trước ba tấm nền, còn hai clip thì đợi vào tận trong game mới bắt đầu:
     `anim_wrong` chờ tới lúc rảnh sau màn boot, `anim_unlock` chờ tới giữa
     vòng 1. Mà nay vòng 1 chấm ngay từng phím nên người chơi có thể gõ trật
     trong vòng vài giây — clip 23 MB chưa về kịp thì đứng hình.

     Nay nạp ngay từ MÀN ĐẾM NGƯỢC, lúc người chơi còn đang đọc đồng hồ. Nạp
     TUẦN TỰ theo đúng thứ tự cần dùng chứ không thả cả bảy cái một lúc: thả
     một lúc thì chúng giành băng thông của nhau, tấm nền vòng 1 — thứ cần
     TRƯỚC TIÊN — lại về sau cùng.
     `load()` nhớ theo URL nên gọi lại bao nhiêu lần cũng chỉ tải một lần. */
  async prefetch(){
    const thuTu = [
      ()=> load(A('bg_r1')),        /* cần ngay khi bấm PRESS START      */
      ()=> urlDaSach(1),            /* lớp che vòng 1                     */
      ()=> load(A('anim_wrong')),   /* gõ trật phát đầu là cần tới        */
      ()=> load(A('bg_r2')),        /* dựng sẵn cảnh vòng 2 sau lưng clip */
      ()=> urlDaSach(2),            /* lớp che vòng 2                     */
      ()=> urlClipNo()              /* nặng nhất, nhưng cần muộn nhất     */
    ];
    for(const b of thuTu){ try{ await b(); }catch(e){} }
  },
  start(again){ if(again) reset(); layout(); bootUp(); },
  review(r){ load(A('bg_r2')); enterGallery(r || 1); }
};
})();

gameReady = true;
syncVH();
})();
</script>
