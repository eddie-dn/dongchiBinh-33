<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DAD-950901-B · Easter Egg Gate 2</title>
<meta name="theme-color" content="#040b18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500&family=Press+Start+2P&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   DAD-950901-B · MỘT FILE, MỘT MẠCH, BA MÀN
     ① #scene-gate — đếm ngược tới 00:00 · 01-09
     ② #scene-game — mini-game pixel 2 vòng (RAZER → ZHAO YUN)
     ③ #scene-code — phá đảo, phát mã TYRION, đi Zoey's Castle

   Chữ nghĩa & thông số nằm hết ở config.js, file này chỉ là bộ máy.

   ⚠ CHỐNG VA CHẠM — hai màn vốn là hai trang riêng, gộp vào là đụng nhau ở
   ba chỗ: id `#app`, ba biến `--neon/--amber/--paper` (khác giá trị), và
   selector trần `h1{}` `p{}` bên màn đếm ngược sẽ ăn luôn vào markup game.
   Cách chốt: KHÔNG có biến màu nào đặt ở :root, mỗi màn tự khai trong phạm vi
   của mình; mọi selector đều phải có tiền tố `.gate-look` hoặc `#scene-game`.
   Thêm CSS mới cứ theo đúng luật đó là không bao giờ đụng.
   ═══════════════════════════════════════════════════════════════════════════ */

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:#040b18;overflow:hidden;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased}

.scene{
  display:none;position:fixed;inset:0;
  max-width:520px;margin:0 auto;
  height:100dvh;height:var(--vh,100dvh);
}
.scene.on{display:flex}

/* ═══════════════════════════════════════════════════════════════════════════
   ① + ③ MÀN ĐẾM NGƯỢC & MÀN PHÁT MÃ — dùng chung bộ áo "gate-look"
   ═══════════════════════════════════════════════════════════════════════════ */
.gate-look{
  --void:#040b18;--navy:#0B1B3A;--neon:#38BDF8;--amber:#F2B441;
  --paper:#EAF0F7;--line:rgba(234,240,247,.28);
  color:var(--paper);font-family:"Be Vietnam Pro",system-ui,sans-serif;
  align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 0%,#10243f 0%,var(--void) 68%);
}
.gate-look .frame{
  position:relative;width:100%;height:100%;
  background:var(--navy);overflow:hidden;display:flex;align-items:center;
  justify-content:center;padding:30px;box-shadow:0 30px 90px rgba(0,0,0,.6);
}
@media(min-width:480px){.gate-look .frame{border-radius:26px;height:92dvh;
  border:1px solid rgba(255,255,255,.06)}}
.gate-look .corner{position:absolute;width:22px;height:22px;border-color:var(--line);opacity:.85}
.gate-look .corner.tr{top:14px;right:14px;border-top:2px solid;border-right:2px solid}
.gate-look .corner.bl{bottom:14px;left:14px;border-bottom:2px solid;border-left:2px solid}
.gate-look .corner.br{bottom:14px;right:14px;border-bottom:2px solid;border-right:2px solid}
/* BẪY ĐÃ VẤP: `.mid` là flex-item của `.frame`, mà flex-item được phép RỘNG HƠN
   ô chứa nó. `max-width:320px` trên máy 320px thành ra rộng đúng bằng cả màn,
   tràn qua cả padding 30px của khung — chữ chạy sát mép rồi bị cắt, mà mọi phép
   đo bên trong `.mid` vẫn báo "vừa" vì chỗ tràn nằm ở tầng trên.
   `min(320px,100%)` chốt lại: không bao giờ rộng hơn ô chứa. */
.gate-look .mid{text-align:center;max-width:min(320px,100%)}
.gate-look .lk{width:34px;height:40px;color:var(--amber);opacity:.9}
.gate-look .eyebrow{font-family:"Oswald";font-size:9.5px;letter-spacing:.28em;
  text-transform:uppercase;color:var(--neon);margin:20px 0 0}
.gate-look h1{font-family:"Oswald";font-weight:700;text-transform:uppercase;
  font-size:30px;margin:12px 0 0;line-height:1.08}
/* Mỗi dòng là một khối riêng, KHÔNG cho bẻ chữ.
   ĐO BẰNG scrollWidth, không phải getBoundingClientRect: phần tử `block` luôn
   rộng đúng bằng khung, nên bounding-rect lúc nào cũng "vừa" dù chữ đã tràn ra
   ngoài — hàm co chữ sẽ không bao giờ chịu hạ cỡ. */
.gate-look h1 .d{display:block;white-space:nowrap}
.gate-look h1 .khoa{display:block;white-space:nowrap;font-size:.5em;
  letter-spacing:.24em;color:rgba(234,240,247,.5);margin-top:6px}
.gate-look p{font-size:14px;line-height:1.55;color:rgba(219,230,243,.7);margin:14px 0 0}
.gate-look .backHome{position:absolute;top:13px;left:13px;display:inline-flex;
  align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
  border:1px solid var(--line);background:rgba(6,16,31,.55);backdrop-filter:blur(4px);
  font-family:"Oswald";font-size:10px;font-weight:500;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(234,240,247,.85);text-decoration:none}
.gate-look .backHome b{color:var(--amber);font-weight:600;font-size:12px;line-height:1}
/* Nhấp nháy đúng dải màu Easter Egg của bản đồ. */
@keyframes egg{
  0%{color:#F2B441}   20%{color:#7BE0A8}  40%{color:#63D9E8}
  60%{color:#B79BF2}  80%{color:#F49AC1}  100%{color:#F2B441}}
.gate-look h1.egg{animation:egg 1.8s linear infinite}
.gate-look .ico-key{width:13px;height:18px;flex:none;vertical-align:-3px;margin-right:5px}
.gate-look .ico-key .lap{fill:#F7C6E4;animation:lapLanh 1.7s ease-in-out infinite}
.gate-look .ico-key .lap.l2{animation-delay:.55s;fill:#FBD9EE}
@keyframes lapLanh{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
.gate-look .ma-hang{display:flex;gap:9px;margin:15px 0 0}
.gate-look .ma-hang > *{flex:1}
.gate-look .ico2{font-size:12px;letter-spacing:0;vertical-align:-1px}
.gate-look .ma-wrap{margin:26px 0 0;padding:16px 14px 15px;border:1px solid var(--line);
  border-radius:14px;background:rgba(56,189,248,.06)}
.gate-look .ma-lab{font-family:"Oswald";font-size:8.5px;font-weight:600;
  letter-spacing:.26em;text-transform:uppercase;color:var(--neon);margin:0}
.gate-look .ma-o{display:flex;justify-content:center;gap:6px;margin:11px 0 0}
.gate-look .ma-o i{width:27px;height:34px;display:flex;align-items:center;
  justify-content:center;border-radius:7px;font-family:"Oswald";font-size:16px;
  font-weight:600;font-style:normal;color:#0B1B3A;
  background:linear-gradient(150deg,#F2D08A,var(--amber));
  box-shadow:0 8px 18px rgba(242,180,65,.28)}
.gate-look .ma-go{display:block;margin:14px 0 0;padding:12px 8px;border-radius:999px;
  font-family:"Oswald";font-size:10px;font-weight:600;letter-spacing:.12em;
  white-space:nowrap;text-transform:uppercase;text-align:center;text-decoration:none;
  color:#0B1B3A;background:linear-gradient(135deg,#F2D08A,var(--amber));
  border:0;cursor:pointer;box-shadow:0 10px 22px rgba(242,180,65,.3)}
.gate-look .ma-go:active{transform:translateY(1px)}
.gate-look .ma-go.ghost{background:none;color:rgba(234,240,247,.72);
  border:1px solid var(--line);box-shadow:none}
/* Nút vào mini-game — tông xanh để tách khỏi nút vàng đi Map 3. */
.gate-look .ma-go.game{background:linear-gradient(135deg,#7BE0A8,#63D9E8);
  box-shadow:0 10px 22px rgba(99,217,232,.28)}
.gate-look .dem{margin:14px 0 0;font-family:"Oswald";font-size:11px;font-weight:500;
  letter-spacing:.22em;text-transform:uppercase;color:rgba(219,230,243,.55)}
.gate-look .dem b{font-size:19px;font-weight:600;color:var(--neon);letter-spacing:.04em}
.gate-look .vstamp{position:absolute;right:14px;bottom:14px;pointer-events:none;
  font-family:"Oswald",system-ui,sans-serif;font-size:8px;font-weight:500;
  letter-spacing:.22em;text-transform:uppercase;text-align:right;line-height:1.5;
  color:rgba(234,240,247,.32)}

/* ═══════════════════════════════════════════════════════════════════════════
   ② MÀN MINI-GAME PIXEL
   ═══════════════════════════════════════════════════════════════════════════ */
#scene-game{
  --bg:#0d1117;--bezel:#1f293d;
  --neon:#00ff66;--amber:#ffaa00;--cyan:#00f2ff;--red:#ff3355;
  --paper:#d7e2ee;--muted:rgba(215,226,238,.55);
  --f-pixel:'Press Start 2P','Roboto Mono',ui-monospace,monospace;
  /* Press Start 2P KHÔNG có dấu tiếng Việt → mọi câu tiếng Việt dùng --f-term */
  --f-term:'Roboto Mono',ui-monospace,'Courier New',monospace;
  --pan:0px;
  flex-direction:column;color:var(--paper);font-family:var(--f-term);
  background:radial-gradient(120% 80% at 50% 0%,#131c2a 0%,var(--bg) 70%);
  overflow:hidden;
}

/* Khung pixel dùng lại: 4 góc bị "cắn" một ô vuông màu nền. */
#scene-game .pf{position:relative}
#scene-game .pf::before{
  content:'';position:absolute;inset:-3px;pointer-events:none;z-index:3;
  background-image:linear-gradient(var(--bg),var(--bg)),linear-gradient(var(--bg),var(--bg)),
                   linear-gradient(var(--bg),var(--bg)),linear-gradient(var(--bg),var(--bg));
  background-size:5px 5px;background-repeat:no-repeat;
  background-position:0 0,100% 0,0 100%,100% 100%;
}

/* ── Nửa trên · khung máy ─────────────────────────────────────────────────
   height:auto — chiều cao do đúng nội dung quyết định, KHÔNG chốt cứng %, nên
   không còn khoảng trống chết giữa khung máy và hộp thoại. Trần chiều cao của
   khung do fitBezel() giữ (config frame.max_h).                              */
#scene-game #stage{
  flex:0 0 auto;height:auto;
  /* max(): máy không tai thỏ thì env() = 0, vẫn phải chừa mép trên tử tế */
  padding:max(env(safe-area-inset-top,0px),12px) 10px 0;
  display:flex;flex-direction:column;justify-content:flex-start;gap:6px;
}
#scene-game .hud{
  display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  font-family:var(--f-pixel);font-size:8px;letter-spacing:.06em;
  color:var(--muted);flex:0 0 auto;
}
#scene-game .hud .rnd{color:var(--amber)}
#scene-game .hud .st{display:inline-flex;align-items:center;gap:5px}
#scene-game .hud .dot{width:6px;height:6px;background:var(--red);
  box-shadow:0 0 8px currentColor;color:var(--red)}
#scene-game .hud.ok .dot{background:var(--neon);color:var(--neon)}
#scene-game .hud.ok .st{color:var(--neon)}
#scene-game #back{
  font-family:var(--f-pixel);font-size:7px;letter-spacing:.06em;text-decoration:none;
  color:rgba(215,226,238,.6);background:rgba(6,16,31,.7);
  border:2px solid rgba(31,41,61,.9);padding:5px 7px;flex:0 0 auto;cursor:pointer;
}
#scene-game .slot{flex:0 1 auto;min-height:0;width:100%;display:flex;
  align-items:center;justify-content:center}
#scene-game .bezel{
  /* Bề ngang do fitBezel() chốt bằng px; chiều cao suy ra từ tỷ lệ khung.
     (Không dùng max-height: trình duyệt KHÔNG truyền ràng buộc đó ngược qua
     aspect-ratio khi width đã cố định → khung bị bóp méo lúc bàn phím bật.) */
  width:100%;height:auto;aspect-ratio:var(--frame-ratio,4/3);max-width:100%;
  border:3px solid var(--bezel);background:#05080d;
  box-shadow:0 0 0 1px #0a0f18,0 10px 30px rgba(0,0,0,.6),inset 0 0 40px rgba(0,0,0,.9);
  position:relative;overflow:hidden;margin:auto;
}
#scene-game .screen{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}
#scene-game .screen.dragging{cursor:grabbing}

/* Lớp "thế giới": ảnh nền siêu rộng (2.28:1) cao đúng bằng khung máy → phần dư
   ngang chính là biên độ cho camera lia/vuốt. Khung 4:3 hẹp hơn 16:9 nên phần
   dư này còn rộng hơn nữa, vuốt được nhiều hơn. */
#scene-game .world-wrap{position:absolute;inset:0;display:flex;justify-content:center;
  align-items:center}
#scene-game .world{
  position:relative;height:100%;aspect-ratio:var(--world-ratio,3136/1376);flex:0 0 auto;
  transform:translate3d(var(--pan),0,0);will-change:transform;
}
#scene-game .bg-layer{position:absolute;inset:0;background-size:100% 100%;
  background-position:center;transition:opacity .6s ease}

/* Rồng: bản sao ảnh nền được che quanh vùng đầu rồng rồi cho "thở" bằng
   transform rất nhỏ → rồng như đang uốn lượn mà nền vẫn đứng yên. */
#scene-game .dragon-layer{
  position:absolute;inset:0;background-size:100% 100%;opacity:0;
  -webkit-mask-image:radial-gradient(ellipse 15% 34% at 49.5% 34%,#000 0%,#000 52%,transparent 100%);
  mask-image:radial-gradient(ellipse 15% 34% at 49.5% 34%,#000 0%,#000 52%,transparent 100%);
  animation:dragonFloat 5.2s ease-in-out infinite;transition:opacity .8s ease;
}
@keyframes dragonFloat{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-0.55%) scale(1.007)}
}
#scene-game .dragon-layer.on{opacity:1}
#scene-game .dragon-layer.empowered{animation-duration:2.4s;
  filter:drop-shadow(0 0 10px rgba(0,242,255,.6)) brightness(1.08)}

#scene-game .aura{
  position:absolute;left:49.5%;top:34%;width:42%;height:76%;
  transform:translate(-50%,-50%);
  background:radial-gradient(ellipse at center,var(--aura-c,rgba(190,240,255,.55)) 0%,
             var(--aura-c2,rgba(120,220,255,.22)) 38%,transparent 70%);
  mix-blend-mode:screen;opacity:0;pointer-events:none;
  animation:auraBreath 4.2s ease-in-out infinite;transition:opacity .8s ease;
}
@keyframes auraBreath{
  0%,100%{transform:translate(-50%,-50%) scale(.94);filter:brightness(.85)}
  50%{transform:translate(-50%,-50%) scale(1.06);filter:brightness(1.2)}
}
#scene-game .aura.on{opacity:.85}
#scene-game .aura.empowered{animation-duration:1.6s;opacity:1;width:52%;height:88%}
#scene-game .aura.angry{--aura-c:rgba(255,60,70,.6);--aura-c2:rgba(180,20,30,.3);
  animation-duration:.55s}

/* ── Bệ đá khắc chữ ─────────────────────────────────────────────────────── */
#scene-game .slab{
  position:absolute;left:var(--sx);top:var(--sy);
  transform:translate(-50%,-50%);
  display:none;align-items:center;justify-content:center;
  /* padding theo em, và fitSlabs() đặt font-size ngay trên .slab → cả tấm biển
     co giãn cùng khung máy, không bao giờ thò ra ngoài mép dưới. */
  padding:.34em .6em;white-space:nowrap;pointer-events:none;z-index:2;
  background:linear-gradient(180deg,rgba(6,10,16,.96),rgba(6,10,16,.9));
  border:1px solid rgba(255,255,255,.10);
  box-shadow:0 2px 14px rgba(0,0,0,.65),inset 0 0 18px rgba(0,0,0,.6);
}
#scene-game .slab.vis{display:flex}
#scene-game .slab .row{display:flex;gap:.16em;font-family:var(--f-pixel);line-height:1}
#scene-game .slab .ltr{
  display:inline-block;opacity:.15;color:var(--slab-c);
  transition:opacity .22s ease,text-shadow .22s ease,transform .55s cubic-bezier(.6,-.2,.3,1.4);
}
#scene-game .slab .ltr.sp{width:.6em}
#scene-game .slab .ltr.hit{
  opacity:1;
  text-shadow:0 0 6px var(--slab-c),0 0 16px var(--slab-c),0 0 30px var(--slab-c);
}
#scene-game .slab.breathe .ltr{animation:slabBreath 1.25s ease-in-out 1}
@keyframes slabBreath{
  0%,100%{opacity:.15;text-shadow:none}
  50%{opacity:.72;text-shadow:0 0 8px var(--slab-c),0 0 18px var(--slab-c)}
}
#scene-game .slab.solved{border-color:var(--slab-c);
  box-shadow:0 0 18px color-mix(in srgb,var(--slab-c) 45%,transparent),
             inset 0 0 20px color-mix(in srgb,var(--slab-c) 18%,transparent)}
#scene-game .slab.solved .ltr{
  opacity:1;animation:none;
  text-shadow:0 0 6px var(--slab-c),0 0 14px var(--slab-c),0 0 34px var(--slab-c),0 0 60px var(--slab-c);
}
#scene-game .slab .tick{position:absolute;width:4px;height:4px;background:var(--slab-c);opacity:.45}
#scene-game .slab .tick.a{left:-1px;top:-1px}
#scene-game .slab .tick.b{right:-1px;top:-1px}
#scene-game .slab .tick.c{left:-1px;bottom:-1px}
#scene-game .slab .tick.d{right:-1px;bottom:-1px}
#scene-game .slab.solved .tick{opacity:1;box-shadow:0 0 8px var(--slab-c)}

/* ── Hotspot lá thư ─────────────────────────────────────────────────────── */
#scene-game .hotspot{
  position:absolute;left:var(--hx);top:var(--hy);width:var(--hw);height:var(--hh);
  transform:translate(-50%,-50%);
  display:none;align-items:center;justify-content:center;
  background:none;border:0;padding:0;z-index:4;cursor:pointer;
}
#scene-game .hotspot.on{display:flex}
#scene-game .hotspot .glow{
  position:absolute;inset:-8%;
  background:radial-gradient(ellipse at center,rgba(255,225,140,.75) 0%,
             rgba(255,190,60,.35) 40%,transparent 72%);
  mix-blend-mode:screen;animation:hotPulse 1.15s ease-in-out infinite;
}
#scene-game .hotspot .ring{
  /* vùng chạm to cho ngón tay, còn vòng sáng thu lại ôm đúng cuộn thư */
  position:absolute;inset:20% 8%;border:2px solid rgba(255,214,102,.9);
  box-shadow:0 0 12px rgba(255,200,80,.9),inset 0 0 10px rgba(255,220,140,.6);
  animation:hotRing 1.15s ease-in-out infinite;
}
@keyframes hotPulse{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.1)}}
@keyframes hotRing{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.07)}}
#scene-game .hotspot .tap{
  position:absolute;top:102%;left:50%;transform:translateX(-50%);
  font-family:var(--f-pixel);font-size:8px;letter-spacing:.04em;white-space:nowrap;
  color:#ffe08a;text-shadow:0 0 8px rgba(255,180,40,.9),0 2px 0 #000;
  animation:tapBlink 1.15s steps(1) infinite;
}
@keyframes tapBlink{0%,49%{opacity:1}50%,100%{opacity:.25}}

#scene-game .anim-layer{position:absolute;inset:0;z-index:5;display:none;background:#05080d}
#scene-game .anim-layer.on{display:block}
#scene-game .anim-layer img{width:100%;height:100%;object-fit:cover;display:block}

#scene-game .scan{
  position:absolute;inset:0;z-index:6;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;opacity:.55;
}
#scene-game .glare{
  position:absolute;inset:0;z-index:7;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 8%,rgba(120,200,255,.10),transparent 55%),
             radial-gradient(140% 120% at 50% 50%,transparent 55%,rgba(0,0,0,.62) 100%);
  animation:flick 5.5s steps(2) infinite;
}
@keyframes flick{0%,97%{opacity:1}98%{opacity:.86}100%{opacity:1}}

#scene-game .hint{
  flex:0 0 auto;text-align:center;font-family:var(--f-term);font-size:9px;
  color:rgba(215,226,238,.34);letter-spacing:.04em;margin:0;
}

/* ── Nửa dưới · terminal ────────────────────────────────────────────────── */
#scene-game #term{
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px;
  padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));
}
#scene-game .narr{
  flex:1 1 auto;min-height:60px;overflow-y:auto;overscroll-behavior:contain;
  border:3px solid var(--neon);background:rgba(2,18,9,.62);padding:10px 11px;
  box-shadow:0 0 22px rgba(0,255,102,.16),inset 0 0 26px rgba(0,255,102,.06);
  font-size:12.5px;line-height:1.62;-webkit-overflow-scrolling:touch;
}
#scene-game .narr.shake{animation:shake .42s linear 1}
@keyframes shake{
  0%,100%{transform:translateX(0)}15%{transform:translateX(-6px)}30%{transform:translateX(6px)}
  45%{transform:translateX(-4px)}60%{transform:translateX(4px)}80%{transform:translateX(-2px)}
}
#scene-game .line{margin:0 0 6px;color:var(--neon);
  text-shadow:0 0 8px rgba(0,255,102,.35);word-break:break-word}
#scene-game .line:last-child{margin-bottom:0}
#scene-game .line.err{color:var(--red);text-shadow:0 0 8px rgba(255,51,85,.45)}
#scene-game .line.warn{color:var(--amber);text-shadow:0 0 8px rgba(255,170,0,.4)}
#scene-game .line.cy{color:var(--cyan);text-shadow:0 0 8px rgba(0,242,255,.4)}
#scene-game .line.sys{color:var(--muted);text-shadow:none}
#scene-game .caret{display:inline-block;width:.62em;height:1em;background:currentColor;
  vertical-align:-2px;animation:blink .9s steps(1) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

#scene-game .ctrl{flex:0 0 auto;display:flex;gap:8px;align-items:stretch}
#scene-game .ctrl[hidden]{display:none}
#scene-game #answer{
  flex:1 1 auto;min-width:0;font-family:var(--f-pixel);font-size:12px;
  letter-spacing:.06em;text-transform:uppercase;background:#06111d;color:var(--amber);
  border:3px solid var(--bezel);padding:13px 10px;outline:none;caret-color:var(--amber);
}
#scene-game #answer::placeholder{color:rgba(215,226,238,.26);letter-spacing:.02em;
  font-family:var(--f-term)}
#scene-game #answer:focus{border-color:var(--neon);box-shadow:0 0 14px rgba(0,255,102,.28)}
#scene-game #answer:disabled{opacity:.45}
#scene-game.r2 #answer{color:var(--cyan);caret-color:var(--cyan)}
#scene-game #unlock{
  flex:0 0 auto;font-family:var(--f-pixel);font-size:10px;letter-spacing:.04em;
  padding:0 15px;border:0;cursor:pointer;color:#04140a;
  background:linear-gradient(180deg,#4dff96,#00c94f);
  box-shadow:0 4px 0 #026b2b,0 0 18px rgba(0,255,102,.28);
}
#scene-game #unlock:active{transform:translateY(3px);box-shadow:0 1px 0 #026b2b}
#scene-game #unlock:disabled{filter:grayscale(.7);opacity:.5;box-shadow:0 4px 0 #1c3326}

/* ── Màn nạp dữ liệu ────────────────────────────────────────────────────── */
#scene-game #boot{
  position:absolute;inset:0;z-index:40;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:24px;text-align:center;transition:opacity .5s ease;
}
#scene-game #boot.gone{opacity:0;pointer-events:none}
#scene-game #boot h1{font-family:var(--f-pixel);font-size:13px;line-height:1.8;
  margin:0;color:var(--amber);text-shadow:0 0 14px rgba(255,170,0,.5)}
#scene-game #boot .sub{font-size:12px;color:var(--muted);max-width:300px;
  line-height:1.6;margin:0}
#scene-game .bar{width:190px;height:12px;border:3px solid var(--bezel);padding:2px;
  background:#06111d}
#scene-game .bar i{display:block;height:100%;width:0%;background:var(--neon);
  box-shadow:0 0 10px var(--neon);transition:width .3s ease}
#scene-game #startBtn{
  font-family:var(--f-pixel);font-size:11px;padding:14px 18px;border:0;cursor:pointer;
  color:#04140a;background:linear-gradient(180deg,#4dff96,#00c94f);
  box-shadow:0 5px 0 #026b2b,0 0 22px rgba(0,255,102,.35);
  animation:pressBlink 1.4s steps(1) infinite;
}
#scene-game #startBtn:active{transform:translateY(4px);box-shadow:0 1px 0 #026b2b}
@keyframes pressBlink{0%,60%{opacity:1}61%,100%{opacity:.72}}
#scene-game .loadtxt{font-family:var(--f-pixel);font-size:8px;color:var(--muted)}

/* ── Modal mật thư ──────────────────────────────────────────────────────── */
#scene-game #modal{
  position:absolute;inset:0;z-index:50;display:none;align-items:center;
  justify-content:center;padding:14px;background:rgba(3,7,12,.86);backdrop-filter:blur(3px);
}
#scene-game #modal.on{display:flex;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#scene-game .scroll{
  width:100%;max-width:420px;max-height:calc(var(--vh,100dvh) - 28px);
  display:flex;flex-direction:column;gap:10px;
  background:linear-gradient(180deg,#0a1622,#071019);border:3px solid var(--cyan);
  box-shadow:0 0 30px rgba(0,242,255,.28),inset 0 0 40px rgba(0,242,255,.06);
  padding:12px;overflow-y:auto;overscroll-behavior:contain;
  animation:popIn .38s cubic-bezier(.2,1.3,.4,1);
}
@keyframes popIn{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
#scene-game .mhead{
  font-family:var(--f-term);font-weight:700;font-size:11px;text-align:center;
  color:var(--cyan);letter-spacing:.05em;text-shadow:0 0 12px rgba(0,242,255,.6);
  padding:2px 0 4px;
}
#scene-game .slidebox{position:relative;width:100%;aspect-ratio:4/3;background:#040a12;
  border:2px solid rgba(0,242,255,.35);overflow:hidden;flex:0 0 auto}
#scene-game .slidebox img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transform:scale(1.04);transition:opacity .55s ease,transform 3.4s linear;
  image-rendering:pixelated;
}
#scene-game .slidebox img.on{opacity:1;transform:scale(1)}
#scene-game .navrow{display:flex;align-items:center;justify-content:space-between;
  gap:8px;flex:0 0 auto}
#scene-game .navbtn{
  font-family:var(--f-pixel);font-size:8px;padding:11px 12px;cursor:pointer;
  color:var(--cyan);background:#08151f;border:2px solid rgba(0,242,255,.4);
}
#scene-game .navbtn:active{background:#0e2333}
#scene-game .dots{display:flex;gap:5px;justify-content:center;flex:1 1 auto}
#scene-game .dots i{width:7px;height:7px;background:rgba(0,242,255,.22);display:block}
#scene-game .dots i.on{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
#scene-game .letterbox{
  flex:1 1 auto;min-height:96px;max-height:34dvh;overflow-y:auto;overscroll-behavior:contain;
  border:2px solid rgba(0,242,255,.3);background:rgba(0,20,28,.5);padding:11px 12px;
  font-size:12.5px;line-height:1.72;color:#bfeeff;white-space:pre-wrap;
}
#scene-game #finish{
  flex:0 0 auto;font-family:var(--f-term);font-weight:700;font-size:12px;
  letter-spacing:.04em;padding:14px 10px;border:0;cursor:pointer;color:#04140a;
  background:linear-gradient(180deg,#7df9ff,#00c2d6);
  box-shadow:0 5px 0 #026a75,0 0 22px rgba(0,242,255,.35);
}
#scene-game #finish:active{transform:translateY(4px);box-shadow:0 1px 0 #026a75}
#scene-game #finish[disabled]{filter:grayscale(.6);opacity:.55}

#scene-game #fx{position:absolute;inset:0;z-index:60;pointer-events:none;display:none}
#scene-game #fx.on{display:block}

@media (prefers-reduced-motion:reduce){
  #scene-game .aura,#scene-game .dragon-layer,#scene-game .hotspot .glow,
  #scene-game .hotspot .ring,#scene-game .glare{animation:none}
}
</style>
</head>
<body>

<!-- ═══════════ ① MÀN ĐẾM NGƯỢC ═══════════ -->
<main id="scene-gate" class="scene gate-look on">
  <div class="frame">
    <a class="backHome" href="/"><b>&larr;</b> <span id="gBack">Bản đồ</span></a>
    <span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <div class="mid">
      <svg class="lk" viewBox="0 0 12 14" aria-hidden="true">
        <path d="M3.3 6.2V4.3a2.7 2.7 0 0 1 5.4 0v1.9" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <rect x="1.3" y="6" width="9.4" height="7.2" rx="1.5" fill="currentColor"/>
      </svg>
      <p class="eyebrow" id="gVai">Player: Dongchi Bình</p>
      <h1 id="gTit"><span class="d">Easter Egg: Gate 2</span><span class="khoa">Locked</span></h1>
      <p id="gLoi"></p>
      <div class="dem" id="gDem"></div>
      <button class="ma-go game" id="gPlay" type="button" hidden>▶ Bắt đầu giải mã</button>
    </div>
    <span class="vstamp" id="gStamp"></span>
  </div>
</main>

<!-- ═══════════ ② MÀN MINI-GAME ═══════════ -->
<main id="scene-game" class="scene">
  <section id="stage">
    <div class="hud" id="hud">
      <button id="back" type="button">&lt; THOÁT</button>
      <span class="rnd" id="hudRound">ROUND 01/02</span>
      <span class="st" id="hudState"><i class="dot"></i><span id="hudText">LOCKED</span></span>
    </div>

    <div class="slot">
      <div class="bezel pf">
        <div class="screen" id="screen">
          <div class="world-wrap">
            <div class="world" id="world">
              <div class="bg-layer" id="bgLayer"></div>
              <div class="dragon-layer" id="dragonLayer"></div>
              <div class="aura" id="aura"></div>

              <div class="slab" id="slab1">
                <i class="tick a"></i><i class="tick b"></i><i class="tick c"></i><i class="tick d"></i>
                <div class="row" id="row1"></div>
              </div>

              <div class="slab" id="slab2">
                <i class="tick a"></i><i class="tick b"></i><i class="tick c"></i><i class="tick d"></i>
                <div class="row" id="row2"></div>
              </div>

              <button class="hotspot" id="hotspot" type="button" aria-label="Đọc lá thư">
                <span class="glow"></span><span class="ring"></span>
                <span class="tap" id="tapLabel">[ TAP HERE ]</span>
              </button>
            </div>
          </div>

          <div class="anim-layer" id="animLayer"></div>
          <div class="scan"></div>
          <div class="glare"></div>
        </div>
      </div>
    </div>

    <p class="hint" id="hint"></p>
  </section>

  <section id="term">
    <div class="narr pf" id="narr" role="log" aria-live="polite"></div>
    <div class="ctrl" id="ctrl" hidden>
      <input id="answer" type="text" inputmode="text" autocomplete="off" autocorrect="off"
             autocapitalize="characters" spellcheck="false" maxlength="16"
             enterkeyhint="go" placeholder="NHẬP MÃ...">
      <button id="unlock" type="button">UNLOCK</button>
    </div>
  </section>

  <div id="boot">
    <h1 id="bootTitle"></h1>
    <p class="sub" id="bootSub"></p>
    <div class="bar"><i id="bar"></i></div>
    <p class="loadtxt" id="loadTxt">LOADING 0%</p>
    <button id="startBtn" type="button" hidden></button>
  </div>

  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="mhead">
    <div class="scroll">
      <div class="mhead" id="mhead"></div>
      <div class="slidebox" id="show"></div>
      <div class="navrow">
        <button class="navbtn" id="prev" type="button"></button>
        <span class="dots" id="dots"></span>
        <button class="navbtn" id="next" type="button"></button>
      </div>
      <div class="letterbox" id="letterBox"></div>
      <button id="finish" type="button"></button>
    </div>
  </div>

  <canvas id="fx"></canvas>
</main>

<!-- ═══════════ ③ MÀN PHÁT MÃ ═══════════ -->
<main id="scene-code" class="scene gate-look">
  <div class="frame">
    <a class="backHome" href="/"><b>&larr;</b> <span id="cBack">Bản đồ</span></a>
    <span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <div class="mid">
      <svg class="lk" viewBox="0 0 12 14" aria-hidden="true">
        <path d="M3.3 6.2V4.3a2.7 2.7 0 0 1 5.4 0v1.9" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <rect x="1.3" y="6" width="9.4" height="7.2" rx="1.5" fill="currentColor"/>
      </svg>
      <p class="eyebrow" id="cVai">Winner: Dongchi Bình</p>
      <h1 id="cTit" class="egg"></h1>
      <p id="cLoi"></p>
      <div class="ma-wrap">
        <p class="ma-lab"><svg class="ico-key" viewBox="0 0 16 22" aria-hidden="true"><circle cx="8" cy="6" r="3.7" fill="none" stroke="url(#kg)" stroke-width="1.7"/><path d="M8 9.7V19M8 16.4h3.1M8 13.4h2.2" fill="none" stroke="url(#kg)" stroke-width="1.7" stroke-linecap="round"/><path class="lap" d="M14.2 2.1l.5 1.35 1.35.5-1.35.5-.5 1.35-.5-1.35-1.35-.5 1.35-.5z"/><path class="lap l2" d="M1.9 15.2l.38 1 1 .38-1 .38-.38 1-.38-1-1-.38 1-.38z"/><defs><linearGradient id="kg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2A7D0"/><stop offset="1" stop-color="#D97BB6"/></linearGradient></defs></svg><span id="cMaLab"></span></p>
        <div class="ma-o" id="cMaO"></div>
        <button class="ma-go game" id="cReplay" type="button"></button>
        <div class="ma-hang">
          <button class="ma-go ghost" id="cReset" type="button"></button>
          <a class="ma-go" id="cGo" href="/han/961030-a?from=map"></a>
        </div>
      </div>
    </div>
    <span class="vstamp" id="cStamp"></span>
  </div>
</main>

<script src="config.js"></script>
<script>
/* ════════════════════════════════════════════════════════════════════════════
   BỘ MÁY — chữ nghĩa nằm hết ở config.js
   ════════════════════════════════════════════════════════════════════════════ */
(function(){
'use strict';

const $ = (s,r)=> (r||document).querySelector(s);
const wait = ms => new Promise(r=>setTimeout(r,ms));

/* ── Kho localStorage dùng chung, một chỗ đọc/ghi duy nhất ────────────────── */
const Store = {
  get(){ try{ return JSON.parse(localStorage.getItem('mtv1') || '{}') || {}; }catch(e){ return {}; } },
  patch(o){ try{ const m = Store.get(); Object.assign(m,o);
    localStorage.setItem('mtv1', JSON.stringify(m)); }catch(e){} }
};

/* ═══ VÀO ĐƯỢC ĐÂY = ĐÃ QUA GATE 2 ═══
   BẪY ĐÃ VẤP: cờ `eggWin` trước đây CHỈ được ghi ở ba chỗ bên ngoài. Ai tới
   thẳng trang này thì cờ không có, và Map 3 báo "chưa có chìa khoá vào lâu đài"
   dù vừa mới thắng xong. Nay chính TRANG NÀY ghi cờ. */
if(!Store.get().eggWin) Store.patch({eggWin:true});

/* ── Chuyển màn ──────────────────────────────────────────────────────────── */
const SCENES = { gate:$('#scene-gate'), game:$('#scene-game'), code:$('#scene-code') };
let sceneNow = 'gate';
/* Khối Game khai báo mãi bên dưới. Không thể canh bằng typeof — `typeof` trên
   một const đang trong vùng chết (TDZ) VẪN ném lỗi. Dùng cờ thường. */
let gameReady = false;
function show(name){
  Object.keys(SCENES).forEach(k=> SCENES[k].classList.toggle('on', k === name));
  sceneNow = name;
  if(name === 'game' && gameReady) Game.layout();
  if(name === 'gate' || name === 'code') fitTitle(SCENES[name]);
}

/* ── Chiều cao thật & bàn phím ảo ────────────────────────────────────────── */
const vv = window.visualViewport;
function syncVH(){
  const h = vv ? vv.height : window.innerHeight;
  document.documentElement.style.setProperty('--vh', h + 'px');
  const kb = vv ? (window.innerHeight - vv.height > 120) : false;
  document.body.classList.toggle('kb-open', kb);
  if(gameReady) Game.layout();
}
if(vv){ vv.addEventListener('resize', syncVH); vv.addEventListener('scroll', syncVH); }
window.addEventListener('resize', syncVH, {passive:true});
window.addEventListener('orientationchange', ()=> setTimeout(syncVH,250));

/* ═══ CO TIÊU ĐỀ CHO VỪA MỘT HÀNG ═══
   Các dòng của h1 đặt `nowrap`, nên dòng nào dài hơn khung sẽ TRÀN RA NGOÀI
   chứ không tự xuống hàng — đo mới biết, nhìn thì không. */
function fitTitle(root){
  const h = root && root.querySelector('h1');
  if(!h) return;
  for(let px = 30; px >= 15; px--){
    h.style.fontSize = px + 'px';
    let qua = false;
    h.querySelectorAll('.d, .khoa').forEach(d=>{
      if(d.scrollWidth > d.clientWidth + 0.5) qua = true;
    });
    if(!qua) return;
  }
}
/* Đo TRƯỚC khi webfont về là đo nhầm: Oswald hẹp hơn font dự phòng khá nhiều. */
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(()=>{ fitTitle(SCENES[sceneNow]); if(gameReady) Game.layout(); });
}

/* ════════════════════════════════════════════════════════════════════════════
   ① MÀN ĐẾM NGƯỢC
   ════════════════════════════════════════════════════════════════════════════ */
const Gate = (function(){
  const G = GATE_CONFIG, T = G.text;
  const el = { vai:$('#gVai'), tit:$('#gTit'), loi:$('#gLoi'), dem:$('#gDem'),
               play:$('#gPlay'), stamp:$('#gStamp'), back:$('#gBack') };

  const ISO = G.moc_iso.replace('{YEAR}', new Date().getFullYear());
  const MOC = new Date(ISO).getTime();
  const d   = ISO.slice(0,10).split('-');

  el.vai.textContent   = T.vai_truoc;
  el.play.textContent  = T.nut_vao_game;
  el.stamp.innerHTML   = T.version;
  el.back.textContent  = T.ve_ban_do;
  el.tit.innerHTML = '<span class="d">'+T.tieu_de+'</span><span class="khoa">'+T.nhan_khoa+'</span>';
  el.loi.innerHTML = T.hen.replace('{DATE}', d[2]+'-'+d[1]);

  /* Cửa hậu từ Box Tổng tư lệnh: cờ `g2Hack` = coi như đã tới mốc. */
  const BYPASS = !!Store.get().g2Hack;
  let vaoRoi   = !!Store.get().g2Vao;
  const CHO    = G.cho_lan_dau_ms, moTu = Date.now();
  let timer = 0, moKhoaRoi = false;

  function p2(n){ return (n<10?'0':'') + n; }

  function moCong(){
    if(moKhoaRoi) return;
    moKhoaRoi = true;
    clearInterval(timer);
    el.dem.textContent = '';
    /* Đã phá đảo mini-game rồi thì khỏi bắt chơi lại — vào thẳng màn phát mã. */
    if(Store.get().g2Game){ Code.open(); return; }
    el.loi.textContent = T.moi_vao_game;
    el.play.hidden = false;
    Game.prefetch();                 /* nạp ngầm ảnh nền cho đỡ chờ lúc bấm */
    fitTitle(SCENES.gate);
  }

  function tick(){
    const con = BYPASS ? 0 : MOC - Date.now();
    if(con <= 0 && !vaoRoi){
      /* ═══ GHÉ SAU MỐC: đếm thêm vài giây rồi mới mở ═══
         Tới nơi mà cửa bày sẵn ra thì mất hẳn cảm giác "vừa mở cho mình". */
      const lai = CHO - (Date.now() - moTu);
      if(lai > 0){
        el.loi.textContent = T.cua_dang_mo;
        el.dem.innerHTML = '<b>' + Math.ceil(lai/1000) + '</b>S';
        return;
      }
      vaoRoi = true; Store.patch({g2Vao:true});
    }
    if(con <= 0){ moCong(); return; }
    el.dem.innerHTML = '<b>' + Math.floor(con/864e5) + '</b>N '
      + '<b>' + p2(Math.floor(con%864e5/36e5)) + '</b>G '
      + '<b>' + p2(Math.floor(con%36e5/6e4)) + '</b>P '
      + '<b>' + p2(Math.floor(con%6e4/1e3)) + '</b>S';
  }

  el.play.addEventListener('click', ()=>{ show('game'); Game.start(); });

  fitTitle(SCENES.gate);
  /* Hoãn nhịp ĐẦU sang vòng sau: khi đã qua mốc (hoặc bật cờ g2Hack), tick()
     gọi thẳng Code.open() / Game.prefetch() — hai khối đó khai báo bên dưới,
     gọi ngay tại đây là vấp TDZ và cả trang chết. */
  setTimeout(()=>{ tick(); timer = setInterval(tick, 1000); }, 0);
  return {};
})();

/* ════════════════════════════════════════════════════════════════════════════
   ③ MÀN PHÁT MÃ TYRION
   ════════════════════════════════════════════════════════════════════════════ */
const Code = (function(){
  const G = GATE_CONFIG, T = G.text;
  const el = { vai:$('#cVai'), tit:$('#cTit'), loi:$('#cLoi'), maO:$('#cMaO'),
               maLab:$('#cMaLab'), replay:$('#cReplay'), reset:$('#cReset'),
               go:$('#cGo'), stamp:$('#cStamp'), back:$('#cBack') };
  let dungSan = false;

  function build(){
    if(dungSan) return;
    dungSan = true;
    el.vai.textContent   = T.vai_sau;
    el.loi.textContent   = T.da_pha_dao;
    el.maLab.textContent = T.ma_nhan;
    el.replay.textContent= T.nut_choi_lai_game;
    el.reset.textContent = T.nut_reset;
    el.go.innerHTML      = T.nut_castle + ' <span class="ico2">🏰👸🏻</span>';
    el.go.href           = G.ma_link;
    el.stamp.innerHTML   = T.version;
    el.back.textContent  = T.ve_ban_do;
    el.tit.innerHTML = '<span class="d">'+T.tieu_de_thang+'</span><span class="d">'+T.tieu_de+'</span>';
    el.maO.innerHTML = [...G.ma].map(c=>'<i>'+c+'</i>').join('');
  }

  /* ═══ NÚT CHƠI LẠI TỪ ĐẦU ═══
     Đi đúng luật reset của bản đồ: dọn `mtv1` rồi ghi lại MỘT khoá duy nhất là
     bộ đếm R(n) — dấu vết được phép sống qua reset. Dọn thêm `hanv1` vì tiến độ
     Map 3 nằm sau Easter Egg. `nav1` và `msn1` KHÔNG đụng.
     Bấm HAI NHỊP mới ăn — nút này xoá sạch, không được để lỡ tay. */
  let armed = false, tReset = 0;
  el.reset.addEventListener('click', ()=>{
    if(!armed){
      armed = true; el.reset.textContent = T.nut_reset_hoi;
      clearTimeout(tReset);
      tReset = setTimeout(()=>{ armed = false; el.reset.textContent = T.nut_reset; }, 4000);
      return;
    }
    const R = Store.get().resetCount || 0;
    try{
      ['mtv1','mtping','hanv1'].forEach(k=> localStorage.removeItem(k));
      localStorage.setItem('mtv1', JSON.stringify({resetCount:R+1}));
      ['mtseen','mtload','mtvisit','mtpf','msnw'].forEach(k=> sessionStorage.removeItem(k));
    }catch(e){}
    el.reset.textContent = T.nut_reset_chay;
    setTimeout(()=>{ location.href = '/'; }, 260);
  });

  el.replay.addEventListener('click', ()=>{ show('game'); Game.start(true); });

  return { open(){ build(); show('code'); } };
})();

/* ════════════════════════════════════════════════════════════════════════════
   ② MINI-GAME PIXEL 2 VÒNG
   ════════════════════════════════════════════════════════════════════════════ */
const Game = (function(){

const C = GAME_CONFIG, T = C.timing;

/* Đổ chữ giao diện từ config */

/* ═══ BỐ CỤC ══════════════════════════════════════════════════════════════
   Khung máy phải vừa CẢ bề ngang lẫn trần chiều cao. Trần đo từ chiều cao cả
   màn (không phải từ #stage) nên không vòng lặp: #stage cao bao nhiêu là do
   khung máy quyết định, chứ không ngược lại. Nhờ vậy không còn khoảng trống
   chết giữa khung máy và hộp thoại terminal.                                */
function fitBezel(){

  if(!appH) return;

  const w    = Math.min(el.slot.clientWidth, Math.max(60, maxH) * C.frame.ratio);
  el.bezel.style.width = w.toFixed(1) + 'px';
}
/* Cỡ chữ bệ đá tính theo bề ngang MÀN HÌNH để mọi máy đều đọc được */
function fitSlabs(){
  const w = el.screen.clientWidth || 320;
  [[el.slab1, el.row1, C.round1], [el.slab2, el.row2, C.round2]].forEach(([slab,row,cfg])=>{
    if(!row.children.length) return;
    const fs = Math.max(7, (w * cfg.slab.width_frac) / (row.children.length * 1.16));
    slab.style.fontSize = fs.toFixed(1) + 'px';   /* .row kế thừa từ đây */
  });
}
/* Vùng chạm lá thư: % của ảnh nền, nhưng không bao giờ nhỏ hơn min_px */
function fitHotspot(){

  el.hotspot.style.minHeight = h.min_px + 'px';

function sizeFx(){

  el.fx.width  = el.root.clientWidth  * r;
  el.fx.height = el.root.clientHeight * r;

}
function layout(){ fitBezel(); fitSlabs(); fitHotspot(); sizeFx(); }

/* ═══ CAMERA ══════════════════════════════════════════════════════════════
   Khung 4:3 hẹp hơn ảnh nền 2.28:1 rất nhiều → dư ngang lớn, vuốt thoải mái.
   Kéo tay thì tắt transition (bám ngón), thả ra thì bật lại một đường ease-out
   dài để camera "trôi" về giữa.                                             */
const CAM = { x:0, max:0, drag:false, sx:0, base:0, moved:false, enabled:true };
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
function camMax(){ return Math.max(0,(el.world.offsetWidth - el.screen.clientWidth)/2); }
function camApply(){ el.world.style.setProperty('--pan', CAM.x.toFixed(2)+'px'); }
function camTo(x, ms, easing){
  el.world.style.transition = ms ? ('transform '+ms+'ms '+(easing||'cubic-bezier(.16,1,.3,1)')) : 'none';
  CAM.x = x; camApply();
}
function camIntro(){
  CAM.max = camMax();
  camTo(-CAM.max * 0.88, 0);
  requestAnimationFrame(()=> requestAnimationFrame(()=>{
    camTo(0, T.intro_pan, 'cubic-bezier(.22,.61,.36,1)');
  }));
}
el.screen.addEventListener('pointerdown', e=>{
  if(!CAM.enabled) return;
  /* Chạm vào lá thư thì KHÔNG bắt đầu kéo camera: setPointerCapture() bên dưới
     kéo pointerup về #screen, làm sự kiện click nhảy lên #screen thay vì lên
     nút hotspot — bấm lá thư sẽ không ăn. */
  if(e.target.closest && e.target.closest('.hotspot')) return;
  CAM.max = camMax();
  if(CAM.max <= 1) return;
  CAM.drag = true; CAM.moved = false;
  CAM.sx = e.clientX; CAM.base = CAM.x;
  el.screen.classList.add('dragging');
  el.world.style.transition = 'none';
  try{ el.screen.setPointerCapture(e.pointerId); }catch(_){}
});
el.screen.addEventListener('pointermove', e=>{
  if(!CAM.drag) return;
  const dx = e.clientX - CAM.sx;
  if(Math.abs(dx) > 6) CAM.moved = true;
  CAM.x = clamp(CAM.base + dx, -CAM.max, CAM.max);
  camApply();
});
function endDrag(){
  if(!CAM.drag) return;
  CAM.drag = false;
  el.screen.classList.remove('dragging');
  camTo(0, T.recenter);
  setTimeout(()=>{ CAM.moved = false; }, 60);
}
['pointerup','pointercancel','pointerleave'].forEach(ev=>
  el.screen.addEventListener(ev, endDrag));

/* ═══ HỘP THOẠI TYPEWRITER ════════════════════════════════════════════════ */
const Q = []; let typing = false, skip = false;
function say(text, cls){
  return new Promise(res=>{ Q.push({text,cls,res}); pump(); });
}
function sayAll(v, cls){
  if(Array.isArray(v)) return v.reduce((p,t)=> p.then(()=> say(t,cls)), Promise.resolve());
  return say(v, cls);
}
function pump(){
  if(typing || !Q.length) return;
  typing = true; skip = false;
  const job = Q.shift();
  const p = document.createElement('p');
  p.className = 'line ' + (job.cls || '');
  const span = document.createElement('span');
  const caret = document.createElement('i');
  caret.className = 'caret';
  p.appendChild(span); p.appendChild(caret);
  el.narr.appendChild(p);
  while(el.narr.children.length > 40) el.narr.removeChild(el.narr.firstChild);

  let i = 0; const txt = job.text;
  const step = ()=>{
    if(skip){ span.textContent = txt; return fin(); }
    span.textContent = txt.slice(0, ++i);
    el.narr.scrollTop = el.narr.scrollHeight;
    if(i >= txt.length) fin(); else setTimeout(step, T.type_speed);
  };
  function fin(){
    caret.remove();
    el.narr.scrollTop = el.narr.scrollHeight;
    typing = false; job.res();
    setTimeout(pump, 90);
  }
  setTimeout(step, 60);
}
el.narr.addEventListener('click', ()=>{ if(typing) skip = true; });

/* ═══ BỆ ĐÁ ═══════════════════════════════════════════════════════════════ */
function buildSlab(rowEl, word){
  rowEl.innerHTML = '';
  [...word].forEach(ch=>{
    const s = document.createElement('span');
    s.className = 'ltr' + (ch === ' ' ? ' sp' : '');
    s.textContent = ch === ' ' ? '' : ch;
    s.dataset.ch = ch;
    rowEl.appendChild(s);
  });
}
function placeSlabs(){
  el.slab1.style.setProperty('--sx', C.round1.slab.x);
  el.slab1.style.setProperty('--sy', C.round1.slab.y);
  el.slab1.style.setProperty('--slab-c', C.round1.color);
  el.slab2.style.setProperty('--sx', C.round2.slab.x);
  el.slab2.style.setProperty('--sy', C.round2.slab.y);
  el.slab2.style.setProperty('--slab-c', C.round2.color);
  const h = C.round2.hotspot;
  el.hotspot.style.setProperty('--hx', h.x);
  el.hotspot.style.setProperty('--hy', h.y);
  el.hotspot.style.setProperty('--hw', h.w);
  el.hotspot.style.setProperty('--hh', h.h);
}
/* Chớp sáng đúng chữ cái vừa gõ trúng. Ưu tiên ô CÙNG VỊ TRÍ với ký tự vừa
   nhập; không trùng thì lấy ô đầu tiên mang ký tự đó và chưa sáng gần đây. */
function flashLetter(ch, pos){
  if(!S.slabRow || !ch) return;
  const w = S.slabWord, cells = S.slabRow.children, c = ch.toUpperCase();
  if(c === ' ' || w.indexOf(c) < 0) return;
  let target = -1;
  if(w[pos] === c) target = pos;
  if(target < 0){
    for(let i=0;i<w.length;i++){ if(w[i]===c && !S.litRecently[i]){ target = i; break; } }
  }
  if(target < 0) target = w.indexOf(c);
  const cell = cells[target];
  if(!cell) return;
  S.litRecently[target] = true;
  cell.classList.add('hit');
  clearTimeout(cell._t);
  cell._t = setTimeout(()=>{
    cell.classList.remove('hit'); S.litRecently[target] = false;
  }, 300);
}
function breatheSlab(){
  const s = S.slabEl;
  if(!s || s.classList.contains('solved')) return;
  s.classList.remove('breathe');
  void s.offsetWidth;
  s.classList.add('breathe');
  setTimeout(()=> s.classList.remove('breathe'), 1350);
}
function armIdle(){
  clearTimeout(S.idleTimer);
  if(S.done || S.inputLocked) return;
  S.idleTimer = setTimeout(breatheSlab, T.idle_hint);
}
/* Đổi vị trí chữ bằng kỹ thuật FLIP: đo trước, sắp lại DOM, đo sau, đặt
   transform ngược rồi thả về 0 → chữ cái trượt sang chỗ mới. */
function morphSlab(rowEl, toWord){
  const spans = [...rowEl.children];
  const first = spans.map(s=> s.getBoundingClientRect().left);
  const used = new Array(spans.length).fill(false), order = [];
  [...toWord].forEach(ch=>{
    let i = spans.findIndex((s,k)=> !used[k] && s.dataset.ch === ch);
    if(i < 0) i = spans.findIndex((s,k)=> !used[k]);
    if(i < 0) i = 0;
    used[i] = true; order.push(spans[i]);
  });
  order.forEach(s=> rowEl.appendChild(s));
  const last = order.map(s=> s.getBoundingClientRect().left);
  order.forEach((s,k)=>{
    s.style.transition = 'none';
    s.style.transform = 'translateX(' + (first[spans.indexOf(s)] - last[k]).toFixed(2) + 'px)';
  });
  requestAnimationFrame(()=> requestAnimationFrame(()=>{
    order.forEach(s=>{
      s.style.transition = 'transform .75s cubic-bezier(.6,-.2,.3,1.4), opacity .3s ease, text-shadow .3s ease';
      s.style.transform = 'translateX(0)';
    });
  }));
}

/* ═══ NẠP TÀI NGUYÊN ══════════════════════════════════════════════════════ */
const cache = {};
function load(src){
  if(cache[src]) return cache[src];
  cache[src] = new Promise(res=>{
    const im = new Image();
    im.onload = ()=> res(true);
    im.onerror= ()=> res(false);
    im.src = src;
  });
  return cache[src];
}
/* Clip webp lặp vô hạn → mỗi lần phát tạo <img> MỚI (cùng URL nên lấy từ cache
   trình duyệt, không tải lại) để animation chạy lại từ đầu, xong thì gỡ ra. */
async function playClip(src, ms){
  await load(src);
  el.animLayer.innerHTML = '';
  const im = new Image(); im.src = src;
  el.animLayer.appendChild(im);
  el.animLayer.classList.add('on');
  await wait(ms);
  el.animLayer.classList.remove('on');
  el.animLayer.innerHTML = '';
}

/* ═══ Ô NHẬP ══════════════════════════════════════════════════════════════ */
function setInput(on, placeholder){
  S.inputLocked = !on;
  el.input.disabled = !on;
  el.unlock.disabled = !on;
  if(placeholder) el.input.placeholder = placeholder;
  if(on) armIdle(); else clearTimeout(S.idleTimer);
}
function showCtrl(on){ el.ctrl.hidden = !on; }

el.input.addEventListener('input', ()=>{
  const up = el.input.value.toUpperCase();
  if(up !== el.input.value){
    const p = el.input.selectionStart;
    el.input.value = up;
    try{ el.input.setSelectionRange(p,p); }catch(_){}
  }
  const v = el.input.value;
  if(v.length > S.lastLen) flashLetter(v[v.length-1], v.length-1);  /* CHỈ khi thêm ký tự */
  S.lastLen = v.length;
  armIdle();
});
el.input.addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); submit(); }});
el.unlock.addEventListener('click', submit);
el.input.addEventListener('focus', ()=>{
  setTimeout(()=>{ try{ el.input.scrollIntoView({block:'center',behavior:'smooth'}); }catch(_){} }, 320);
});

const norm = s => (s||'').toUpperCase().replace(/\s+/g,'').trim();
function submit(){
  if(S.busy || S.inputLocked) return;
  const v = el.input.value.trim();
  if(!v) return;
  const cfg = S.round === 1 ? C.round1 : C.round2;
  if(cfg.accept.some(a=> norm(a) === norm(v))) (S.round === 1 ? win1() : win2());
  else fail();
}

async function fail(){
  S.busy = true;
  setInput(false);
  S.wrongs[S.round]++;
  el.input.value = ''; S.lastLen = 0;

  if(S.round === 1){
    playClip(A('anim_wrong'), T.anim_wrong);      /* chạy song song với log */
    await say(C.dialogues.round1_wrong, 'err');
    if(S.wrongs[1] >= T.idle_wrongs) await say(C.dialogues.round1_wrong_hint, 'warn');
  }else{
    el.narr.classList.remove('shake'); void el.narr.offsetWidth;
    el.narr.classList.add('shake');
    el.aura.classList.add('angry');
    setTimeout(()=> el.aura.classList.remove('angry'), 1400);
    await say(C.dialogues.round2_wrong, 'err');
    if(S.wrongs[2] >= T.idle_wrongs) await say(C.dialogues.round2_wrong_hint, 'warn');
  }
  if(S.wrongs[S.round] >= T.idle_wrongs) breatheSlab();

  await wait(T.lock_after_bad);
  setInput(true);
  S.busy = false;
  await say(C.dialogues.unlocked_input, 'sys');
}

/* ═══ MODAL · SLIDESHOW + THƯ ═════════════════════════════════════════════ */
let slideIdx = 0, slideTimer = 0, letterToken = 0;

/* Chưa có file ảnh thì tự vẽ ảnh pixel thay thế bằng canvas */
function pixelPlaceholder(i){
  const W = 160, H = 120;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  const sky = g.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#141d33'); sky.addColorStop(1,'#2a1a3c');
  g.fillStyle = sky; g.fillRect(0,0,W,H);
  g.fillStyle = '#8fb7ff';
  for(let k=0;k<26;k++) g.fillRect((k*37+i*13)%W|0, (k*23+i*7)%(H*0.6)|0, 2, 2);
  g.fillStyle = '#1d2b45';
  for(let x=0;x<W;x+=4){
    const h = 26 + Math.round(14*Math.sin((x+i*20)/22) + 8*Math.sin(x/7));
    g.fillRect(x, H-34-h, 4, h+34);
  }
  ['0110110','1111111','1111111','0111110','0011100','0001000'].forEach((row,r)=>
    [...row].forEach((c,q)=>{
      if(c === '1'){ g.fillStyle = '#ff5b8a'; g.fillRect(W/2-21+q*6, 34+r*6, 6, 6); }
    }));
  g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, H-20, W, 20);
  g.fillStyle = '#00ff66'; g.font = '9px monospace'; g.textAlign = 'center';
  g.fillText((C.photo_captions[i] || ('MEMORY 0'+(i+1))) + ' · N/A', W/2, H-7);
  return cv.toDataURL('image/png');
}
function buildSlides(){
  el.show.innerHTML = ''; el.dots.innerHTML = '';
  C.photos.forEach((p,i)=>{
    const im = document.createElement('img');
    im.alt = C.photo_captions[i] || ('Ảnh kỷ niệm ' + (i+1));
    im.onerror = function(){ this.onerror = null; this.src = pixelPlaceholder(i); };
    im.src = C.photos_base + p;
    if(i === 0) im.classList.add('on');
    el.show.appendChild(im);
    const d = document.createElement('i');
    if(i === 0) d.classList.add('on');
    el.dots.appendChild(d);
  });
}
function goSlide(n){
  const imgs = el.show.children, dots = el.dots.children;
  if(!imgs.length) return;
  slideIdx = (n + imgs.length) % imgs.length;
  [...imgs].forEach((im,i)=> im.classList.toggle('on', i === slideIdx));
  [...dots].forEach((d,i)=> d.classList.toggle('on', i === slideIdx));
}
function autoSlide(){
  clearInterval(slideTimer);
  slideTimer = setInterval(()=> goSlide(slideIdx+1), T.slide_auto);
}
el.prev.addEventListener('click', ()=>{ goSlide(slideIdx-1); autoSlide(); });
el.next.addEventListener('click', ()=>{ goSlide(slideIdx+1); autoSlide(); });

function typeLetter(){
  const my = ++letterToken, txt = C.letter_content;
  el.letterBox.textContent = '';
  el.finish.disabled = true;
  let i = 0;
  (function step(){
    if(my !== letterToken) return;
    el.letterBox.textContent = txt.slice(0, i += 1);
    el.letterBox.scrollTop = el.letterBox.scrollHeight;
    if(i < txt.length) setTimeout(step, T.letter_speed);
    else el.finish.disabled = false;
  })();
}
el.letterBox.addEventListener('click', ()=>{
  if(el.finish.disabled){
    letterToken++;
    el.letterBox.textContent = C.letter_content;
    el.finish.disabled = false;
  }
});
function openModal(){
  el.hotspot.classList.remove('on');
  el.modal.classList.add('on');
  buildSlides(); goSlide(0); autoSlide(); typeLetter();
}
el.finish.addEventListener('click', async ()=>{
  if(el.finish.disabled) return;
  el.modal.classList.remove('on');
  clearInterval(slideTimer);
  S.done = true;
  Store.patch({g2Game:true});          /* nhớ là đã phá đảo mini-game */
  confetti();
  await sayAll(C.dialogues.finale, 'cy');
  await wait(1400);
  Code.open();                         /* → sang màn phát mã TYRION */
});

/* ═══ PHÁO HOA PIXEL ══════════════════════════════════════════════════════ */
function confetti(){
  const COLORS = ['#00ff66','#ffaa00','#00f2ff','#ff5b8a','#ffffff','#b79bf2'];
  const W = el.root.clientWidth, H = el.root.clientHeight, parts = [];
  const push = (x,y,n,speed)=>{
    for(let k=0;k<n;k++){
      const a = Math.random()*Math.PI*2, v = speed*(0.35+Math.random()*0.85);
      parts.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v-1.4,
        s:3+Math.round(Math.random()*3), c:COLORS[(Math.random()*COLORS.length)|0],
        life:1, decay:0.006+Math.random()*0.008});
    }
  };
  for(let k=0;k<90;k++) parts.push({
    x:Math.random()*W, y:-Math.random()*H*0.6,
    vx:(Math.random()-0.5)*1.1, vy:1.4+Math.random()*2.4,
    s:3+Math.round(Math.random()*3), c:COLORS[(Math.random()*COLORS.length)|0],
    life:1, decay:0.0035});

  el.fx.classList.add('on');
  let bursts = 0;
  const bt = setInterval(()=>{
    push(W*(0.18+Math.random()*0.64), H*(0.18+Math.random()*0.38), 46, 4.2);
    if(++bursts >= 6) clearInterval(bt);
  }, 620);
  push(W*0.5, H*0.34, 60, 4.6);

  const t0 = performance.now();
  (function frame(now){
    fxCtx.clearRect(0,0,W,H);
    let live = 0;
    for(const p of parts){
      p.vy += 0.055; p.x += p.vx; p.y += p.vy; p.vx *= 0.995; p.life -= p.decay;
      if(p.life <= 0 || p.y > H+20) continue;
      live++;
      fxCtx.globalAlpha = Math.max(0, Math.min(1, p.life));
      fxCtx.fillStyle = p.c;
      fxCtx.fillRect(p.x|0, p.y|0, p.s, p.s);      /* ô vuông = pixel */
    }
    fxCtx.globalAlpha = 1;
    if(live > 0 && now - t0 < 12000) requestAnimationFrame(frame);
    else { clearInterval(bt); fxCtx.clearRect(0,0,W,H); el.fx.classList.remove('on'); }
  })(performance.now());
}

/* ═══ THOÁT / KHỞI ĐỘNG ═══════════════════════════════════════════════════ */
el.back.addEventListener('click', ()=>{
  show(Store.get().g2Game ? 'code' : 'gate');
});

async function bootUp(){
  if(S.booted) return;
  S.booted = true;
  let fake = 0;
  const fakeTimer = setInterval(()=>{
    fake = Math.min(fake+3, 92);
    el.bar.style.width = fake + '%';
    el.loadTxt.textContent = 'LOADING ' + fake + '%';
  }, 180);

  await load(A('bg_r1'));
  clearInterval(fakeTimer);
  el.bar.style.width = '100%';
  el.loadTxt.textContent = 'LOADING 100%';
  el.bootSub.textContent = C.ui.boot_ready;
  el.startBtn.hidden = false;

  const idle = window.requestIdleCallback || (f=> setTimeout(f,600));
  idle(()=>{ load(A('anim_wrong')); load(A('bg_r2')); });
}
el.startBtn.addEventListener('click', ()=>{
  el.boot.classList.add('gone');
  setTimeout(()=>{ el.boot.style.display = 'none'; }, 520);
  startRound1();
});

/* Dọn sạch để chơi lại từ đầu */
function reset(){
  S.round = 0; S.busy = true; S.wrongs = {1:0,2:0}; S.done = false;
  S.lastLen = 0; S.litRecently = {};
  clearTimeout(S.idleTimer);
  Q.length = 0; typing = false;
  el.narr.innerHTML = '';
  el.input.value = '';
  showCtrl(false); setInput(false);
  el.slab1.className = 'slab'; el.slab2.className = 'slab';
  el.row1.innerHTML = ''; el.row2.innerHTML = '';
  el.dragon.className = 'dragon-layer'; el.aura.className = 'aura';
  el.hotspot.classList.remove('on');
  el.root.classList.remove('r2');
  el.hud.classList.remove('ok');
  el.animLayer.classList.remove('on'); el.animLayer.innerHTML = '';
  CAM.enabled = true; camTo(0,0);
  el.boot.style.display = ''; el.boot.classList.remove('gone');
  el.startBtn.hidden = true;
  el.bar.style.width = '0%'; el.loadTxt.textContent = 'LOADING 0%';
  el.bootSub.textContent = C.ui.boot_sub;
  S.booted = false;
}

placeSlabs();

return {
  layout,
  prefetch(){ load(A('bg_r1')); },
  start(again){ if(again) reset(); layout(); bootUp(); }
};
})();

gameReady = true;
syncVH();
})();
