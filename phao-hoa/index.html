<style>
/* ============================================================
   MÀN PHÁO HOA — trang riêng
   Nền là ĐÚNG bản đồ tác chiến nhưng TẮT HẾT ĐÈN: không toạ độ, không đường
   bay, không chữ; đất liền chỉ còn một bóng mờ. Có vậy ánh pháo hoa mới nổi.
   Chữ nằm TRÊN CAO ngay vùng pháo nổ, nút bấm ở chân trang.
   ============================================================ */
:root{
  --void:#040b18; --navy:#0B1B3A; --neon:#38BDF8; --amber:#F2B441;
  --paper:#EAF0F7; --line:rgba(234,240,247,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#02060f;color:var(--paper);overflow:hidden;
  font-family:"Be Vietnam Pro",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center}
#app{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.frame{position:relative;width:100%;max-width:460px;height:100%;max-height:940px;
  overflow:hidden;background:var(--void);display:flex;flex-direction:column;
  box-shadow:0 30px 90px rgba(0,0,0,.7)}
@media(min-width:480px){.frame{border-radius:26px;height:92vh;border:1px solid rgba(255,255,255,.06)}}
.corner{position:absolute;width:20px;height:20px;border-color:rgba(234,240,247,.14);z-index:6}
.corner.tl{top:13px;left:13px;border-top:2px solid;border-left:2px solid}
.corner.tr{top:13px;right:13px;border-top:2px solid;border-right:2px solid}
.corner.bl{bottom:13px;left:13px;border-bottom:2px solid;border-left:2px solid}
.corner.br{bottom:13px;right:13px;border-bottom:2px solid;border-right:2px solid}

/* bản đồ tắt đèn — chỉ còn bóng đất liền */
.bg{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;
  pointer-events:none}
.bg svg{width:104%;height:104%;opacity:.42}
.bg .land{fill:#0A1930;stroke:rgba(56,189,248,.11);stroke-width:1.1}

canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2}

/* ── chữ trên cao, ngay vùng pháo nổ ── */
.top{position:relative;z-index:3;flex:none;padding:56px 20px 0;text-align:center;
  pointer-events:none}
.tit{font-family:"Oswald";font-weight:600;font-size:clamp(16px,5.2vw,23px);
  letter-spacing:.03em;text-transform:uppercase;margin:0;color:var(--amber);
  white-space:nowrap;text-shadow:0 2px 22px rgba(4,11,24,.9)}
.tit.blink{animation:egg 1.9s linear infinite}
@keyframes egg{0%,100%{color:var(--amber);text-shadow:0 0 20px rgba(242,180,65,.5)}
  50%{color:var(--neon);text-shadow:0 0 24px rgba(56,189,248,.55)}}
/* Player và Unlock đi CHUNG một dòng, ngăn bằng dấu chấm giữa */
.meta{margin:10px 0 0;font-family:"Oswald";font-size:clamp(8px,2.4vw,9.5px);
  font-weight:500;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(234,240,247,.5);white-space:nowrap;
  text-shadow:0 2px 14px rgba(4,11,24,.9)}
.meta b{color:var(--paper);font-weight:600}
.meta em{font-style:normal;color:var(--neon);font-weight:600}
.meta i{font-style:normal;opacity:.4;margin:0 7px}

/* ── nút bấm ở chân trang ── */
.dock{position:relative;z-index:3;margin-top:auto;flex:none;padding:0 22px 26px}
.modes{display:flex;gap:9px}
.modes button{flex:1;padding:12px 8px;border-radius:999px;cursor:pointer;
  font-family:"Oswald";font-size:10px;font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(234,240,247,.72);
  border:1px solid var(--line);background:rgba(11,27,58,.62);
  backdrop-filter:blur(6px);transition:color .2s,background .25s,border-color .25s}
.modes button.on{color:#08182e;border-color:transparent;
  background:linear-gradient(120deg,var(--amber),#F7D07A);
  box-shadow:0 10px 24px rgba(242,180,65,.34)}
.tip{margin:11px 0 0;font-family:"Oswald";font-size:8.5px;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(234,240,247,.34);text-align:center;
  min-height:11px}
.x{position:absolute;top:16px;right:16px;z-index:5;width:38px;height:38px;border-radius:50%;
  border:1px solid var(--line);background:rgba(4,11,24,.6);color:var(--paper);
  font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
@media (prefers-reduced-motion:reduce){ .tit.blink{animation:none} }
</style>

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };

/* Không ai đụng gì thì màn bắn kéo 30 giây rồi tự nghỉ — đủ xem, không lê thê.
   Xong thì đóng, hoặc bấm "Bắn lại" cho một lượt nữa. */
var AUTO_MS  = 30*1000;
var EGG_HREF = '/dad/950901-b';

function ping(ev, detail){
  try{
    var body = JSON.stringify({ ev:ev, detail:detail||'', at:new Date().toISOString(),
      solved:[], ua:navigator.userAgent.slice(0,120) });
    if(navigator.sendBeacon &&
       navigator.sendBeacon('/api/ping', new Blob([body],{type:'application/json'}))) return;
    fetch('/api/ping',{method:'POST',body:body,keepalive:true,
      headers:{'Content-Type':'application/json'}}).catch(function(){});
  }catch(e){}
}
function rnd(a, b){ return a + Math.random()*(b - a); }

/* ═══════════════════════════════════════════════════════════════
   PHÁO HOA
   Dựng riêng cho trang này, không xài lại bộ hình của cảnh SGN.
   Ba lớp, đúng cách một quả pháo thật đi:
     1. QUẢ BAY  — vọt lên từ mép dưới, chậm dần, rắc tàn lửa dọc đường;
     2. NỞ       — hàng trăm tia toả đều, kéo ĐUÔI SÁNG dài (mỗi hạt nhớ 6 vị
                   trí gần nhất rồi vẽ thành vệt nhạt dần) — chính cái đuôi này
                   tạo ra dáng "chùm tua" như ảnh mẫu;
     3. TÀN      — hạt nặng rơi theo trọng lực, nhấp nháy rồi tắt.
   Vẽ chồng sáng (globalCompositeOperation = 'lighter') để chỗ giao nhau bùng
   trắng, giống phim pháo hoa thật. Nền canvas vẫn TRONG SUỐT nên bóng bản đồ
   phía dưới không bị phủ mờ.
   ═══════════════════════════════════════════════════════════════ */

/* Bảng màu: vàng kim và xanh của bản đồ đứng chính, hồng/đỏ và tím điểm xuyết */
var MAU = [
  { h: 42,  s: 100 },   /* vàng kim — màu chủ đạo của bản đồ */
  { h: 196, s: 100 },   /* xanh neon */
  { h: 350, s: 96  },   /* đỏ hồng */
  { h: 275, s: 92  },   /* tím */
  { h: 150, s: 88  },   /* xanh ngọc */
  { h: 20,  s: 100 }    /* cam lửa */
];
var KIEU = ['chum', 'tua', 'vong', 'nhon'];   /* chùm · tua rủ · vòng · chùm nhọn */

var cv = $('cv'), c = cv.getContext('2d');
var dpr = Math.min(devicePixelRatio || 1, 2);
var W = 0, H = 0, raf = 0;
var quaBay = [], hat = [];
var TRAIL = 6;                 /* số vị trí mỗi hạt nhớ để vẽ đuôi */

function co(){
  var r = cv.getBoundingClientRect();
  W = r.width; H = r.height;
  cv.width = W*dpr; cv.height = H*dpr;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* ---- 1. bắn một quả lên ---- */
function ban(x, dinh){
  var m = MAU[(Math.random()*MAU.length)|0];
  var tx = x == null ? rnd(W*0.26, W*0.74) : x;   /* chừa lề để chùm không cụt mép */
  var ty = dinh == null ? rnd(H*0.24, H*0.52) : dinh;   /* né vùng chữ trên cùng */
  var cao = Math.max(90, H - ty);
  quaBay.push({
    x: tx + rnd(-14, 14), y: H + 8,
    vx: rnd(-0.35, 0.35),
    /* tốc độ ban đầu tính ngược từ độ cao muốn tới, để quả nổ đúng tầm */
    vy: -Math.sqrt(2 * 0.13 * cao),
    dich: ty, mau: m,
    kieu: KIEU[(Math.random()*KIEU.length)|0],
    to: rnd(0.82, 1.25),
    khoi: 0
  });
}

/* ---- 2. nở ---- */
function no(q){
  var m = q.mau, k = q.kieu;
  var n = k === 'vong' ? 96 : (k === 'tua' ? 128 : (k === 'sao' ? 150 : 116));
  n = Math.round(n * q.to);
  var goc0 = Math.random()*6.283;
  for(var i = 0; i < n; i++){
    var a = goc0 + (i/n)*6.283 + rnd(-0.03, 0.03);
    var sp;
    if(k === 'vong')      sp = rnd(4.3, 4.9);                       /* vòng tròn đều */
    else if(k === 'tua')  sp = rnd(1.8, 5.8);                       /* tua rủ, dài ngắn lẫn lộn */
    else if(k === 'nhon') sp = rnd(2.8, 5.6) * (0.62 + 0.5*Math.abs(Math.cos(3*a)));
    else if(k === 'sao')  sp = rnd(5.2, 7.4);                       /* sao lớn, tia bắn xa */
    else                  sp = rnd(2.6, 5.4);                       /* chùm thường */
    sp *= q.to;
    var song = k === 'tua' ? rnd(0.9, 1.5) : (k === 'sao' ? rnd(0.85, 1.25) : rnd(0.62, 1.0));
    hat.push({
      x: q.x, y: q.y,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      h: m.h + rnd(-9, 9), s: k === 'sao' ? Math.max(46, m.s - 34) : m.s,
      song: song, doi: song,
      nang: k === 'tua' ? 0.052 : 0.038,      /* tua rủ thì nặng hơn cho xoã xuống */
      /* Lực cản quyết định bán kính chùm: cản yếu quá thì chùm bung rộng hơn cả
         khung, cắt cụt hai bên. 0.968–0.974 cho chùm vừa lòng khung 390px. */
      can: k === 'vong' ? 0.974 : (k === 'sao' ? 0.982 : 0.968),
      nhay: Math.random() < 0.34,
      duoi: []
    });
  }
  /* lõi sáng bùng ra giữa tâm */
  for(var j = 0; j < 16; j++){
    var b = Math.random()*6.283, t = rnd(0.2, 1.1);
    hat.push({ x:q.x, y:q.y, vx:Math.cos(b)*t, vy:Math.sin(b)*t,
      h:m.h, s:40, song:0.42, doi:0.42, nang:0.02, can:0.94, nhay:false, duoi:[] });
  }
}

/* ---- 3. vẽ ---- */
function ve(){
  c.clearRect(0, 0, W, H);
  c.globalCompositeOperation = 'lighter';
  c.lineCap = 'round';

  var i, q, p;
  /* quả đang bay + tàn lửa dọc đường */
  for(i = quaBay.length - 1; i >= 0; i--){
    q = quaBay[i];
    q.x += q.vx; q.y += q.vy; q.vy += 0.13;
    q.khoi++;
    if(q.khoi % 2 === 0){
      hat.push({ x:q.x + rnd(-1.4,1.4), y:q.y + rnd(0,3),
        vx:rnd(-0.22,0.22), vy:rnd(0.1,0.5),
        h:38, s:100, song:rnd(0.22,0.42), doi:0.42, nang:0.014, can:0.93,
        nhay:false, duoi:[] });
    }
    c.globalAlpha = 1;
    c.fillStyle = 'hsl(44,100%,86%)';
    c.beginPath(); c.arc(q.x, q.y, 2.1, 0, 6.2832); c.fill();
    if(q.vy >= -0.6 || q.y <= q.dich){ no(q); quaBay.splice(i, 1); }
  }

  /* hạt nổ — vẽ đuôi trước, chấm sáng sau */
  for(i = hat.length - 1; i >= 0; i--){
    p = hat[i];
    p.duoi.push(p.x, p.y);
    if(p.duoi.length > TRAIL*2) p.duoi.splice(0, 2);
    p.x += p.vx; p.y += p.vy;
    p.vy += p.nang; p.vx *= p.can; p.vy *= p.can;
    p.song -= 0.0102;
    if(p.song <= 0 || p.y > H + 30){ hat.splice(i, 1); continue; }

    var k = p.song / p.doi;                       /* 1 → 0 theo tuổi */
    /* Giữ MÀU: đẩy độ sáng lên gần trắng thì quả nào cũng hoá trắng như nhau,
       mất hẳn bảng màu. Chỉ lõi mới trắng, phần tua giữ đúng sắc của quả. */
    var sang = 48 + 26*k;
    var mo = k*0.72 + 0.28;
    if(p.nhay && k < 0.42) mo *= (Math.random() < 0.4 ? 0.25 : 1);

    /* đuôi: nối các vị trí cũ, nhạt dần về phía sau */
    var d = p.duoi, n = d.length/2;
    if(n > 1){
      for(var j = 0; j < n - 1; j++){
        var f = (j + 1) / n;                      /* càng gần đầu càng đậm */
        c.globalAlpha = mo * f * 0.82;
        c.strokeStyle = 'hsl(' + p.h + ',' + p.s + '%,' + sang + '%)';
        c.lineWidth = 0.7 + 1.9*f*(0.45 + 0.55*k);
        c.beginPath();
        c.moveTo(d[j*2], d[j*2+1]);
        c.lineTo(d[j*2+2], d[j*2+3]);
        c.stroke();
      }
    }
    c.globalAlpha = mo;
    c.fillStyle = 'hsl(' + p.h + ',' + p.s + '%,' + Math.min(88, sang + 22) + '%)';
    c.beginPath(); c.arc(p.x, p.y, 1.0 + 1.5*k, 0, 6.2832); c.fill();
  }

  c.globalAlpha = 1;
  c.globalCompositeOperation = 'source-over';
  raf = requestAnimationFrame(ve);
}

/* ═══════════ HAI CHẾ ĐỘ ═══════════ */
var che = '', autoT = 0, autoHet = 0;
function dungAuto(){ clearTimeout(autoT); autoT = 0; }

/* Auto-fire bắn theo ĐỢT: một hai quả lẻ, thỉnh thoảng một loạt ba quả rồi
   nghỉ lấy nhịp — đều đặn từng quả một nhìn như máy, không ra không khí lễ. */
function dotTiep(){
  if(che !== 'auto') return;
  if(Date.now() > autoHet){
    dungAuto();
    $('mAuto').classList.remove('on');
    $('tip').textContent = 'Hết đợt — bấm Bắn lại, hoặc đóng để ra về';
    return;
  }
  var loat = Math.random() < 0.28 ? 3 : (Math.random() < 0.55 ? 2 : 1);
  for(var i = 0; i < loat; i++) setTimeout(ban, i * rnd(140, 260));
  autoT = setTimeout(dotTiep, loat > 2 ? rnd(1500, 2100) : rnd(700, 1350));
}
function batDau(){
  che = 'auto';
  $('mAuto').classList.add('on');
  dungAuto();
  autoHet = Date.now() + AUTO_MS;
  $('tip').textContent = 'Chạm màn hình để bắn thêm · gõ đúp để ra về';
  ban(); dotTiep();
}
$('mAuto').addEventListener('click', function(e){
  e.stopPropagation();
  ping('phao_hoa_che', 'bắn lại một lượt');
  batDau();
});
/* Nút phải: đi thẳng vào hồ sơ niêm phong — chỗ Easter Egg thật sự nằm */
$('mEgg').addEventListener('click', function(e){
  e.stopPropagation();
  if(dangVe) return; dangVe = true;
  ping('vao_easter_egg', 'từ màn pháo hoa');
  setTimeout(function(){ location.href = EGG_HREF; }, 140);
});

/* Chạm màn hình vẫn bắn thêm một quả cho vui tay, không còn là chế độ riêng */
function batDauGiu(x, y){ ban(x, y); }
function thaTay(){}

/* ═══════════ RA VỀ ═══════════ */
var dangVe = false;
function veLai(){
  if(dangVe) return; dangVe = true;
  ping('phao_hoa_dong', che || 'chưa chọn chế độ');
  /* Về thẳng bản đồ kèm cờ cred=1 để khung Tổ kỹ thuật mở lại — quay lại mà
     khung biến mất thì người xem phải đi gõ 10 nhịp lần nữa, vô duyên. */
  setTimeout(function(){ location.href = '/?stay=1&cred=1'; }, 120);
}
$('close').addEventListener('click', function(e){ e.stopPropagation(); veLai(); });

/* Gõ đúp vào KHOẢNG TRỐNG (không phải nút) cũng ra về */
var chamCuoi = 0;
function nenNen(e){
  if(e.target.closest('button')) return;
  var r = cv.getBoundingClientRect();
  var t = e.touches ? e.touches[0] : e;
  var x = t.clientX - r.left, y = t.clientY - r.top;
  var now = Date.now();
  if(now - chamCuoi < 320){ chamCuoi = 0; thaTay(); veLai(); return; }
  chamCuoi = now;
  batDauGiu(x, y);
}
$('frame').addEventListener('mousedown', nenNen);
$('frame').addEventListener('touchstart', nenNen, {passive:true});
addEventListener('mouseup', thaTay);
addEventListener('touchend', thaTay);
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') veLai(); });

co();
addEventListener('resize', co, {passive:true});
if(!matchMedia('(prefers-reduced-motion: reduce)').matches) ve();
batDau();
ping('phao_hoa_mo', '');
})();
</script>
