<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Hồ sơ HAN-961030</title>

<meta property="og:site_name" content="Phi đoàn Dongchi Bình">
<meta property="og:title" content="Hồ sơ HAN-961030">
<meta property="og:description" content="Hai hồ sơ của Honghandangiu">

<noscript><link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap"></noscript>
<style>
/* ============================================================
   HAN-961030 — MÀN CHỌN HỒ SƠ
   Cửa ngõ giữa hai trang HAN. Từ 961030-a hay 961030-b bấm lùi đều về đây,
   người xem TỰ chọn bấm về bản đồ chính — không ai bị bắn thẳng ra ngoài.
   Dùng đúng bộ theme sáng của 961030-a (pastel + hoa anh đào rơi).
   ============================================================ */
:root{
  --lav:#F4E7FB;    --blush:#F3DCDC;  --coral:#F5BCBA;
  --orchid:#E3AADD; --violet:#C8A8E9; --peri:#C3C7F3;
  --ink:#3E2F56; --ink2:#7A6795;
  --line:rgba(122,103,149,.20);
  --card:rgba(255,255,255,.68);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#EFE6F7;color:var(--ink);
  font-family:"Be Vietnam Pro",system-ui,"Noto Sans",sans-serif;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
#app{width:100%;height:100%;display:flex;align-items:center;justify-content:center}

.frame{position:relative;width:100%;height:100%;display:flex;flex-direction:column;
  overflow:hidden;
  background:
    radial-gradient(120% 80% at 12% 4%, #FFF6FB 0%, rgba(255,246,251,0) 55%),
    radial-gradient(100% 70% at 92% 8%, #E9DEFB 0%, rgba(233,222,251,0) 60%),
    radial-gradient(120% 90% at 50% 108%, #F7D9DE 0%, rgba(247,217,222,0) 62%),
    linear-gradient(168deg, #F4E7FB 0%, #EDE4FA 42%, #F6E3EC 100%)}
@media (min-width:480px){
  body{background:linear-gradient(160deg,#E7DCF4,#F6E6EC)}
  .frame{max-width:460px;max-height:940px;height:92vh;border-radius:26px;
    box-shadow:0 30px 80px rgba(94,72,133,.22)}
}
.corner{position:absolute;width:20px;height:20px;border-color:rgba(122,103,149,.34);z-index:6}
.corner.tl{top:13px;left:13px;border-top:2px solid;border-left:2px solid}
.corner.tr{top:13px;right:13px;border-top:2px solid;border-right:2px solid}
.corner.bl{bottom:13px;left:13px;border-bottom:2px solid;border-left:2px solid}
.corner.br{bottom:13px;right:13px;border-bottom:2px solid;border-right:2px solid}

/* canvas là replaced element — thiếu width/height:100% thì inset:0 không giãn nổi */
#sakura{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

.classtag{position:absolute;top:13px;left:50%;transform:translateX(-50%);z-index:6;
  padding:6px 14px;border:1px solid var(--line);border-radius:5px;
  background:rgba(255,255,255,.55);backdrop-filter:blur(6px);
  font-family:"Oswald";font-size:8.5px;font-weight:500;letter-spacing:.24em;
  text-transform:uppercase;color:var(--ink2);text-align:center;line-height:1.7}
.classtag b{display:block;font-weight:600;color:var(--orchid);letter-spacing:.18em}

.wrap{position:relative;z-index:4;flex:1;min-height:0;display:flex;flex-direction:column;
  padding:64px clamp(20px,6vw,28px) 16px;overflow-y:auto;overscroll-behavior:contain}
.wrap::-webkit-scrollbar{width:0}

.eyebrow{display:flex;align-items:center;gap:12px;margin:8px 0 10px}
.eyebrow::before,.eyebrow::after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,rgba(227,170,221,.06),rgba(227,170,221,.6))}
.eyebrow::after{background:linear-gradient(90deg,rgba(227,170,221,.6),rgba(227,170,221,.06))}
.eyebrow i{width:5px;height:5px;background:var(--orchid);transform:rotate(45deg);
  border-radius:1px;display:block}

h1.title{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-style:italic;
  margin:0;font-size:clamp(26px,7.6vw,34px);line-height:1.12;color:var(--ink)}
h1.title b{display:block;font-style:normal;font-family:"Oswald";font-weight:600;
  font-size:clamp(11px,3.2vw,13px);letter-spacing:.3em;text-transform:uppercase;
  color:var(--violet);margin-bottom:9px}
.lead{margin:11px 0 0;font-size:12.5px;line-height:1.62;color:var(--ink2)}
.lead b{color:var(--ink)}

/* ── hai thẻ hồ sơ ── */
.files{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.file{position:relative;display:block;width:100%;text-align:left;cursor:pointer;
  padding:18px 18px 16px;border-radius:18px;
  border:1px solid rgba(255,255,255,.85);background:var(--card);
  backdrop-filter:blur(14px);box-shadow:0 14px 34px rgba(120,95,160,.14);
  transition:transform .18s,box-shadow .25s}
.file:hover{box-shadow:0 20px 42px rgba(120,95,160,.22)}
.file:active{transform:translateY(1px)}
.file::before{content:"";position:absolute;left:18px;right:18px;top:0;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--orchid),transparent);opacity:.7}
.f-top{display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-family:"Oswald";font-size:9px;font-weight:600;letter-spacing:.22em;
  text-transform:uppercase;color:var(--violet)}
.f-tag{flex:none;padding:3px 9px;border-radius:999px;font-size:8px;letter-spacing:.16em;
  border:1px solid var(--line);color:var(--ink2);background:rgba(255,255,255,.6)}
.f-tag.on{border-color:transparent;color:#fff;
  background:linear-gradient(120deg,var(--violet),var(--orchid))}
.f-name{font-family:"Cormorant Garamond",Georgia,serif;font-size:23px;font-weight:600;
  font-style:italic;margin:8px 0 0;color:var(--ink);line-height:1.2}
.f-desc{margin:7px 0 0;font-size:12.5px;line-height:1.6;color:var(--ink2)}
.f-go{display:flex;align-items:center;gap:7px;margin-top:12px;
  font-family:"Oswald";font-size:9.5px;font-weight:600;letter-spacing:.2em;
  text-transform:uppercase;color:var(--orchid)}

/* ── chân trang: về bản đồ · tem ── */
.foot{position:relative;z-index:5;flex:none;display:flex;align-items:center;
  justify-content:space-between;gap:8px;padding:0 clamp(18px,5vw,24px) 22px}
.back{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);
  background:rgba(255,255,255,.5);border-radius:999px;padding:9px 14px;cursor:pointer;
  font-family:"Oswald";font-size:9.5px;font-weight:500;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink2)}
.back:hover{border-color:var(--orchid);color:var(--ink)}
.stamp{font-family:"Oswald";font-size:7.5px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(122,103,149,.5);text-align:right;line-height:1.5}
</style>
</head>
<body>
<div id="app">
<div class="frame" id="frame">
  <span class="corner tl"></span><span class="corner tr"></span>
  <span class="corner bl"></span><span class="corner br"></span>
  <canvas id="sakura" aria-hidden="true"></canvas>
  <div class="classtag">Hồ sơ cá nhân · No.961030<b>Honghandangiu</b></div>

  <div class="wrap">
    <div class="eyebrow"><i></i></div>
    <h1 class="title"><b>Hồ sơ HAN-961030</b>Hai phần, mở lần lượt</h1>
    <p class="lead" id="lead">Chọn phần muốn xem, hoặc quay về <b>Bản đồ tác chiến</b> ✦</p>

    <div class="files">
      <button class="file" id="goA" type="button">
        <span class="f-top"><span>HAN-961030-A</span><span class="f-tag on" id="tagA">Đang mở</span></span>
        <p class="f-name">Who’s my kindred spirit?</p>
        <p class="f-desc" id="dA">Bộ câu hỏi về Honghandangiu — trả lời đúng hết thì được cấp mã vào phần B.</p>
        <span class="f-go">Vào phần câu hỏi &#8594;</span>
      </button>

      <button class="file" id="goB" type="button">
        <span class="f-top"><span>HAN-961030-B</span><span class="f-tag" id="tagB">Cần mã</span></span>
        <p class="f-name">HongHan’s Secret Box</p>
        <p class="f-desc" id="dB">Hộp niêm phong. Mã nằm ở màn cuối của phần A.</p>
        <span class="f-go">Mở hộp bí mật &#8594;</span>
      </button>
    </div>
  </div>

  <div class="foot">
    <button class="back" id="back" type="button">&#8592; Bản đồ</button>
    <span class="stamp" id="stamp" data-base="HAN-961030 · V1.00<br>Last updated 13-Aug-2026"></span>
  </div>
</div>
</div>

<img src="/api/ping?ev=tai_trang&detail=han-hub" alt="" width="1" height="1"
     style="position:absolute;left:0;top:0;opacity:0;pointer-events:none" aria-hidden="true">

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var HREF_A = '/han/961030-a', HREF_B = '/han/961030-b', HREF_MAP = '/';

/* Đọc tiến trình chung với hai trang kia để dán nhãn cho đúng trạng thái thật */
var st = (function(){
  var s = {};
  try{ s = JSON.parse(localStorage.getItem('hanv1') || '{}') || {}; }catch(e){}
  return { done: !!s.done, bOpen: !!s.bOpen, pos: s.pos|0, reset: s.reset|0 };
})();

function ping(ev, detail){
  try{
    var body = JSON.stringify({ ev:ev, detail:detail||'', at:new Date().toISOString(),
      solved:[], ua:navigator.userAgent.slice(0,120) });
    if(navigator.sendBeacon &&
       navigator.sendBeacon('/api/ping', new Blob([body],{type:'application/json'}))) return;
    fetch('/api/ping',{method:'POST',body:body,keepalive:true,
      headers:{'Content-Type':'application/json'}}).catch(function(){});
  }catch(e){}
}

/* Nhãn trạng thái: nói đúng chỗ người xem đang đứng, không hứa hão */
(function nhan(){
  var tA = $('tagA'), tB = $('tagB');
  if(st.done){ tA.textContent = 'Đã xong'; $('dA').textContent =
    'Đã trả lời đúng hết. Vào lại để xem mã, hoặc chơi lại từ đầu với thứ tự mới.'; }
  else if(st.pos > 0){ tA.textContent = 'Đang dở'; $('dA').textContent =
    'Đang ở câu ' + (st.pos + 1) + '. Vào tiếp là chơi đúng chỗ đang dừng.'; }
  if(st.bOpen){ tB.textContent = 'Đã mở'; tB.classList.add('on');
    $('dB').textContent = 'Đã mở khoá — vào thẳng, khỏi nhập mã lại.'; }
})();

$('stamp').innerHTML = $('stamp').dataset.base + (st.reset > 0 ? ' · R' + st.reset : '');

function di(href, ev, chi){
  ping(ev, chi || '');
  setTimeout(function(){ location.href = href; }, 140);
}
$('goA').addEventListener('click', function(){ di(HREF_A, 'han_hub_di', 'sang phần A'); });
$('goB').addEventListener('click', function(){ di(HREF_B, 'han_hub_di', 'sang phần B'); });
$('back').addEventListener('click', function(){ di(HREF_MAP, 'han_ve_ban_do', 'từ màn chọn hồ sơ'); });
ping('han_hub', st.done ? 'đã xong phần A' : 'câu ' + (st.pos + 1));

/* ═══════════ HOA ANH ĐÀO — cùng bộ với 961030-a ═══════════ */
(function sakura(){
  var cv = $('sakura'), ctx = cv.getContext('2d');
  var W = 0, H = 0, dpr = Math.min(devicePixelRatio || 1, 2);
  var it = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var MAU = ['#F8C8D8', '#F5BCBA', '#FBD9E4', '#F3DCDC', '#EFC7E4', '#E9C4EE'];
  var hoa = [], N = 0;

  function co(){
    var r = cv.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    N = Math.max(74, Math.min(150, Math.round(W * H / 3400)));
    while(hoa.length < N) hoa.push(moi(true));
    hoa.length = N;
  }
  function moi(bat){
    return {
      x: -20 + Math.random()*(W + 40),
      y: bat ? Math.random()*H : -14 - Math.random()*70,
      r: 4.5 + Math.random()*7,
      vy: 0.42 + Math.random()*0.95,
      vx: -0.10 - Math.random()*0.30,
      sw: 0.6 + Math.random()*1.5,
      ph: Math.random()*6.28,
      sp: 0.012 + Math.random()*0.026,
      go: Math.random()*6.28,
      mau: MAU[(Math.random()*MAU.length)|0],
      mo: 0.4 + Math.random()*0.5
    };
  }
  function canh(h, lat){
    var r = h.r;
    ctx.beginPath();
    ctx.moveTo(0, -r);
    ctx.bezierCurveTo(r*0.75, -r*0.72, r*0.62, r*0.5, 0, r);
    ctx.bezierCurveTo(-r*0.62, r*0.5, -r*0.75, -r*0.72, 0, -r);
    ctx.closePath();
    var g = ctx.createLinearGradient(0, -r, 0, r);
    g.addColorStop(0, '#FFFFFF'); g.addColorStop(1, h.mau);
    ctx.fillStyle = g;
    ctx.globalAlpha = h.mo * (0.5 + 0.5*lat);
    ctx.fill();
    ctx.strokeStyle = 'rgba(196,132,172,.34)';
    ctx.lineWidth = 0.7;
    ctx.globalAlpha *= 0.9;
    ctx.stroke();
  }
  var t = 0;
  function ve(){
    ctx.clearRect(0, 0, W, H);
    t++;
    for(var i = 0; i < hoa.length; i++){
      var h = hoa[i];
      h.y += h.vy;
      h.x += h.vx + Math.sin((t*0.01) + h.ph) * h.sw * 0.45;
      h.go += h.sp;
      if(h.x < -40) h.x = W + 40;
      else if(h.x > W + 40) h.x = -40;
      if(h.y > H + 24){ hoa[i] = moi(false); continue; }
      var lat = Math.abs(Math.cos(h.go));
      ctx.save();
      ctx.translate(h.x, h.y);
      ctx.rotate(Math.sin(h.go*0.7) * 0.95);
      ctx.scale(0.22 + lat*0.78, 1);
      canh(h, lat);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(ve);
  }
  co();
  addEventListener('resize', co, {passive:true});
  if(it) for(var k = 0; k < hoa.length; k++){ hoa[k].vy = 0; hoa[k].vx = 0; hoa[k].sp = 0; }
  ve();
})();
})();
</script>
</body>
