<style>
/* ============================================================
   HAN-961030-A — THEME "SAKURA"
   Dùng lại KHUNG của bản đồ tác chiến (frame, góc kẻ tay, tem phân loại,
   ô nhập từng ký tự, tem phiên bản góc dưới, cửa hậu bấm nhiều nhịp) nhưng
   đổi hẳn bảng màu sang pastel sáng. Chất "cyber" giữ ở Oswald viết hoa
   giãn rộng; chất mềm nằm ở serif Cormorant, bo góc lớn và cánh hoa rơi.
   ============================================================ */
/* SỔ PHIÊN BẢN mượn màu Zoey's Castle — nền sáng, chữ tím mực.
   Xem /assets/lichsu.js. */
:root{--ls-bg:linear-gradient(180deg,#FFFFFF 0%,#F6EDFB 100%);--ls-fg:#3E2F56;
  --ls-mo:#7A6795;--ls-line:rgba(122,103,149,.24);--ls-acc:#B57ACB;
  --ls-w:min(330px,92vw)}
:root{
  --lav:#F4E7FB;    --blush:#F3DCDC;  --coral:#F5BCBA;
  --orchid:#E3AADD; --violet:#C8A8E9; --peri:#C3C7F3;
  --ink:#3E2F56;                    /* chữ chính — tím mực, không dùng đen */
  --ink2:#7A6795;                   /* chữ phụ */
  --line:rgba(122,103,149,.20);
  --card:rgba(255,255,255,.68);
  --ok:#8E6FC7;
  --bad:#C2748A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#EFE6F7;color:var(--ink);
  font-family:"Be Vietnam Pro",system-ui,"Noto Sans",sans-serif;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
#app{width:100%;height:100%;display:flex;align-items:center;justify-content:center}

.frame{position:relative;width:100%;height:100%;display:flex;flex-direction:column;
  overflow:hidden;
  background:
    radial-gradient(120% 80% at 12% 4%, #FFF6FB 0%, rgba(255,246,251,0) 55%),
    radial-gradient(100% 70% at 92% 8%, #E9DEFB 0%, rgba(233,222,251,0) 60%),
    radial-gradient(120% 90% at 50% 108%, #F7D9DE 0%, rgba(247,217,222,0) 62%),
    linear-gradient(168deg, #F4E7FB 0%, #EDE4FA 42%, #F6E3EC 100%)}
@media (min-width:480px){
  body{background:linear-gradient(160deg,#E7DCF4,#F6E6EC)}
  .frame{max-width:460px;max-height:940px;height:92vh;border-radius:26px;
    box-shadow:0 30px 80px rgba(94,72,133,.22)}
}
.corner{position:absolute;width:20px;height:20px;border-color:rgba(122,103,149,.34);z-index:6}
.corner.tl{top:13px;left:13px;border-top:2px solid;border-left:2px solid}
.corner.tr{top:13px;right:13px;border-top:2px solid;border-right:2px solid}
.corner.bl{bottom:13px;left:13px;border-bottom:2px solid;border-left:2px solid}
.corner.br{bottom:13px;right:13px;border-bottom:2px solid;border-right:2px solid}

/* BẪY ĐÃ VẤP: <canvas> là phần tử thay thế (replaced element) — có kích thước
   nội tại 300×150. Chỉ đặt inset:0 mà không cho width/height thì nó KHÔNG giãn
   ra, cứ nằm 300×150 ở góc trái trên. Hoa vẫn rơi đủ, nhưng chỉ rơi trong cái
   ô bé xíu đó nên nhìn như hoa chỉ có ở đỉnh trang. Bắt buộc 100%/100%. */
#sakura{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

/* BẪY: hộp đặt absolute với left:50% thì bề rộng khả dụng chỉ còn NỬA khung,
   nên chữ tự xuống dòng sớm và rớt lại một chữ lẻ. width:max-content mới cho nó
   rộng theo đúng nội dung. */
.classtag{position:absolute;top:13px;left:50%;transform:translateX(-50%);z-index:6;
  width:max-content;max-width:min(84vw,300px);
  padding:6px 14px;border:1px solid var(--line);border-radius:5px;
  background:rgba(255,255,255,.55);backdrop-filter:blur(6px);
  font-family:"Oswald";font-size:8.5px;font-weight:500;letter-spacing:.24em;
  text-transform:uppercase;color:var(--ink2);text-align:center;line-height:1.7}
.classtag b{display:block;font-weight:600;color:var(--orchid);letter-spacing:.18em}

.wrap{position:relative;z-index:4;flex:1;min-height:0;display:flex;flex-direction:column;
  padding:64px clamp(20px,6vw,28px) 16px;overflow-y:auto;overscroll-behavior:contain}
.wrap::-webkit-scrollbar{width:0}

.eyebrow{display:flex;align-items:center;gap:12px;margin:8px 0 10px}
.eyebrow::before,.eyebrow::after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,rgba(227,170,221,.06),rgba(227,170,221,.6))}
.eyebrow::after{background:linear-gradient(90deg,rgba(227,170,221,.6),rgba(227,170,221,.06))}
.eyebrow i{width:5px;height:5px;background:var(--orchid);transform:rotate(45deg);
  border-radius:1px;display:block}

h1.title{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-style:italic;
  margin:0;font-size:clamp(25px,7.2vw,33px);line-height:1.12;color:var(--ink);
  text-wrap:balance}
h1.title b{display:block;font-style:normal;font-family:"Oswald";font-weight:600;
  font-size:clamp(11px,3.2vw,13px);letter-spacing:.3em;text-transform:uppercase;
  color:var(--violet);margin-bottom:9px}
.lead{margin:11px 0 0;font-size:12.5px;line-height:1.62;color:var(--ink2)}
.lead b{color:var(--ink)}
/* Chữ và chìa khoá đi CHUNG MỘT HÀNG: icon không được rớt xuống dòng riêng,
   nên cụm này là inline-flex và chữ tự co cỡ ở màn hẹp. */
.lead-1{display:inline-flex;align-items:center;gap:7px;flex-wrap:nowrap;
  white-space:nowrap;font-size:12px}
.ico-key{width:16px;height:22px;flex:none}   /* chìa dựng DỌC */
.ico-key .lap{fill:#F7C6E4}
.ico-key .lap{animation:lapLanh 1.7s ease-in-out infinite}
.ico-key .lap.l2{animation-delay:.55s;fill:#FBD9EE}
@keyframes lapLanh{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
@media(max-width:400px){.lead-1{font-size:11px;gap:6px}
  .ico-key{width:14px;height:19px}}
@media(max-width:340px){.lead-1{font-size:10px}}

/* ── thanh tiến độ theo số câu ── */
.steps{display:flex;align-items:center;gap:6px;margin:18px 0 2px}
.step{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.step .bar{height:3px;border-radius:2px;background:rgba(122,103,149,.16);overflow:hidden}
.step .bar i{display:block;height:100%;width:0;border-radius:2px;
  background:linear-gradient(90deg,var(--violet),var(--orchid));
  transition:width .7s cubic-bezier(.4,.9,.3,1)}
.step.done .bar i{width:100%}
.step.cur .bar i{width:50%;animation:barPulse 2.4s ease-in-out infinite}
.step.lock .bar i{width:100%;background:rgba(194,116,138,.5)}
@keyframes barPulse{0%,100%{opacity:.55}50%{opacity:1}}
.step span{font-family:"Oswald";font-size:7.5px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(122,103,149,.55);text-align:center}
.step.done span,.step.cur span{color:var(--violet)}
.step.lock span{color:rgba(194,116,138,.8)}

/* ── thẻ ── */
.card{position:relative;margin-top:18px;padding:22px 20px 20px;border-radius:18px;
  border:1px solid rgba(255,255,255,.85);background:var(--card);
  backdrop-filter:blur(14px);box-shadow:0 18px 44px rgba(120,95,160,.16)}
.card::before{content:"";position:absolute;left:20px;right:20px;top:0;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--orchid),transparent);opacity:.7}
.q-lab{display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-family:"Oswald";font-size:9px;font-weight:600;letter-spacing:.22em;
  text-transform:uppercase;color:var(--violet);margin:0 0 9px}
.q-lab em{font-style:normal;color:rgba(122,103,149,.6);letter-spacing:.12em}
.q-txt{font-family:"Cormorant Garamond",Georgia,serif;font-size:19px;line-height:1.34;
  font-weight:600;margin:0;color:var(--ink);text-wrap:pretty}

.cells{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;
  margin:18px 0 2px;cursor:text}
.crow{display:flex;justify-content:center}   /* mỗi hàng tự căn giữa */
.cell{height:30px;display:flex;align-items:center;justify-content:center;
  font-family:"Oswald";color:var(--ink);
  border-bottom:2px solid rgba(200,168,233,.75);transition:border-color .25s}
.cell.on{border-bottom-color:var(--orchid)}
.cell.fill{border-bottom-color:var(--violet)}
/* Ký tự VỪA GÕ ở cửa mã hiện nguyên hình một nhịp rồi mới thành chấm. Che ngay
   từ phím đầu thì gõ nhầm một chữ là phải xoá cả dòng mò lại, vì chẳng biết
   nhầm ô nào. Phần câu hỏi không che gì cả — đó là đáp án đang soạn, còn phải
   xem lại được, không phải mật mã. */
.cell.ro{color:var(--orchid)}
.inp{position:absolute;inset:0;width:100%;height:100%;opacity:.01;border:none;
  background:none;color:transparent;caret-color:transparent;font-size:16px;outline:none}

.msg{min-height:19px;margin:13px 2px 0;font-size:12.5px;line-height:1.6;text-align:center;
  color:var(--bad)}
.msg:empty{min-height:4px;margin-top:0}
.msg.ok{color:var(--ok)}
/* Nhấp nháy đúng dải màu Easter Egg ngoài bản đồ — dùng cho lúc trả lời đúng */
.msg.egg{animation:eggHan 1.8s linear 3;font-weight:600}
@keyframes eggHan{
  0%{color:#F2B441}20%{color:#7BD88F}40%{color:#8FD9F5}
  60%{color:#C79BF0}80%{color:#FF9AA8}100%{color:#F2B441}}
.msg.hint{color:var(--ink2)}

.hints{margin:14px 0 0;padding:0;list-style:none;font-size:12.5px;line-height:1.8;color:var(--ink2)}
.hints:empty{margin:0}
.hints li{margin-bottom:2px}
.hints li::before{content:"✦ ";color:var(--orchid)}
.hints li b{color:var(--ink);font-weight:600}
.wait{margin-top:10px;font-size:11.5px;color:rgba(122,103,149,.65);
  font-variant-numeric:tabular-nums}
.wait b{color:var(--violet)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  margin-top:14px;padding:13px 16px;border:none;border-radius:999px;cursor:pointer;
  font-family:"Oswald";font-size:11px;font-weight:600;letter-spacing:.2em;
  text-transform:uppercase;color:#fff;
  background:linear-gradient(120deg,var(--violet),var(--orchid) 60%,var(--coral));
  box-shadow:0 12px 26px rgba(180,140,220,.4);transition:transform .18s,box-shadow .25s}
.btn:hover{box-shadow:0 16px 32px rgba(180,140,220,.5)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:none;color:var(--ink2);border:1px solid var(--line);
  box-shadow:none;font-size:10px}
.sos{position:absolute;bottom:8px;left:12px;border:none;background:none;cursor:pointer;
  font-family:"Oswald";font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;
  color:rgba(200,168,233,.9);padding:9px 6px}
.card.haspin{padding-bottom:40px}

.pin-show{display:flex;align-items:center;justify-content:center;gap:7px;margin:16px 0 2px}
.pin-show i{width:32px;height:42px;display:flex;align-items:center;justify-content:center;
  border-radius:10px;font-family:"Oswald";font-size:19px;font-weight:600;font-style:normal;
  color:#fff;background:linear-gradient(150deg,var(--violet),var(--orchid));
  box-shadow:0 10px 22px rgba(180,140,220,.4)}
.done-tit{font-family:"Cormorant Garamond",Georgia,serif;font-size:25px;font-weight:600;
  font-style:italic;margin:0 0 8px;text-align:center;color:var(--ink)}
.done-txt{font-size:13px;line-height:1.68;text-align:center;color:var(--ink2);text-wrap:balance}
/* ── HAI NÚT PHỤ Ở MÀN HOÀN THÀNH ────────────────────────────────────────
   Trước đây "Xem lại các câu" và "Reset toàn bộ" là hai NÚT DÀI hết chiều
   ngang, xếp ngay dưới nút chính. Ba thanh chồng nhau nhìn nặng, mà hai việc
   phụ lại to ngang việc chính — mắt không biết bấm cái nào.
   Nay gọn thành hai biểu tượng nhỏ nằm ngang, đúng kiểu mấy hộp khác trong
   bộ (nút cuộn phim ở khung Collected, hai nút tròn ở màn phát mã Gate 2).
   Chữ đầy đủ chuyển vào `title` + `aria-label` nên vẫn đọc được khi rê chuột
   và trình đọc màn hình vẫn hiểu. */
.done-ico{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:16px}
.done-ico button{width:42px;height:42px;flex:none;display:flex;align-items:center;
  justify-content:center;border-radius:50%;border:1px solid var(--line);
  background:none;color:var(--ink2);font-size:17px;line-height:1;cursor:pointer;
  transition:color .18s,border-color .18s,transform .12s}
.done-ico button:hover{color:var(--ink);border-color:var(--orchid)}
.done-ico button:active{transform:translateY(1px)}
/* Nút reset khi đã "lên cò" (bấm lần một) — đỏ lên cho biết lần nữa là xoá */
.done-ico button.armed{color:var(--bad);border-color:var(--bad)}
/* Nét vẽ trong nút: mặc định là NÉT VIỀN (con mắt), riêng mũi tên quay vòng vẽ
   bằng mảng đặc nên phải đảo lại — xem DESIGN-SYSTEM.md §1. */
.done-ico button svg{width:18px;height:18px;display:block;
  fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.done-ico button svg.fill{fill:currentColor;stroke:none}
/* Chú thích nổi phía DƯỚI nút — trên đầu là chỗ của thẻ mã PIN. Cùng một khuôn
   với chú thích của hộp pí mật ngoài bản đồ và của Easter Egg Gate 2. */
.done-ico .tip{position:relative}
.done-ico .tip::after{
  content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:50%;
  transform:translate(-50%,-4px);white-space:nowrap;
  font-size:10.5px;line-height:1.3;color:var(--ink);
  background:#FFFFFF;border:1px solid var(--line);box-shadow:0 6px 18px rgba(62,47,86,.14);
  border-radius:5px;padding:5px 9px;
  opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:9}
.done-ico .tip:hover::after,.done-ico .tip:focus-visible::after{
  opacity:1;transform:translate(-50%,0)}
/* Dòng trao mã: chìa khoá đi CHUNG MỘT HÀNG với chữ, không cho rớt xuống dòng
   riêng — chìa nằm lửng một mình trông như lỗi hiển thị chứ không như một nhãn. */
.done-txt.sec{display:flex;align-items:center;justify-content:center;gap:8px;
  flex-wrap:nowrap;white-space:nowrap}
.done-txt.sec b{color:var(--ink);font-weight:600}
@media(max-width:380px){.done-txt.sec{font-size:11.5px;gap:6px}}
@media(max-width:330px){.done-txt.sec{font-size:10.5px}}
/* ── MÀN HOÀN THÀNH · DỌN CHO GỌN ───────────────────────────────────────────
   Xong hết câu rồi thì hàng thanh tiến độ hết việc (thanh nào cũng đầy như
   nhau), dòng dẫn "Thu thập chìa khoá..." cũng hết việc, và tiêu đề
   "Who's my kindred spirit?" thì càng — câu hỏi đã trả lời xong cả rồi.
   Ba thứ đó chỉ còn làm mỗi một việc: đẩy tấm thẻ mã PIN — thứ DUY NHẤT người
   chơi vào đây để xem — lệch hẳn xuống nửa dưới khung. Giấu cả cụm đi, thẻ nằm
   đúng giữa. `safe center` để khi thẻ cao hơn khung (màn hẹp, bàn phím bật)
   thì tự lùi về canh trên, không nuốt mất phần đầu thẻ; trình duyệt cũ không
   hiểu thì bỏ nguyên dòng này và giữ y như cũ, cũng không vỡ gì. */
.wrap.gon{justify-content:safe center}
.wrap.gon .eyebrow,.wrap.gon h1.title,.wrap.gon .lead,.wrap.gon .steps{display:none}
/* Màn hết lượt: một dòng số, không giảng giải */
/* Câu chào + bộ icon đi CHUNG MỘT HÀNG, chữ ĐỨNG (không nghiêng) và nhỏ hơn
   tiêu đề thường. Cỡ chữ do khitChao() hạ dần cho vừa, nên không đặt cỡ cứng. */
.done-tit.chao{display:flex;align-items:center;justify-content:center;gap:8px;
  white-space:nowrap;margin-bottom:0;font-style:normal;font-weight:600}
.ico-hang{font-size:.68em;letter-spacing:.08em;line-height:1;flex:none;
  font-style:normal}
.retry{margin-top:10px;text-align:center;font-family:"Oswald";font-size:10px;
  font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2)}
.retry b{color:var(--bad);font-weight:600}
/* Nhãn "Phá Đảo Lòng EM" + ba trái tim nhấp nháy so le */
.q-lab.pha{gap:8px;color:var(--orchid);letter-spacing:.24em}
.tim{display:inline-flex;gap:3px;flex:none}
.tim i{font-style:normal;font-size:12px;line-height:1;color:#E2718F;
  animation:timNhay 1.35s ease-in-out infinite}
.tim i:nth-child(2){animation-delay:.18s}
.tim i:nth-child(3){animation-delay:.36s}
@keyframes timNhay{0%,100%{opacity:.28;transform:scale(.88)}50%{opacity:1;transform:scale(1.12)}}
/* Một câu đã trả lời xong: câu hỏi nhỏ ở trên, đáp án đậm ở dưới */
/* Hai mũi tên chuyển câu — đặt sát hai mép đáy thẻ, giữa là số câu.
   Cố ý nhạt và không viền: đây là thứ để lướt, không phải nút chính. */
.qnav{display:flex;align-items:center;justify-content:space-between;
  margin:14px -4px -2px}
.qnav-a{border:none;background:none;cursor:pointer;padding:4px 12px;
  font-family:"Oswald";font-size:22px;line-height:1;font-weight:400;
  color:rgba(200,168,233,.95);transition:color .18s,transform .18s}
.qnav-a:hover{color:var(--violet)}
.qnav-a:active{transform:scale(.9)}
.qnav-n{font-family:"Oswald";font-size:9px;font-weight:600;letter-spacing:.22em;
  color:rgba(122,103,149,.55)}
/* Khung ảnh chào mừng — cùng khuôn chữ nhật 16:9 với hộp chào ngoài bản đồ,
   chỉ đổi sang tông pastel của Map 3. Ảnh nặng nên chỉ có mặt ở màn hoàn thành,
   không nạp sẵn ở đâu khác. */

/* ═══════════ 4. HOA ANH ĐÀO RƠI — phủ rộng hơn cả khung ═══════════
   Cánh hoa sinh ra từ mép trên VÀ mép phải, bay chéo xuống trái nên vệt hoa
   trải kín mặt trang chứ không rơi thẳng một dải. Mỗi cánh vẽ bằng hai cung
   bezier, xoay quanh trục dọc để lúc mỏng lúc dày như đang lật trong gió. */
(function sakura(){
  var cv = $('sakura'), ctx = cv.getContext('2d');
  var W = 0, H = 0, dpr = Math.min(devicePixelRatio || 1, 2);
  var it = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var MAU = ['#F8C8D8', '#F5BCBA', '#FBD9E4', '#F3DCDC', '#EFC7E4', '#E9C4EE'];
  var hoa = [], N = 0;

  function co(){
    var r = cv.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    /* Mật độ theo diện tích thật của khung: cánh phủ kín trang, không lác đác. */
    N = Math.max(74, Math.min(150, Math.round(W * H / 3400)));
    while(hoa.length < N) hoa.push(moi(true));
    hoa.length = N;
  }
  function moi(bat){
    return {
      /* Sinh mới luôn ở mép TRÊN, trải hết bề ngang. Lần đầu (bat) thì rải sẵn
         khắp chiều cao để trang vừa mở đã có hoa ở cả trên lẫn dưới. */
      x: -20 + Math.random()*(W + 40),
      y: bat ? Math.random()*H : -14 - Math.random()*70,
      r: 4.5 + Math.random()*7,
      /* Gió nhẹ: dạt trái chậm hơn tốc độ rơi nhiều lần nên cánh đi hết chiều dọc
         trang mới ra khỏi mép — nửa dưới không còn trống. */
      vy: 0.42 + Math.random()*0.95,
      vx: -0.10 - Math.random()*0.30,
      sw: 0.6 + Math.random()*1.5,
      ph: Math.random()*6.28,
      sp: 0.012 + Math.random()*0.026,
      go: Math.random()*6.28,
      mau: MAU[(Math.random()*MAU.length)|0],
      mo: 0.4 + Math.random()*0.5
    };
  }
  function canh(h, lat){
    var r = h.r;
    ctx.beginPath();
    ctx.moveTo(0, -r);
    ctx.bezierCurveTo(r*0.75, -r*0.72, r*0.62, r*0.5, 0, r);
    ctx.bezierCurveTo(-r*0.62, r*0.5, -r*0.75, -r*0.72, 0, -r);
    ctx.closePath();
    var g = ctx.createLinearGradient(0, -r, 0, r);
    g.addColorStop(0, '#FFFFFF'); g.addColorStop(1, h.mau);
    ctx.fillStyle = g;
    ctx.globalAlpha = h.mo * (0.5 + 0.5*lat);
    ctx.fill();
    /* Viền mảnh: nửa dưới trang nền đã ngả hồng, cánh trắng-hồng không viền thì
       chìm hẳn — đo thấy cánh vẫn ở đó mà mắt không nhận ra. */
    ctx.strokeStyle = 'rgba(196,132,172,.34)';
    ctx.lineWidth = 0.7;
    ctx.globalAlpha *= 0.9;
    ctx.stroke();
  }
  var t = 0;
  function ve(){
    ctx.clearRect(0, 0, W, H);
    t++;
    for(var i = 0; i < hoa.length; i++){
      var h = hoa[i];
      h.y += h.vy;
      h.x += h.vx + Math.sin((t*0.01) + h.ph) * h.sw * 0.45;
      h.go += h.sp;
      /* Ra khỏi mép trái thì VÒNG sang mép phải chứ không thay cánh mới: cánh chỉ
         rời cuộc khi chạm đáy, nên mật độ đều từ đỉnh xuống chân trang. */
      if(h.x < -40) h.x = W + 40;
      else if(h.x > W + 40) h.x = -40;
      if(h.y > H + 24){ hoa[i] = moi(false); continue; }
      var lat = Math.abs(Math.cos(h.go));
      ctx.save();
      ctx.translate(h.x, h.y);
      ctx.rotate(Math.sin(h.go*0.7) * 0.95);
      ctx.scale(0.22 + lat*0.78, 1);
      canh(h, lat);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(ve);
  }
  co();
  addEventListener('resize', co, {passive:true});
  if(it) for(var k = 0; k < hoa.length; k++){ hoa[k].vy = 0; hoa[k].vx = 0; hoa[k].sp = 0; }
  ve();
})();

/* ═══════════ 5. SO KHỚP ═══════════ */
function norm(s){
  s = (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[đĐ]/g,'d');
  return s.toUpperCase().replace(/[^A-Z0-9]/g,'');
}

/* ═══════════ 6. TEM PHIÊN BẢN — cùng logic với bản đồ ═══════════
   Chuỗi gốc ở data-base, hàm này ghép thêm "· R(n)" khi đã reset ít nhất một lần. */
/* Tem lấy từ SỔ; chuỗi cứng `data-base` chỉ là bản lùi khi lichsu.js không

/* ═══════════ 7. GIAO DIỆN ═══════════ */
/* Chìa khoá hồng công chúa — lấp lánh bằng hai ngôi sao nhỏ nhấp nháy so le.
   Vẽ tay bằng SVG để nó nằm CÙNG MỘT HÀNG với chữ, canh đúng đường chân chữ;
   emoji 🔑 thì mỗi máy một cỡ, một màu, và hay tự rớt xuống dòng. */
/* Chìa khoá hồng công chúa — DỰNG DỌC, tay cầm ở trên, răng khoá ở dưới, đúng
   dáng một chiếc chìa treo. Hai ngôi sao nhỏ nhấp nháy so le cho lấp lánh.
   Vẽ tay bằng SVG chứ không dùng emoji 🔑: emoji mỗi máy một cỡ, một màu, không
   xoay dọc được, và hay tự rớt xuống dòng riêng. */
/* ── CHÌA KHOÁ ──────────────────────────────────────────────────────────────
   MỖI LẦN GỌI PHẢI CÓ MỘT ID GRADIENT RIÊNG. Trang này vẽ chìa ở hai chỗ —
   dòng dẫn trên đầu và dòng trao mã ở màn hoàn thành. Để chung id="kg" thì cả
   hai cái `url(#kg)` đều trỏ vào ĐỊNH NGHĨA ĐẦU TIÊN trong trang; mà ở màn
   hoàn thành, dòng dẫn đang bị `.wrap.gon` giấu bằng display:none, nên cái
   định nghĩa đầu tiên nằm trong một khối không được vẽ → trình duyệt trả về
   "không có màu", chìa mất sạch nét, chỉ còn hai chấm lấp lánh trơ ra.
   Đánh số tăng dần là mỗi chìa tự mang màu của mình đi, giấu cái nào cũng
   không ảnh hưởng cái còn lại.                                              */
var khoaN = 0;
function icoKhoa(){
  var g = 'kg' + (++khoaN);
  return '<svg class="ico-key" viewBox="0 0 16 22" aria-hidden="true">'
    + '<circle cx="8" cy="6" r="3.7" fill="none" stroke="url(#'+g+')" stroke-width="1.7"/>'
    + '<path d="M8 9.7V19M8 16.4h3.1M8 13.4h2.2" fill="none" stroke="url(#'+g+')"'
    + ' stroke-width="1.7" stroke-linecap="round"/>'
    + '<path class="lap" d="M14.2 2.1l.5 1.35 1.35.5-1.35.5-.5 1.35-.5-1.35-1.35-.5'
    + ' 1.35-.5z"/><path class="lap l2" d="M1.9 15.2l.38 1 1 .38-1 .38-.38 1'
    + '-.38-1-1-.38 1-.38z"/>'
    + '<defs><linearGradient id="'+g+'" x1="0" y1="0" x2="1" y2="1">'
    + '<stop offset="0" stop-color="#F2A7D0"/><stop offset="1" stop-color="#D97BB6"/>'
    + '</linearGradient></defs></svg>';
}
/* ═══ CO CHỮ CHO VỪA KHUNG ═══
   Một dòng `nowrap` mà dài hơn khung thì TRÀN RA NGOÀI mép thẻ — đo mới biết,
   nhìn thì không. Hàm này hạ cỡ chữ dần từ `to` xuống `nho`, dừng ở cỡ lớn
   nhất còn vừa. Dùng chung cho dòng dẫn, câu chào, và câu hỏi. */
function khit(el, box, to, nho, buoc){
  if(!el || !box) return;
  var rong = box.getBoundingClientRect().width;
  for(var px = to; px >= nho; px -= (buoc || 0.5)){
    el.style.fontSize = px + 'px';
    if(el.scrollWidth <= rong + 0.5 && el.getBoundingClientRect().width <= rong + 0.5) return;
  }
}
function khitLead(){ khit(document.querySelector('.lead-1'), $('lead'), 12, 9); }
function khitChao(){ khit($('chaoLai'), $('chaoLai') && $('chaoLai').parentNode, 21, 13, 1); }
/* CÂU HỎI: chữ serif 19px, câu dài thì tự nhỏ lại cho gọn TỐI ĐA HAI HÀNG.
   Bản trước để `text-wrap:balance` ở cỡ cố định nên câu dài bị bẻ vào giữa cụm
   từ — "Tên một Manga Nhật / Bản mà em yêu thích?" — đọc rất khó chịu. */
function khitHoi(){
  var e = document.querySelector('.q-txt');
  if(!e) return;
  var mot = parseFloat(getComputedStyle(e).lineHeight) || 26;
  for(var px = 19; px >= 14; px -= 0.5){
    e.style.fontSize = px + 'px';
    mot = parseFloat(getComputedStyle(e).lineHeight) || px*1.34;
    if(e.getBoundingClientRect().height <= mot*2 + 1) return;
  }
}
/* Bật chế độ gọn của màn hoàn thành (xem `.wrap.gon` bên CSS). Mọi màn khác
   gọi lại với `false` để trả bố cục về như cũ. */
function gonLai(bat){
  var w = document.querySelector('.wrap');
  if(w) w.classList.toggle('gon', !!bat);
}
function drawLead(){
  /* KHÔNG viết số câu vào đây. Bộ câu hỏi sẽ còn dài ra, mà dòng này lại là chỗ
     người ta đọc đầu tiên — ghi "6/6" hôm nay thì mai thêm câu là nói dối.
     Số câu chỉ hiện ở MỘT chỗ duy nhất: nhãn "Câu n / TONG" trên đầu thẻ, và
     thanh bước ngay dưới. Cả hai đều đọc từ TONG. */
  $('lead').innerHTML = st.done
    ? '<span class="lead-1">' + icoKhoa() + 'Đủ chìa khoá rồi — mã mở <b>Secret Chamber</b> ở ngay dưới</span>'
    : '<span class="lead-1">' + icoKhoa() + 'Thu thập chìa khoá để mở <b>Secret Chamber</b></span>';
  khitLead();
}
function drawSteps(){
  var h = '';
  for(var i = 0; i < TONG; i++){
    var q = HOI[st.order[i]];
    var cls = st.done || xong1(q) ? 'done'
            : dangNghi(q) ? 'lock'
            : (st.pos === i ? 'cur' : '');
    h += '<div class="step ' + cls + '"><div class="bar"><i></i></div><span>' + (i+1) + '</span></div>';
  }
  $('steps').innerHTML = h;
}
/* Nhãn lượt trên đầu thẻ: phiên này còn mấy lần sai, và hôm nay còn mấy vòng */
function nhanLuot(q){
  var vong = Math.max(0, CHAY_NGAY - (st.chay[q.id]|0));
  return 'Còn ' + Math.max(0, conSai(q)) + '/' + SAI_PHIEN + ' lượt · ' + vong + '/' + CHAY_NGAY + ' vòng hôm nay';
}
var treuLast = -1;
function treu(){
  var i; do{ i = (Math.random()*TREU.length)|0; }while(TREU.length > 1 && i === treuLast);
  treuLast = i; return TREU[i];
}
function khen(){ return KHEN[(Math.random()*KHEN.length)|0]; }
/* Câu ghẹo khi bấm SOS lai rai — DÙNG CHUNG bộ TREU, khỏi nuôi hai danh sách
   rồi lệch giọng nhau. Tối đa 6 lần mỗi phiên, không lặp câu liền trước. */
var SOSGHEO = TREU;
var gheoLast = -1;
function gheo(){
  var n = 0;
  try{ n = +sessionStorage.getItem('hansos') || 0; }catch(e){}
  if(n >= 6) return '';
  var i; do{ i = (Math.random()*SOSGHEO.length)|0; }while(SOSGHEO.length > 1 && i === gheoLast);
  gheoLast = i;
  try{ sessionStorage.setItem('hansos', n + 1); }catch(e){}
  return SOSGHEO[i];
}
var tick = 0;
function clearTick(){ clearInterval(tick); tick = 0; }
/* Xoay ngang điện thoại là bề ngang đổi hẳn — ô đáp án phải xếp lại, không thì
   hàng đang vừa khít bỗng tràn ra ngoài thẻ. Chỉ MỘT trình nghe cho cả trang,
   màn nào đang mở thì màn đó đăng ký hàm xếp lại của mình. */
var xepLai = null;
var xepT = 0;
addEventListener('resize', function(){
  clearTimeout(xepT);
  xepT = setTimeout(function(){ khitLead(); khitChao(); khitHoi(); if(xepLai) xepLai(); }, 160);
}, {passive:true});

/* ---- xếp ô đáp án ----
   Yêu cầu: đáp án dài hay ngắn cũng phải nằm GỌN TRÊN MỘT HÀNG. Chỉ khi thu tới
   cỡ nhỏ nhất mà vẫn tràn mới xuống hàng, và lúc đó chia đều hai hàng, cắt ở ranh
   giới TỪ nếu ranh giới đó nằm gần giữa — "ALICE IN | BORDERLAND" chứ không cắt
   ngang giữa một từ. Mọi hàng dùng CHUNG một cỡ ô để nhìn không so le. */
var WMAX = 24, WMIN = 12;
function khop(n, ngap, avail){          /* n ô + ngap khoảng-cách-từ có vừa một hàng? */
  for(var w = WMAX; w >= WMIN; w--){
    var g  = w >= 20 ? 6 : (w >= 16 ? 4 : 3);   /* khe giữa hai ô */
    var gw = Math.round(w * 0.5);               /* khe giữa hai TỪ */
    if(n*w + (n-1)*g + ngap*gw <= avail) return { w:w, g:g, gw:gw };
  }
  return null;
}
function ngapTrong(gaps, a, b){         /* số ranh giới từ nằm HẲN trong [a,b) */
  var n = 0;
  for(var i = 0; i < gaps.length; i++) if(gaps[i] > a && gaps[i] < b) n++;
  return n;
}
function catDoi(len, gaps){
  /* Ưu tiên cắt ở RANH GIỚI TỪ gần giữa — "ALICE IN | BORDERLAND" đọc ra chữ,
     còn cắt đúng giữa cho cân thì thành "ALICEINBO | RDERLAND", chẳng ai nhận ra
     mình đang gõ chữ gì. Chỉ khi không có ranh giới từ nào đủ gần mới cắt đôi. */
  var giua = len/2, tot = 0, lech = 1e9, i, c, d;
  for(i = 0; i < gaps.length; i++){
    c = gaps[i]; d = Math.abs(c - giua);
    if(c > 0 && c < len && d <= len*0.34 && d < lech){ tot = c; lech = d; }
  }
  return tot || Math.ceil(giua);
}
function xepO(box, inp, code, gaps){
  var len = code.length;
  var avail = (box.clientWidth || 300) - 2;
  var hang = [[0, len]], do1 = khop(len, ngapTrong(gaps, 0, len), avail);
  var kt = do1;
  if(!do1){                              /* một hàng không nổi → chia đôi cho đều */
    var c = catDoi(len, gaps);
    hang = [[0, c], [c, len]];
    var a = khop(c, ngapTrong(gaps, 0, c), avail);
    var b = khop(len - c, ngapTrong(gaps, c, len), avail);
    kt = (a && b) ? (a.w <= b.w ? a : b) : (a || b || { w:WMIN, g:3, gw:6 });
  }
  var o = [];
  for(var r = 0; r < hang.length; r++){
    var row = document.createElement('div');
    row.className = 'crow';
    row.style.gap = kt.g + 'px';
    for(var k = hang[r][0]; k < hang[r][1]; k++){
      var cell = document.createElement('span');
      cell.className = 'cell';
      cell.style.width = kt.w + 'px';
      cell.style.fontSize = Math.max(11, Math.round(kt.w * 0.72)) + 'px';
      /* ranh giới từ ở ĐẦU hàng thì thôi, không thụt lề lệch cả hàng */
      if(gaps.indexOf(k) >= 0 && k > hang[r][0]) cell.style.marginLeft = kt.gw + 'px';
      row.appendChild(cell); o.push(cell);
    }
    box.insertBefore(row, inp);
  }
  return o;
}

/* ---- màn hỏi ----
   MỘT màn duy nhất cho cả ba trạng thái của một câu: đang chơi · đã trả lời
   đúng (xem lại) · đang nghỉ. Chuyển qua lại bằng hai mũi tên hai bên đáy thẻ.
   Xem lại KHÔNG dựng giao diện khác — vẫn đúng hàng ô như lúc nhập mật khẩu,
   chỉ khác là ô đã điền sẵn đáp án. Bản trước dựng hẳn một thẻ khoe đáp án
   riêng, nhìn cầu kỳ mà lại làm người chơi phải học thêm một bố cục nữa.
   `pos` bỏ trống = chơi câu tới lượt; có `pos` = mở đúng câu ở vị trí đó. */
function drawQ(pos){
  clearTick(); gonLai(false);
  var q;
  if(pos == null){
    if(soDung() >= TONG){ st.done = true; st.doneAt = st.doneAt || Date.now(); save(); xong(false); return; }
    q = timCau();
    if(!q){ drawLock(); return; }      /* cả bộ đang nghỉ */
    pos = st.pos;
  }else{
    pos = ((pos % TONG) + TONG) % TONG;
    q = HOI[st.order[pos]];
  }
  save();
  var xem  = xong1(q);                 /* đã đúng → chỉ xem lại */
  var nghi = !xem && dangNghi(q);      /* đang nghỉ → xem chứ chưa gõ được */
  var doc  = xem || nghi;              /* hai trạng thái này đều là CHỈ ĐỌC */
  var code = norm(q.a[0]), len = code.length, buf = doc && xem ? code : '';

  $('stage').innerHTML =
    '<div class="card haspin" id="card">'
    + '<p class="q-lab"><span>Câu ' + (pos+1) + ' / ' + TONG + '</span>'
    + '<em id="qTry">' + (xem ? 'Đã trả lời đúng ✦' : nhanLuot(q)) + '</em></p>'
    + '<p class="q-txt">' + q.q + '</p>'
    /* Gợi ý và đồng hồ đứng TRÊN ô nhập: đọc gợi ý rồi mới gõ, mắt không phải
       nhảy xuống dưới rồi ngược lên. Ô nhập luôn là thứ cuối cùng trước lời nhắn. */
    + '<ul class="hints" id="hints"></ul>'
    + '<div class="wait" id="wait"></div>'
    + '<div class="cells" id="cells">'
    + '<input class="inp" id="inp" type="text" autocomplete="off" autocapitalize="characters" '
    + 'autocorrect="off" spellcheck="false" aria-label="Ô nhập đáp án"'
    + (doc ? ' disabled tabindex="-1"' : '') + '></div>'
    + '<div class="msg" id="msg"></div>'
    + navHTML(pos)
    + (doc ? '' : '<button class="sos" id="sos" type="button">SOS</button>')
    + '</div>';
  navGan(pos);
  khitHoi();

  var box = $('cells'), inp = $('inp'), o = xepO(box, inp, code, q.gap);
  xepLai = function(){
    var cu = box.querySelectorAll('.crow');
    for(var i = cu.length - 1; i >= 0; i--) box.removeChild(cu[i]);
    o = xepO(box, inp, code, q.gap);
    paint();
  };
  function paint(){
    for(var k = 0; k < len; k++){
      o[k].textContent = buf[k] || '';
      /* Ô đang chờ gõ chỉ sáng khi còn gõ được — màn xem lại mà nhấp nháy con
         trỏ thì người ta lại tưởng gõ vào được. */
      o[k].classList.toggle('on', !doc && k === buf.length);
      o[k].classList.toggle('fill', k < buf.length);
    }
  }
  function msg(t, ok){
    var m = $('msg'); if(!m) return;
    m.textContent = t; m.classList.toggle('ok', !!ok);
    m.classList.remove('egg');
  }
  /* Trả lời đúng thì chữ chạy đúng dải màu Easter Egg của bản đồ — cùng một
     tông ăn mừng, để hai màn nối được vào nhau. */
  function msgDung(t){
    var m = $('msg'); if(!m) return;
    m.textContent = t; m.classList.add('ok');
    m.classList.remove('egg'); void m.getBoundingClientRect(); m.classList.add('egg');
  }
  function hintsPaint(){
    var n = st.hints[q.id]|0, h = '';
    for(var k = 0; k < n; k++) h += '<li>Gợi ý ' + (k+1) + ' · <b>' + q.hints[k] + '</b></li>';
    $('hints').innerHTML = h;
  }
  function waitPaint(){
    var el = $('wait'); if(!el) return;
    /* Đang khoá gợi ý thì ô này để TRỐNG — không treo một dòng nhắc đỏ chót
       suốt cả ván. Ai bấm SOS vẫn được trêu như thường, chỉ là không có gợi ý. */
    if(!goiYMo()){ el.innerHTML = ''; return; }
    var n = st.hints[q.id]|0;
    if(!n || n >= q.hints.length){ el.innerHTML = ''; return; }
    var con = st.hintAt + HINTW - Date.now();
    /* 30 phút thì đếm bằng giây ra "1800s" — đọc không nổi. Đổi sang phút:giây. */
    var p2 = function(n){ return (n<10?'0':'') + n; };
    el.innerHTML = con > 0
      ? '⏳ Gợi ý tiếp theo sau <b>' + Math.floor(con/60000) + ':' + p2(Math.floor(con%60000/1000)) + '</b>'
      : '';
  }
  function moGoiY(force){
    if(!goiYMo()) return false;            /* chưa tới 01-10 thì chơi chay */
    var n = st.hints[q.id]|0;
    if(n >= q.hints.length) return false;
    if(!force && n > 0 && Date.now() - st.hintAt < HINTW) return false;
    st.hints[q.id] = n + 1; st.hintAt = Date.now(); save();
    hintsPaint(); waitPaint();
    ping('han_goi_y', q.id + ' · gợi ý ' + st.hints[q.id]);
    return true;
  }
  hintsPaint(); paint(); waitPaint();
  if(doc){ napXem(); return; }          /* xem lại / đang nghỉ: dừng ở đây */
  tick = setInterval(function(){
    if(!goiYMo()) return;
    var n = st.hints[q.id]|0;
    if(n > 0 && n < q.hints.length && Date.now() - st.hintAt >= HINTW){
      moGoiY(true); msg(SOSMSG[(st.hints[q.id]|0) - 1] || SOSMSG[0], true);
    }
    waitPaint();
  }, 1000);
  setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 120);

  /* Nhánh CHỈ ĐỌC: điền sẵn đáp án (nếu đã đúng) hoặc để trống kèm đồng hồ nghỉ,
     rồi thôi — không trình nghe bàn phím, không SOS, không đồng hồ gợi ý. */
  function napXem(){
    paint();
    if(xem){ msg('Câu này xong rồi ✦ Dùng mũi tên để đi tiếp', true); return; }
    var m = $('msg');
    function dem(){
      var con = nghiDen(q) - Date.now(), p2 = function(n){ return (n<10?'0':'')+n; };
      if(con <= 0){ clearTick(); drawQ(pos); return; }
      if(m) m.innerHTML = 'Câu này đang nghỉ · mở lại sau <b>'
        + p2(Math.floor(con/36e5)) + ':' + p2(Math.floor(con%36e5/6e4)) + ':'
        + p2(Math.floor(con%6e4/1e3)) + '</b>';
    }
    dem(); tick = setInterval(dem, 1000);
  }

  function check(){
    var v = norm(inp.value);
    if(q.a.some(function(x){ return norm(x) === v; })){
      clearTick();
      ping('han_dung', q.id);
      msgDung(khen());
      st.dung[q.id] = true; st.sai[q.id] = 0;
      st.pos = (st.pos + 1) % TONG; st.hintAt = 0; save();
      drawSteps();
      /* Đợi hiệu ứng chữ chạy hết một nhịp rồi mới đổi màn — nhảy ngay sang câu
         sau là người chơi chưa kịp thấy mình vừa đúng. Đổi xong thì đứng lại
         ngay tại câu vừa làm, ô đã điền sẵn đáp án: muốn đi tiếp thì bấm mũi
         tên phải, muốn ngó lại câu cũ thì bấm mũi tên trái. */
      setTimeout(function(){
        if(soDung() >= TONG){ st.done = true; st.doneAt = Date.now(); save(); xong(true); }
        else drawQ(pos);
      }, 1900);
      return;
    }
    /* SAI: trừ lượt của PHIÊN. Cháy lượt thì gác câu này lại (nghỉ 30 phút, hoặc
       nghỉ tới mai nếu đã cháy đủ số lần trong ngày) rồi NHẢY SANG CÂU KẾ. */
    st.sai[q.id] = (st.sai[q.id]|0) + 1; save();
    ping('han_sai', q.id + ' · sai ' + st.sai[q.id] + '/' + SAI_PHIEN);
    var el = $('qTry'); if(el) el.textContent = nhanLuot(q);
    if(conSai(q) <= 0){
      clearTick();
      st.sai[q.id] = 0;
      st.chay[q.id] = (st.chay[q.id]|0) + 1;
      var hetNgay = st.chay[q.id] >= CHAY_NGAY;
      st.nghi[q.id] = hetNgay ? nuaDem() : Date.now() + NGHI;
      st.pos = (st.pos + 1) % TONG;        /* con trỏ nhích sang câu kế */
      save();
      ping('han_het_luot', q.id + (hetNgay ? ' · nghỉ tới mai' : ' · nghỉ 30 phút'));
      drawSteps();
      var ke = timCau();
      if(!ke){ drawLock(); return; }       /* hết câu chơi được → màn mời làm lại */
      drawQ();
      /* Nói rõ vì sao màn hình vừa đổi câu, không thì người chơi tưởng lỗi */
      var m = $('msg');
      if(m){
        m.innerHTML = 'Câu vừa rồi <b>gác lại</b> ' + (hetNgay ? 'tới mai' : '30 phút') + ' ✦ Qua câu khác trước nha';
        m.classList.add('ok');
      }
      return;
    }
    var moi = moGoiY(false);
    msg(moi ? 'Gợi ý nè, ngó thử ✦' : treu(), !!moi);
    buf = ''; inp.value = ''; paint();
  }
  /* Gõ đủ chữ là TỰ CHẤM (không bắt bấm Enter). Chờ CHO_CHAM một nhịp để mắt
     kịp đọc lại cả hàng ô trước khi chấm — phần này không che chữ nên không có
     nhịp hiện-rồi-che để bám vào như mấy cửa mã. Enter vẫn ăn. */
  var CHO_CHAM = 620, henCham = null;
  inp.addEventListener('input', function(){
    buf = norm(inp.value).slice(0, len); paint();
    if(henCham){ clearTimeout(henCham); henCham = null; }
    if(buf.length === len)
      henCham = setTimeout(function(){ henCham = null; if(buf.length === len) check(); }, CHO_CHAM);
  });
  inp.addEventListener('keydown', function(e){
    if(e.key !== 'Enter') return;
    e.preventDefault();
    if(buf.length !== len){ msg('Nhập đủ ' + len + ' ký tự đã nha'); return; }
    if(henCham){ clearTimeout(henCham); henCham = null; }
    check();
  });
  box.addEventListener('click', function(){ try{ inp.focus(); }catch(e){} });
  /* SOS góc trái — ĐÚNG cơ chế Mission 3: bấm 10 nhịp liên tiếp (mỗi nhịp cách
     nhau dưới 900 ms) mới lộ thêm một gợi ý; bấm một hai cái thì chỉ bị trêu.
     Gợi ý 1 vẫn tự mở khi nhập sai, gợi ý sau tự mở khi hết đồng hồ. */
  var sn = 0, sAt = 0;
  $('sos').addEventListener('click', function(){
    var now = Date.now();
    sn = (now - sAt < 900) ? sn + 1 : 1; sAt = now;
    /* Chưa tới ngày mở gợi ý: nút vẫn bấm được, vẫn trêu như thường — chỉ là
       gõ đủ 10 nhịp cũng chẳng ra chữ nào. Treo sẵn một dòng "gợi ý mở từ
       ngày X" là tự tố cáo còn thứ đang giấu, mất hết cái thú chơi chay. */
    if(!goiYMo()){
      if(sn >= 10){ sn = 0; msg(gheo(), true); return; }
      if(sn <= 2) msg(gheo(), true);
      return;
    }
    if(sn >= 10){
      sn = 0;
      if(moGoiY(true)){                 /* moGoiY tự ping, khỏi ping thêm lần nữa */
        msg(SOSMSG[(st.hints[q.id]|0) - 1] || SOSMSG[0], true);
      }else msg('Hết gợi ý rồi, tự lực nha anh ✦');
      return;
    }
    if(sn <= 2) msg(gheo(), true);
  });
}

/* ---- CẢ BỘ CÂU HỎI cùng đang nghỉ ----
   Không ép làm lại: chờ hết giờ là chơi tiếp đúng chỗ đang dở, các câu đã đúng
   vẫn giữ nguyên. Nút làm lại chỉ là lời MỜI cho ai muốn xáo bài chơi lại. */
function drawLock(){
  clearTick(); xepLai = null; gonLai(false);
  var moc = mocMoLai();
  $('stage').innerHTML =
    '<div class="card">'
    + '<p class="q-lab"><span>Đúng ' + soDung() + ' / ' + TONG + '</span>'
    + '<em>Cả ' + TONG + ' câu đang nghỉ</em></p>'
    /* Chữ và bộ icon đi CHUNG MỘT HÀNG, cỡ chữ tự co cho vừa (xem khitChao). */
    + '<div class="done-tit chao" id="chaoLai">Xíu nữa gặp lại nha'
    + '<span class="ico-hang">🏰 👸🏻 🔮 🌷</span></div>'
    + '<div class="retry">Còn <b>' + (TONG - soDung()) + '</b> câu chờ mở lại</div>'
    + '<div class="wait" id="wait" style="text-align:center"></div>'
    + '<button class="btn ghost" id="again">↻ Xáo bài chơi lại từ đầu</button>'
    + '</div>';
  function dem(){
    var el = $('wait'); if(!el) return;
    var con = (moc || nuaDem()) - Date.now(), p = function(n){ return (n<10?'0':'')+n; };
    if(con <= 0){                        /* tới giờ là tự vào chơi tiếp, khỏi bấm */
      clearTick(); drawSteps(); drawQ(); return;
    }
    el.innerHTML = 'Mở lại sau <b>' + p(Math.floor(con/36e5)) + ':'
      + p(Math.floor(con%36e5/6e4)) + ':' + p(Math.floor(con%6e4/1e3)) + '</b>';
  }
  khitChao();
  dem(); tick = setInterval(dem, 1000);
  $('again').addEventListener('click', function(){ lamLai('tự chọn xáo bài'); });
}

/* Xáo lại thứ tự + về câu đầu, xoá luôn các câu đã đúng. Lượt cháy trong NGÀY
   thì giữ — làm lại không phải là cách lách luật nghỉ. */
function lamLai(vi){
  clearTick();
  st.order = tron(TONG); st.pos = 0; st.hintAt = 0;
  st.dung = {}; st.sai = {};
  st.done = false; st.reset++;
  st.aOpen = false; st.aSai = 0;        /* reset là đóng luôn cửa mã lại */
  save(); stampText();
  ping('han_choi_lai', vi || '');
  drawLead(); drawSteps(); drawQ();
}

/* ---- HAI MŨI TÊN CHUYỂN CÂU ----
   Tối giản hết mức: hai dấu ‹ › nằm hai bên đáy thẻ, giữa là số câu. Không
   nhãn chữ, không nút to — đây là thứ để lướt qua lại, không phải thứ để nhìn.
   Đi vòng tròn: hết câu cuối thì quay về câu đầu. */
function navHTML(pos){
  return '<div class="qnav">'
    + '<button class="qnav-a" id="navL" type="button" aria-label="Câu trước">&#8249;</button>'
    + '<span class="qnav-n">' + (pos+1) + ' / ' + TONG + '</span>'
    + '<button class="qnav-a" id="navR" type="button" aria-label="Câu sau">&#8250;</button>'
    + '</div>';
}
function navGan(pos){
  var l = $('navL'), r = $('navR');
  if(l) l.addEventListener('click', function(){ drawQ(pos - 1); drawSteps(); });
  if(r) r.addEventListener('click', function(){ drawQ(pos + 1); drawSteps(); });
}

/* ---- CỬA MÃ CỦA CHÍNH TRANG NÀY ----
   Y khuôn cửa mã bên Secret Chamber: một dòng nhắc, một hàng ô, không kể lể.
   Mã lấy ở màn Easter Egg · Gate 2 — ai chưa qua đó thì có vào được trang này
   cũng đứng ngoài cửa, đúng thứ tự chặng. */
function drawGateA(){
  clearTick(); xepLai = null;
  var maA = norm(PIN_A), gapA = ranhTu(PIN_A);
  var len = maA.length, buf = '';
  $('lead').innerHTML = '<span class="lead-1">' + icoKhoa() + 'Mã mở nằm ở <b>Easter Egg · Gate 2</b></span>';
  khitLead();
  $('stage').innerHTML =
    '<div class="card">'
    + '<p class="q-lab"><span>Cửa vào</span><em>Zoey’s Castle</em></p>'
    + '<p class="q-txt">Vui lòng nhập mã ✦</p>'
    + '<div class="cells" id="cells">'
    + '<input class="inp" id="inp" type="text" autocomplete="off" autocapitalize="characters" '
    + 'autocorrect="off" spellcheck="false" aria-label="Ô nhập mã"></div>'
    + '<div class="msg" id="msg"></div>'
    + '</div>';
  var box = $('cells'), inp = $('inp'), o = xepO(box, inp, maA, gapA);
  xepLai = function(){
    var cu = box.querySelectorAll('.crow');
    for(var i = cu.length - 1; i >= 0; i--) box.removeChild(cu[i]);
    o = xepO(box, inp, maA, gapA);
    paint(-1);
  };
  /* Ký tự vừa gõ hiện rõ HIEN_MS rồi mới thành chấm — xem ghi chú ở .cell.ro */
  var HIEN_MS = 800, henChe = null;
  function paint(iRo){
    for(var k = 0; k < len; k++){
      o[k].textContent = buf[k] ? (k === iRo ? buf[k] : '•') : '';
      o[k].classList.toggle('on', k === buf.length);
      o[k].classList.toggle('fill', k < buf.length);
      o[k].classList.toggle('ro', k === iRo && k < buf.length);
    }
  }
  /* Gõ đủ ký tự là TỰ CHẤM, đúng vào nhịp ký tự cuối vừa thành chấm — nhờ vậy
     bao giờ cũng kịp nhìn thấy mình vừa gõ gì. Enter vẫn ăn. */
  function veRoiChe(){
    var i = buf.length - 1;
    if(henChe){ clearTimeout(henChe); henChe = null; }
    paint(i);
    if(i < 0) return;
    var du = buf.length === len;
    henChe = setTimeout(function(){
      henChe = null; paint(-1);
      if(du && buf.length === len) cham();
    }, HIEN_MS);
  }
  paint(-1);
  setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 120);
  box.addEventListener('click', function(){ try{ inp.focus(); }catch(e){} });
  inp.addEventListener('input', function(){
    buf = norm(inp.value).slice(0, len); veRoiChe();
  });
  function cham(){
    if(buf.length !== len) return;
    if(buf === maA){
      st.aOpen = true; save();
      ping('han_mo_cua_a', 'nhập đúng mã');
      var m = $('msg'); m.textContent = 'Đúng rồi ✦'; m.classList.add('ok');
      m.classList.remove('egg'); void m.getBoundingClientRect(); m.classList.add('egg');
      setTimeout(function(){ drawLead(); drawSteps(); drawQ(); }, 900);
    }else{
      st.aSai++; save();
      ping('han_ma_sai', 'lần ' + st.aSai);
      var m2 = $('msg');
      m2.textContent = st.aSai >= 3 ? 'Chưa đúng ✦ Mã nằm ở màn Easter Egg · Gate 2 nha' : treu();
      m2.classList.remove('ok');
      buf = ''; inp.value = ''; paint(-1);
    }
  }
  inp.addEventListener('keydown', function(e){
    if(e.key !== 'Enter') return;
    e.preventDefault();
    if(buf.length !== len) return;
    if(henChe){ clearTimeout(henChe); henChe = null; }
    paint(-1); cham();
  });
}

/* ---- CHƯA PHÁ XONG EASTER EGG ----
   Vào được đây từ khung Collected là chuyện bình thường, nhưng bộ câu hỏi chỉ
   mở sau khi giải mã xong Easter Egg. Nói thẳng một câu rồi chỉ đường về, hơn
   là để người xem đứng trước một cửa khoá mà không biết vì sao. */

       Chỉ để thử cho nhanh — người chơi thật không có lý do gì bấm vào đây. */
    + '<div class="sign" id="cuaTest">— Honghandangiu ฅ^>⩊&lt;^ ฅ</div>'

  ping('han_chua_toi_luot', TU || 'trực tiếp');
  $('veLai').addEventListener('click', function(){
    setTimeout(function(){ location.href = HREF_EGG; }, 140);
  });
  var tn = 0, tAt = 0;
  $('cuaTest').addEventListener('click', function(){

    tn = (now - tAt < 900) ? tn + 1 : 1; tAt = now;
    if(tn >= 5){

      drawLead(); drawSteps(); if(st.done) xong(false); else drawQ();

/* ---- màn hoàn thành: cấp thẳng mã ---- */
function xong(vuaXong){
  clearTick(); xepLai = null; gonLai(true);
  drawLead(); drawSteps();
  var pin = '';
  for(var k = 0; k < PIN_B.length; k++) pin += '<i>' + PIN_B[k] + '</i>';
  $('stage').innerHTML =
    '<div class="card">'
    + '<p class="q-lab pha" style="justify-content:center"><span>Phá Đảo Lòng EM</span>'
    + '<span class="tim"><i>♥</i><i>♥</i><i>♥</i></span></p>'
    + '<div class="hh-pic"><img src="/assets/HH_2_happy.webp" alt="" decoding="async"></div>'
    + '<div class="done-tit">It’s you, my kindred soul.</div>'
    + '<div class="done-txt sec">' + icoKhoa()
    +   '<span>Thương gửi anh PIN <b>Secret Chamber</b></span></div>'
    + '<div class="pin-show">' + pin + '</div>'
    + '<button class="btn" id="goB">Vào Secret Chamber ✦</button>'
    /* HAI NÚT NÀY THEO ĐÚNG BỘ NÚT CỦA HỘP PÍ MẬT ngoài bản đồ — xem
       DESIGN-SYSTEM.md §1. Con MẮT = xem lại câu trả lời (y như nút xem lại
       bối cảnh bên Easter Egg Gate 2), mũi tên QUAY VÒNG = chơi lại từ đầu.
       Trước đây hai nút này là hai ký tự ↺ ↻ gõ thẳng vào HTML: mỗi máy một
       phông nên nét dày mỏng khác nhau, cỡ cũng khác, mà lại chẳng nói lên
       nút nào làm gì — hai vòng tròn na ná nhau. Nay là SVG nên máy nào cũng
       một nét, và mỗi nút một hình rõ nghĩa. */
    + '<div class="done-ico">'
    +   '<button id="xemLai" class="tip" type="button" data-tip="Xem lại câu trả lời" '
    +     'aria-label="Xem lại câu trả lời">'
    +     '<svg viewBox="0 0 20 20" aria-hidden="true">'
    +     '<path d="M1.8 10S4.9 4.6 10 4.6 18.2 10 18.2 10 15.1 15.4 10 15.4 1.8 10 1.8 10Z"/>'
    +     '<circle cx="10" cy="10" r="2.5"/></svg></button>'
    +   '<button id="again" class="tip" type="button" data-tip="Chơi lại từ đầu" '
    +     'aria-label="Chơi lại từ đầu">'
    +     '<svg viewBox="0 0 24 24" aria-hidden="true" class="fill">'
    +     '<path d="M12 4.2V1.4L7.6 5.8 12 10.2V7.4a4.8 4.8 0 1 1-4.8 4.8H4.6A7.4 7.4 0 1 0 12 4.2Z"/>'
    +     '</svg></button>'
    + '</div>'
    + '<div class="sign">— Honghandangiu ฅ^>⩊&lt;^ ฅ</div>'
    + '</div>';
  if(vuaXong) ping('han_xong', 'đúng ' + TONG + '/' + TONG);
  $('goB').addEventListener('click', function(){
    /* KHÔNG bật cờ `bOpen` ở đây nữa. Bật sẵn tức là mở sẵn cửa mã của Secret
       Chamber trước khi người chơi kịp gõ chữ nào — mã hiện ngay trên màn hình
       này mà đi qua lại không phải nhập, thành ra cái ô mã bên đó chỉ để ngắm.
       Nay sang bên đó vẫn phải gõ đúng mã mới vào. */
    ping('han_mo_wishlist', 'từ màn hoàn thành');
    setTimeout(function(){ location.href = HREF_B; }, 150);
  });
  $('xemLai').addEventListener('click', function(){ drawQ(0); drawSteps(); });
  var ag = $('again'), armed = false;
  ag.addEventListener('click', function(){
    /* Nút chỉ có một biểu tượng nên không viết được "Chắc chưa? Bấm lần nữa"
       lên mặt nút. Đổi sang BÁO BẰNG MÀU: bấm lần đầu thì nút đỏ lên và lời
       chú thích đổi, bấm tiếp mới xoá thật. Vẫn giữ đúng hai nhịp như cũ. */
    if(!armed){
      armed = true;
      ag.classList.add('armed');
      ag.setAttribute('data-tip', 'Chắc chưa? Bấm lần nữa để xoá');
      ag.setAttribute('aria-label', 'Chắc chưa? Bấm lần nữa để xoá');
      return;
    }
    st.bOpen = false; save();
    lamLai('reset toàn bộ ở màn hoàn thành');
  });
}

/* ═══════════ 8. CỬA HẬU: HOA 5 NHỊP → BẢNG ĐIỀU PHỐI ═══════════
   Đúng vai lá cờ ngoài bản đồ: bấm 5 nhịp liên tiếp (mỗi nhịp < 0,9s). */
var ctrl = $('ctrl');
function ctrlOpen(html){ $('ctrlBody').innerHTML = html; ctrl.classList.add('on'); ctrl.setAttribute('aria-hidden','false'); }
function ctrlClose(){ ctrl.classList.remove('on'); ctrl.setAttribute('aria-hidden','true'); }
$('ctrlX').addEventListener('click', ctrlClose);
ctrl.addEventListener('click', function(e){ if(e.target === ctrl) ctrlClose(); });

function bangDieuPhoi(){
  ctrlOpen(
    /* CHÍNH DÒNG CHỮ "Khối vận hành" LÀ CỬA VÀO SỔ PHIÊN BẢN. Bấm 3 nhịp vào
       chữ rồi gõ mã là ra sổ CỦA RIÊNG TRANG NÀY — xem /assets/lichsu.js.
       Nút tròn có icon đời trước đã bỏ: dòng nhãn này đã nói đúng tên chỗ rồi,
       thêm một cái nút cạnh nó là hai thứ cùng trỏ một việc mà cái nút thì
       không nói được nó làm gì. Trỏ chuột vào chữ mới thấy nó đổi màu và nháy.
       Cửa hậu vào Khối vận hành (5 nhịp vào cụm hoa + tem) GIỮ NGUYÊN. */
    '<p class="ov-lab"><span '
    +   (window.LichSu ? LichSu.chu('HAN-A') : '') + '>Khối vận hành</span></p>'
    + '<p class="ov-txt">Tiến độ: <b>' + soDung() + '/' + TONG + '</b>'
    + (st.done ? ' · đã xong' : '') + (st.reset ? ' · R' + st.reset : '') + '</p>'
    + '<div class="ov-row">'
    + '<button class="btn ghost" id="cReset" type="button">↻ Reset</button>'
    + '<button class="btn" id="cDone" type="button">Hoàn thành</button>'
    + '</div>'
    + '<p class="msg" id="cMsg"></p>');
  var rs = $('cReset'), armed = false;
  rs.addEventListener('click', function(){
    if(!armed){ armed = true; rs.textContent = 'Bấm lần nữa để xoá'; return; }
    ping('han_dieu_phoi', 'reset');
    st.sai = {}; st.chay = {}; st.nghi = {}; st.hints = {}; st.dung = {}; st.bOpen = false;
    lamLai('bảng điều phối');
    ctrlClose();
  });
  $('cDone').addEventListener('click', hopPin);
}
/* "Hoàn thành" phải qua mã 1959 — dùng chung mã với Hack Map ngoài bản đồ */
function hopPin(){
  var len = PIN_CTRL.length, buf = '';
  /* Đúng khuôn hộp mã của Box Tổng tư lệnh ngoài bản đồ: một nhãn nhỏ, hàng ô
     gạch chân, một dòng nhắc gõ mấy số — không tiêu đề, không kể lể mã ở đâu ra. */
  ctrlOpen(
    '<p class="ov-lab">Mã truy cập</p>'
    + '<div class="pin-cells" id="pc">'
    + '<input class="inp" id="pcIn" type="text" inputmode="numeric" autocomplete="off" '
    + 'aria-label="Mã truy cập"></div>'
    + '<p class="msg hint" id="cMsg">Gõ ' + len + ' số</p>');
  var box = $('pc'), inp = $('pcIn'), o = [];
  for(var k = 0; k < len; k++){
    var c = document.createElement('span'); c.className = 'pin-cell';
    box.insertBefore(c, inp); o.push(c);
  }
  /* Ký tự vừa gõ hiện rõ HIEN_MS rồi mới thành chấm — xem ghi chú ở .cell.ro */
  var HIEN_MS = 800, henChe = null;
  function paint(iRo){
    for(var k = 0; k < len; k++){
      o[k].textContent = buf[k] ? (k === iRo ? buf[k] : '•') : '';
      o[k].classList.toggle('on', k === buf.length);
      o[k].classList.toggle('ro', k === iRo && k < buf.length);
    }
  }
  /* Gõ đủ ký tự là TỰ CHẤM, đúng vào nhịp ký tự cuối vừa thành chấm — nhờ vậy
     bao giờ cũng kịp nhìn thấy mình vừa gõ gì. Enter vẫn ăn. */
  function veRoiChe(){
    var i = buf.length - 1;
    if(henChe){ clearTimeout(henChe); henChe = null; }
    paint(i);
    if(i < 0) return;
    var du = buf.length === len;
    henChe = setTimeout(function(){
      henChe = null; paint(-1);
      if(du && buf.length === len) cham();
    }, HIEN_MS);
  }
  paint(-1);
  setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 90);
  box.addEventListener('click', function(){ try{ inp.focus(); }catch(e){} });
  inp.addEventListener('input', function(){
    buf = (inp.value||'').replace(/\D/g,'').slice(0, len); veRoiChe();
  });
  function cham(){
    if(buf.length !== len) return;
    if(buf === PIN_CTRL){
      ping('han_dieu_phoi', 'hoàn thành bằng mã');
      for(var z = 0; z < TONG; z++) st.dung[HOI[z].id] = true;
      st.done = true; st.doneAt = Date.now(); save();
      ctrlClose(); xong(true);
    }else{
      $('cMsg').textContent = 'Sai mã rồi ✦'; $('cMsg').className = 'msg'; $('cMsg').classList.remove('ok');
      buf = ''; inp.value = ''; paint(-1);
    }
  }
  inp.addEventListener('keydown', function(e){
    if(e.key !== 'Enter') return;
    e.preventDefault();
    if(buf.length !== len) return;
    if(henChe){ clearTimeout(henChe); henChe = null; }
    paint(-1); cham();
  });
}
/* Vùng bấm là CẢ CỤM hoa + dòng tem, y như cửa hậu ngoài bản đồ nhận cả dòng
   bản quyền chứ không riêng lá cờ 15px — trên điện thoại dễ trúng hơn hẳn.
   Nhấp nháy thì vẫn chỉ mình bông hoa. */
var fn = 0, fAt = 0;
$('stampzone').addEventListener('click', function(){
  var now = Date.now();
  fn = (now - fAt < 900) ? fn + 1 : 1; fAt = now;
  var el = $('flow');
  el.classList.add('warm');
  setTimeout(function(){ el.classList.remove('warm'); }, 260);
  if(fn >= 5){ fn = 0; ping('han_cua_hau', 'mở khối vận hành'); bangDieuPhoi(); }
});

addEventListener('pagehide', function(){

});
})();
